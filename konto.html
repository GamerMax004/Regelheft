<head>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Regelheft">

<meta name="copyright" content="Copyright © Gölitzer Development">
<meta name="robots" content="noindex">

<link rel="stylesheet" href="assets/css/fonts.css?v=20261029a">
<link rel="stylesheet" href="assets/css/style.css?v=20261029a">
<link rel="stylesheet" href="assets/css/footer.css?v=20261029a">
<link rel="stylesheet" href="assets/css/seiten.css?v=20261029a">
<link rel="stylesheet" href="assets/css/theme.css?v=20261029a">
<link rel="stylesheet" href="assets/css/header.css?v=20261029a">
</head>
<body>

<header class="top">
  <div class="toprow"><a class="brand" href="index.html"><h1>Regelheft<span> Mathematik</span></h1></a><div data-account></div></div>
</header>

<main>
<div class="page page--narrow">
  <h2 class="page-title">Mein Konto</h2>
  <p class="page-lead" id="kontoLoading">Lade …</p>
  <div class="is-hidden" id="kontoApp">
    <div class="auth-success">Angemeldet als <b id="kontoUser"></b></div>
    <div class="btn-row">
      <a class="ai-btn" href="ki.html">KI-Aufgabenhilfe</a>
      <button class="ai-btn ghost" id="kontoClearRecent" type="button">Verlauf „Zuletzt geöffnet“ löschen</button>
      <a class="ai-btn ghost is-hidden" id="kontoDash" href="dashboard.html">Dashboard</a>
      <button class="ai-btn ghost" id="kontoLogout" type="button">Abmelden</button>
    </div>

    <div class="card-sec" id="kEmail"><h3>E-Mail-Adresse</h3>
      <div class="status-line"><span id="kMail"></span><span id="kMailBadge" class="badge-ok is-hidden"></span></div>
      <div class="btn-row"><button class="ai-btn ghost" id="kMailBtn" type="button">E-Mail angeben</button></div>
    </div>

    <div class="card-sec is-hidden" id="kPro"><h3><span class="crown-ic" data-icon="crown" data-size="18" style="display:inline-flex;vertical-align:-3px;margin-right:6px"></span>Regelheft Pro</h3>
      <div class="status-line" id="kProLine"></div>
      <div class="btn-row" id="kProBtns"></div>
      <div class="page-note is-hidden" id="kCancelBox"><b>Pro wirklich kündigen?</b><br><span id="kCancelTxt"></span>
        <div class="btn-row"><button class="ai-btn ai-del" id="kCancelYes" type="button">Ja, jetzt kündigen</button><button class="ai-btn ghost" id="kCancelNo" type="button">Abbrechen</button></div>
        <div class="auth-err" id="kProErr" role="alert"></div></div>
    </div>

    <div class="danger-zone">
      <h3>Konto löschen</h3>
      <p>Dein Konto, alle gespeicherten Chats und alle Anmeldungen werden unwiderruflich gelöscht.</p>
      <button class="ai-btn ai-del" id="delStart" type="button">Konto löschen</button>
      <div class="is-hidden" id="delBox">
        <p style="margin-top:12px">Gib zur Bestätigung dein Passwort ein.</p>
        <input class="auth-in" id="delPw" type="password" autocomplete="current-password" placeholder="Passwort">
        <div class="auth-err" id="delErr" role="alert"></div>
        <button class="ai-btn ai-del" id="delGo" type="button" style="background:#b91c1c;color:#fff;border-color:#b91c1c">Endgültig löschen</button>
        <button class="ai-btn ghost" id="delCancel" type="button">Abbrechen</button>
      </div>
    </div>
  </div>
</div>
</main>

<footer id="siteFooter"></footer>

<script src="assets/js/config.js?v=20261029a"></script>
<script src="assets/js/footer.js?v=20261029a"></script>

<script src="assets/js/layout.js?v=20261029a"></script>
<script src="assets/js/konto.js?v=20261029a"></script>
</body>
</html>
