<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header class="top">
  <div class="toprow"><a class="brand" href="index.html"><h1>Regelheft<span> Mathematik</span></h1></a><div data-account></div></div>
</header>

<main id="main" tabindex="-1">
<div class="page page--konto u-root">
  <h2 class="page-title">Mein Konto</h2>
  <div class="u-skel" id="kontoLoading" role="status" aria-label="Lädt"><i></i><i></i><i></i></div>
  <div class="u-hidden" id="kontoApp">

    <div class="u-hero">
      <span class="u-av" id="kontoAv" aria-hidden="true">?</span>
      <div class="u-hero-tx"><b id="kontoUser"></b><div class="u-row-flex" id="kontoBadges"></div></div>
      <div class="u-row-flex">
        <a class="u-btn ghost sm u-hidden" id="kontoDash" href="dashboard.html"><span data-icon="dashboard" data-size="16" style="display:inline-flex"></span>Dashboard</a>
        <button class="u-btn ghost sm" id="kontoLogout" type="button"><span data-icon="logout" data-size="16" style="display:inline-flex"></span>Abmelden</button>
      </div>
    </div>

    <div class="u-card u-hidden" id="kPro">
      <div class="u-card-h"><span data-icon="crown" data-size="18" style="display:inline-flex"></span>Tarif</div>
      <div class="u-plan"><span class="u-plan-ic" id="kPlanIc"></span><div class="u-plan-tx"><b id="kPlanName"></b><span class="u-sub" id="kPlanSub"></span></div></div>
      <div id="kQuota" class="u-hidden"><div class="u-meter"><i id="kQuotaBar"></i></div><div class="u-sub" id="kQuotaTx"></div></div>
      <div class="u-actions" id="kProBtns" style="margin-top:12px"></div>
      <div class="u-confirm u-hidden" id="kCancelBox">
        <div><b>Tarif wirklich kündigen?</b><br><span id="kCancelTxt"></span></div>
        <div class="u-actions"><button class="u-btn danger solid" id="kCancelYes" type="button">Ja, kündigen</button><button class="u-btn ghost" id="kCancelNo" type="button">Behalten</button></div>
      </div>
      <div class="u-msg err" id="kProErr" role="alert"></div>
    </div>

    <div class="u-card">
      <div class="u-card-h"><span data-icon="mail" data-size="18" style="display:inline-flex"></span>E-Mail</div>
      <div class="u-row-flex" style="justify-content:space-between"><span id="kMail" style="min-width:0;overflow-wrap:anywhere"></span><span id="kMailBadge" class="u-badge u-hidden"></span></div>
      <button class="u-btn ghost sm" id="kMailBtn" type="button" style="margin-top:12px">E-Mail angeben</button>
    </div>

    <div class="u-card">
      <div class="u-card-h"><span data-icon="sparkles" data-size="18" style="display:inline-flex"></span>Schnellzugriff</div>
      <div class="u-links">
        <a class="u-btn ghost" href="ki.html" id="kLinkKi">KI-Aufgabenhilfe</a>
        <a class="u-btn ghost" href="ueben.html" id="kLinkUeben">Üben mit Karteikarten</a>
        <button class="u-btn ghost" id="kontoClearRecent" type="button">Verlauf löschen</button>
      </div>
    </div>

    <div class="u-acc u-danger" id="kDanger">
      <button type="button" class="u-acc-h" aria-expanded="false"><span data-icon="trash" data-size="18" style="display:inline-flex"></span><span class="u-grow">Konto löschen</span><span class="u-chev" data-icon="chevron-down" data-size="18"></span></button>
      <div class="u-acc-b"><div class="u-acc-in">
        <div class="u-sub" style="margin-bottom:12px">Konto, Chats und Anmeldungen werden unwiderruflich gelöscht. Ein laufendes Abo wird beendet.</div>
        <input class="u-in" id="delPw" type="password" autocomplete="current-password" placeholder="Passwort zur Bestätigung">
        <div class="u-msg err" id="delErr" role="alert"></div>
        <button class="u-btn danger solid block" id="delGo" type="button" style="margin-top:10px">Endgültig löschen</button>
      </div></div>
    </div>
  </div>
</div>
</main>

<footer id="siteFooter"></footer>
