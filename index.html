134.88000000000005,239.4251497005988 137.44000000000005,239.71929824561403 140.00000000000006,240.0 142.56000000000006,240.268156424581 145.12000000000006,240.52459016393442 147.68000000000006,240.77005347593584 150.24000000000007,241.00523560209425 152.80000000000007,241.23076923076923 155.36000000000007,241.44723618090453 157.92000000000007,241.6551724137931 160.48000000000008,241.85507246376812 163.04000000000008,242.04739336492892 165.60000000000008,242.2325581395349 168.16000000000008,242.4109589041096 170.72000000000008,242.5829596412556 173.2800000000001,242.7488986784141 175.8400000000001,242.9090909090909 178.4000000000001,243.06382978723406 180.9600000000001,243.2133891213389 183.5200000000001,243.35802469135803 186.0800000000001,243.49797570850203 188.6400000000001,243.63346613545818 191.2000000000001,243.76470588235296 193.7600000000001,243.8918918918919 196.3200000000001,244.01520912547528 198.8800000000001,244.13483146067415 201.4400000000001,244.2509225092251 204.0000000000001,244.36363636363637 206.56000000000012,244.4731182795699 209.12000000000012,244.57950530035336 211.68000000000012,244.6829268292683 214.24000000000012,244.7835051546392 216.80000000000013,244.8813559322034 219.36000000000013,244.97658862876256 221.92000000000013,245.06930693069307 224.48000000000013,245.15960912052117 227.04000000000013,245.2475884244373 229.60000000000014,245.33333333333334 232.16000000000014,245.41692789968653 234.72000000000014,245.4984520123839 237.28000000000014,245.57798165137615 239.84000000000015,245.65558912386706 242.40000000000015,245.7313432835821 244.96000000000015,245.8053097345133 247.52000000000015,245.87755102040816 250.08000000000015,245.94812680115274\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/><polyline points=\"\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/></svg>"}, {"title": "Zusammenfassung antiproportionale Zuordnungen", "page": 29, "body": "Für antiproportionale Zuordnungen gilt:\n- zum Doppelten von x gehört die Hälfte von y.\n- zum Berechnen fehlender Größen kann man den Dreisatz verwenden.\n- alle Wertepaare sind produktgleich (x-Wert · y-Wert), das Produkt nennt man Antiproportionalitätskonstante p = x·y.\n- Die Formel lautet y = p/x.\n- Der Graph ist eine Hyperbel.", "category": "Zuordnungen & Prozent-Grundlagen", "id": "r58", "diagram": null}, {"title": "Grundbegriffe der Prozentrechnung", "page": 29, "body": "Der Grundwert \"G\" steht für das Ganze.\nDer betrachtete Teil des Grundwerts heißt Prozentwert \"W\". Er hat immer dieselbe Einheit wie der Grundwert.\nDer Prozentsatz \"p\" gibt den Anteil des Prozentwerts am Grundwert in % an.\nBeispiel: 1kg (G) Schokolade besteht zu 31% (p) aus Fett. Das sind 310g (W).", "category": "Zuordnungen & Prozent-Grundlagen", "id": "r59", "diagram": null}, {"title": "Grundaufgaben der Prozentrechnung", "page": 30, "body": "In der Prozentrechnung sind grundsätzlich 3 verschiedene Aufgabentypen denkbar: p/W/G gesucht.\nTabelle: geg. G,W -> ges. p -> Formel p=W/G\ngeg. G,p -> ges. W -> Formel W=p·G\ngeg. W,p -> ges. G -> Formel G=W/p\nMerkhilfe-Dreieck: W oben, P·G unten. Die Größe, die man berechnen möchte, deckt man mit der Hand ab.", "category": "Prozentrechnung & Zinsen", "id": "r60", "diagram": null}, {"title": "Unterjährige Zinsen", "page": 30, "body": "Die Bank rechnet grundsätzlich mit 30 Tagen pro Monat und mit 360 Tagen im Jahr.\nWenn Geld für t Tage (weniger als 1 Jahr) angelegt wird, erhält man nur t/360 der Jahreszinsen.\nDaraus ergibt sich die Formel: W = t/360 · p · G (nur Zinsen)\nMit Hilfe dieser Formel kann man in Textaufgaben auch andere gesuchte Größen (z.B. die Zeit in Tagen/den Zinssatz/das angelegte Guthaben) berechnen.\nBeispiel: Wie lange war ein Guthaben von 1200€ bei einem Zinssatz von 2,75% auf einem Konto, wenn es sich auf 1211€ erhöht hat?\ngeg.: G=1200€, W=11€, p=2,75%. 11 = t/360 · 0,0275 · 1200 -> 11 = 11/120 · t -> t = 11:11/120 = 120. Das Geld war 120 Tage auf dem Konto.\nVorgehensweise: 1. Einsetzen 2. Vereinfachen (TR!) 3. Umkehraufgabe lösen 4. Antwort (evtl. Probe)", "category": "Prozentrechnung & Zinsen", "id": "r61", "diagram": null}, {"title": "Äquivalente Terme / Terme vereinfachen", "page": 31, "body": "Wenn man einen Term mit einer Variable mithilfe der bekannten Rechenregeln für rationale Zahlen umformt, erhält man einen äquivalenten (gleichwertigen) Term: die Terme haben für jede eingesetzte Zahl denselben Wert.\nVorgehensweise beim Vereinfachen:\n1) Man ordnet die Summanden mit und die ohne Variable.\n2) Man fasst die Summanden mit Variable und die ohne jeweils einzeln zusammen.\nBeispiel: -1·x-1+5+6·x = -1·x+6·x-1+5 = 5·x-6 (also -x-1+5+6x = -x+6x-1+5 = 5x-6)\nBeispiel: a+2a-3a+a+4 = a+4", "category": "Terme & Gleichungen", "id": "r62", "diagram": null}, {"title": "Ausmultiplizieren und Ausklammern - das Distributivgesetz", "page": 31, "body": "Beim Multiplizieren einer Zahl mit einer Summe oder Differenz wird jeder Term in der Klammer mit der Zahl multipliziert. Dabei muss auf die Rechenzeichen geachtet werden!\nBeispiele: 1) 2·(x+7) = 2·x+7·2 = 2x+14\n2) (-3)·(4+2b) = (-3)·4+2b·(-3) = -12-6b\n3) -2·(6-3z) = -2·6-(-2)·3z = -12+6z\n4) -4·(-2-5l) = -4·(-2)-(-4)·5l = 8+20l", "category": "Terme & Gleichungen", "id": "r63", "diagram": null}, {"title": "Gleichungen aufstellen und lösen", "page": 32, "body": "Wenn der Wert eines Terms gegeben ist und man die passende Variable sucht, stellt man eine Gleichung auf.\nBeispiel: Für welches x nimmt der Term 3x-5 den Wert 31 an? Gleichung: 3x-5=31\nEine Zahl heißt Lösung einer Gleichung, wenn die Terme auf beiden Seiten der Gleichung beim Einsetzen denselben Wert haben.\nBeispiel: Die Zahl 12 ist Lösung dieser Gleichung, denn: 3·12-5=31. Die Zahl 1 ist nicht eine Lösung der Gleichung, denn: 3·1-5≠31", "category": "Terme & Gleichungen", "id": "r64", "diagram": null}, {"title": "Gleichungen lösen durch Rückwärtsrechnen", "page": 32, "body": "Man schaut sich an, welche Rechenschritte in welcher Reihenfolge mit der Variablen durchgeführt wurden, und rechnet sie dann rückwärts, um die Lösung für die Variable zu ermitteln.\nBeispiel: 103+2,5x=163. Rückwärts: 163-103=60; 60:2,5=24. x=24. Probe: 103+2,5·24=163\nErgebnis für x angeben; das gefundene x in die Ausgangsgleichung einsetzen und prüfen, ob man wirklich das angegebene Ergebnis erhält.", "category": "Terme & Gleichungen", "id": "r65", "diagram": null}, {"title": "Rechnen mit der Waage - Gleichungen lösen", "page": 33, "body": "Mithilfe einer Balkenwaage und 1kg-Gewichten kann man durch geschicktes Entfernen von Gewichten und Steinen herausfinden, wie schwer ein Ziegelstein ist.\nMithilfe von Äquivalenzumformungen kann man durch geschicktes Entfernen oder Hinzufügen von Zahlen oder Termen eine Gleichung lösen.\nBeispiel: 5x+2=2x+8 |-2 -> 5x=2x+6 |-2x -> 3x=6 |:3 -> 1x=2\nAlle Zahlen, die beim Einsetzen für die Variable x eine Gleichung erfüllen, heißen Lösung der Gleichung. Gleichungen lassen sich mithilfe von Umformungen auf beiden Seiten des Gleichheitszeichens lösen (Äquivalenzumformungen).\nWichtige Äquivalenzumformungen von Gleichungen sind:\n- beidseitige Addition oder Subtraktion einer Zahl oder eines Terms,\n- beidseitige Multiplikation oder Division mit einer Zahl ungleich Null.\n\nAllgemeine Strategie beim Umformen von Gleichungen:\n1. Beide Seiten der Gleichung vereinfachen\n2. Alle Terme ohne Variable auf eine Seite bringen\n3. Alle Terme mit Variable auf die andere Seite bringen\n4. Die Variable muss alleine stehen (1·x)\n5. (Probe)", "category": "Terme & Gleichungen", "id": "r66", "diagram": "<svg viewBox=\"0 0 280 160\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <line x1=\"140\" y1=\"34\" x2=\"140\" y2=\"66\" stroke=\"#1f2937\" stroke-width=\"3\"/>\n    <line x1=\"55\" y1=\"66\" x2=\"225\" y2=\"66\" stroke=\"#1f2937\" stroke-width=\"3\"/>\n    <line x1=\"55\" y1=\"66\" x2=\"55\" y2=\"96\" stroke=\"#1f2937\" stroke-width=\"1.6\"/>\n    <line x1=\"225\" y1=\"66\" x2=\"225\" y2=\"96\" stroke=\"#1f2937\" stroke-width=\"1.6\"/>\n    <path d=\"M 30 96 Q 55 122 80 96 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.6\"/>\n    <path d=\"M 200 96 Q 225 122 250 96 Z\" fill=\"#fdf1ec\" stroke=\"#0d9488\" stroke-width=\"1.6\"/>\n    <polygon points=\"140,10 152,34 128,34\" fill=\"#1f2937\"/>\n    <rect x=\"126\" y=\"140\" width=\"28\" height=\"8\" fill=\"#1f2937\"/>\n    <rect x=\"136\" y=\"96\" width=\"8\" height=\"44\" fill=\"#1f2937\"/>\n    <text x=\"55\" y=\"112\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"700\" text-anchor=\"middle\">x</text>\n    <text x=\"225\" y=\"112\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"700\" text-anchor=\"middle\">=</text>\n    </svg>"}, {"title": "Ergänzung zu Äquivalenzumformungen - Äquivalenzpfeil", "page": 34, "body": "Beispiel: 5x+2=2x+8 |-2 <=> 5x=2x+6 |-2x <=> 3x=6 |:3 <=> 1x=2. Lösungsmenge L={2}. Der Doppelpfeil <=> heißt Äquivalenzpfeil.", "category": "Terme & Gleichungen", "id": "r67", "diagram": null}, {"title": "Lösungsmengen von Gleichungen", "page": 34, "body": "Beim Lösen von Gleichungen kann es manchmal zu seltsamen Sonderfällen kommen:\nFall 1: 2x-7=6x+10-4x <=> 0≠17 -> Widerspruch. Es gibt keine Lösung. L={}\nFall 2: 2x-7=6x-7-4x <=> 0=0 -> allgemeingültige Aussage. Es gibt unendlich viele Lösungen. L={Q} (rationale Zahlen)\nFall 3: 2x-7=6x+10-3x <=> x=-17 -> eindeutige Lösung für x. L={-17}", "category": "Terme & Gleichungen", "id": "r68", "diagram": null}, {"title": "Wann ist ein Bruchterm definiert", "page": 35, "body": "Da man nicht durch Null teilen darf (Niemals!!!), ist ein Bruchterm nicht definiert, wenn der Nenner 0 wird. Bevor man mit Bruchtermen rechnet, bestimmt man also, für welche Werte sie nicht definiert sind.\nBeispiel: (3x-2)/(3·(3+x)). Nenner gleich Null setzen: 3·(3+x)=0 |T -> 9+3x=0 |-9 -> 3x=-9 |:3 -> x=-3. Für den Bruchterm muss gelten x≠-3.", "category": "Bruchterme & Winkelbeziehungen", "id": "r69", "diagram": null}, {"title": "Addieren und Subtrahieren von Bruchtermen", "page": 35, "body": "Auch beim Addieren/Subtrahieren von Bruchtermen müssen die Brüche auf denselben Nenner gebracht werden.\nBeispiel a) 8/x + 3/2x = 16/2x + 3/2x = 19/2x, x≠0\nBeispiel b) 2/(x-3) - 4/x = 2x/(x·(x-3)) - 4(x-3)/(x·(x-3)) = (2x-4(x-3))/(x·(x-3)) = (2x-4x+12)/(x·(x-3)) = (-2x+12)/(x·(x-3)), x≠0 und 3", "category": "Bruchterme & Winkelbeziehungen", "id": "r70", "diagram": null}, {"title": "Lösen von Bruchgleichungen", "page": 36, "body": "1) prüfen, für welche x einzelne Bruchterme nicht definiert sind.\n2) beide Seiten der Gleichung mit dem gemeinsamen Nenner der Bruchterme multiplizieren.\n3) Man löst diese Gleichung mithilfe von Äquivalenzumformungen.\n4) Man führt eine Probe durch.\nBeispiel: 1/x+4/3x=7 |T, x≠0 <=> 3/3x+4/3x=7 <=> 7/3x=7 |·3x <=> 7=7·3x <=> 7=21x |:21 <=> 1/3=x. L={1/3}\nProbe: 1/(1/3)+4/(3·1/3)=3+4=7 ✓", "category": "Bruchterme & Winkelbeziehungen", "id": "r71", "diagram": null}, {"title": "Winkelbeziehungen an sich schneidenden Geraden", "page": 36, "body": "Wenn sich zwei Geraden schneiden, dann...\n...ergänzen sich Nebenwinkel zu 180° (α+β=180°)\n...sind Scheitelwinkel gleich groß (γ=δ)", "category": "Bruchterme & Winkelbeziehungen", "id": "r72", "diagram": "<svg viewBox=\"0 0 300 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"20\" y1=\"60\" x2=\"280\" y2=\"60\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"20\" y1=\"180\" x2=\"280\" y2=\"180\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"80\" y1=\"20\" x2=\"220\" y2=\"220\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"285\" y=\"64\" font-size=\"13\" fill=\"#94a3b8\">g</text><text x=\"285\" y=\"184\" font-size=\"13\" fill=\"#94a3b8\">h</text><text x=\"222\" y=\"222\" font-size=\"13\" fill=\"#94a3b8\">k</text><text x=\"122.0\" y=\"80\" font-size=\"15\" fill=\"#0d9488\" font-weight=\"700\">α</text><text x=\"206.0\" y=\"172\" font-size=\"15\" fill=\"#0d9488\" font-weight=\"700\">β</text></svg>"}, {"title": "Stufenwinkel und Wechselwinkel", "page": 37, "body": "Wenn zwei parallele Geraden g und h von einer dritten Gerade k geschnitten werden, dann...\n...sind die Stufenwinkel α und β gleich groß (α=β)\n...sind die Wechselwinkel γ und δ gleich groß (Kombination von Scheitel- und Stufenwinkel)", "category": "Dreieckskonstruktionen", "id": "r73", "diagram": "<svg viewBox=\"0 0 300 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"20\" y1=\"60\" x2=\"280\" y2=\"60\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"20\" y1=\"180\" x2=\"280\" y2=\"180\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"80\" y1=\"20\" x2=\"220\" y2=\"220\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"285\" y=\"64\" font-size=\"13\" fill=\"#94a3b8\">g</text><text x=\"285\" y=\"184\" font-size=\"13\" fill=\"#94a3b8\">h</text><text x=\"222\" y=\"222\" font-size=\"13\" fill=\"#94a3b8\">k</text><text x=\"86.0\" y=\"80\" font-size=\"15\" fill=\"#0d9488\" font-weight=\"700\">γ</text><text x=\"206.0\" y=\"172\" font-size=\"15\" fill=\"#0d9488\" font-weight=\"700\">δ</text></svg>"}, {"title": "Innenwinkelsatz für Dreiecke", "page": 37, "body": "In jedem Dreieck gilt: α+β+γ = 180°", "category": "Dreieckskonstruktionen", "id": "r74", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">c</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">b</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">β</text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">γ</text></svg>"}, {"title": "Vorgehen bei Dreieckskonstruktionen", "page": 37, "body": "1) Planfigur skizzieren und gegebene Größen markieren\n2) Konstruktionsschritte festlegen und ggf. Konstruktionsbeschreibung\n3) Konstruktion ausführen", "category": "Dreieckskonstruktionen", "id": "r75", "diagram": null}, {"title": "Übersicht Dreieckskonstruktionen (SSS und SSW)", "page": 38, "body": "Fall A (SSS): a=6,4cm; b=3,5cm; c=5,3cm\n1) Zeichne eine Planfigur.\n2) Zeichne die Strecke AB mit c=5,3cm.\n3) Zeichne einen Kreis um A mit dem Radius b=3,5cm.\n4) Zeichne einen Kreis um B mit dem Radius a=6,4cm.\n5) Nenne einen der Schnittpunkte der beiden Kreise C.\n6) Zeichne die Strecken AC und BC. ABC ist das gesuchte Dreieck.\nFehlende Größen: α=91°, β=33,1°, γ=55,9°\n\nFall B (SSW): b=6,8cm; c=5,2cm; β=75°\n1) Zeichne eine Planfigur.\n2) Zeichne die Strecke AB mit c=5,2cm.\n3) Trage in B an AB den Winkel β=75° an.\n4) Zeichne einen Kreis um A mit dem Radius b=6,8cm.\n5) Nenne einen der Schnittpunkte des Kreises mit dem freien Schenkel des Winkels β C.\n6) Zeichne die Strecke AC. ABC ist das gesuchte Dreieck.\nFehlende Größen: a=5,9cm, α=57,4°, γ=47,6°", "category": "Dreieckskonstruktionen", "id": "r76", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">c</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">b</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">β</text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">γ</text><text x=\"150\" y=\"235\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">SSS / SSW</text></svg>"}, {"title": "Übersicht Dreieckskonstruktionen (SWS und WSW)", "page": 39, "body": "Fall C (SWS): a=3,6cm; c=5,8cm; β=37°\n1) Zeichne eine Planfigur.\n2) Zeichne die Strecke AB mit c=5,8cm.\n3) Trage in B an AB den Winkel β=37° an.\n4) Zeichne einen Kreis um B mit dem Radius a=3,6cm.\n5) Nenne einen der Schnittpunkte des Kreises mit dem freien Schenkel des Winkels β C.\n6) Zeichne die Strecke AC. ABC ist das gesuchte Dreieck.\nFehlende Größen: b=3,6cm, α=36,5°, γ=106,5°\n\nFall D (WSW): a=7,2cm; β=32°; γ=68°\n1) Zeichne eine Planfigur.\n2) Zeichne die Strecke BC mit a=7,2cm.\n3) Trage in B an BC den Winkel β=32° an.\n4) Trage in C an CB den Winkel γ=68° an.\n5) Nenne den Schnittpunkt der beiden freien Schenkel A.\n6) ABC ist das gesuchte Dreieck.\nFehlende Größen: b=3,9cm, c=6,8cm, α=80°", "category": "Dreieckskonstruktionen", "id": "r77", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">c</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">b</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">β</text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">γ</text><text x=\"150\" y=\"235\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">SWS / WSW</text></svg>"}, {"title": "Zuordnungen", "page": 40, "body": "Eine Zuordnung bildet Elemente eines Definitionsbereichs nach einer Zuordnungsvorschrift auf Elemente eines Wertebereichs ab.", "category": "Funktionen & Lineare Funktionen", "id": "r78", "diagram": "<svg viewBox=\"0 0 300 220\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <rect x=\"20\" y=\"20\" width=\"60\" height=\"160\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.5\"/>\n    <rect x=\"220\" y=\"20\" width=\"60\" height=\"160\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"1.5\"/>\n    <circle cx=\"50\" cy=\"55\" r=\"5\" fill=\"#1f2937\"/>\n    <circle cx=\"50\" cy=\"100\" r=\"5\" fill=\"#1f2937\"/>\n    <circle cx=\"50\" cy=\"145\" r=\"5\" fill=\"#1f2937\"/>\n    <circle cx=\"250\" cy=\"55\" r=\"5\" fill=\"#1f2937\"/>\n    <circle cx=\"250\" cy=\"100\" r=\"5\" fill=\"#1f2937\"/>\n    <circle cx=\"250\" cy=\"145\" r=\"5\" fill=\"#1f2937\"/>\n    <line x1=\"55\" y1=\"55\" x2=\"245\" y2=\"100\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/>\n    <line x1=\"55\" y1=\"100\" x2=\"245\" y2=\"145\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/>\n    <line x1=\"55\" y1=\"145\" x2=\"245\" y2=\"145\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/>\n    <text x=\"30\" y=\"205\" font-size=\"11.5\" fill=\"#94a3b8\">Definitionsbereich</text>\n    <text x=\"228\" y=\"205\" font-size=\"11.5\" fill=\"#94a3b8\">Wertebereich</text>\n    <defs><marker id=\"ah\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"><polygon points=\"0,0 7,3.5 0,7\" fill=\"#4f46e5\"/></marker></defs>\n    </svg>"}, {"title": "Eindeutige Zuordnungen", "page": 40, "body": "Eine eindeutige Zuordnung ist eine Zuordnung, in der ein Element des Definitionsbereichs maximal einem Element des Wertebereichs zugeordnet wird.", "category": "Funktionen & Lineare Funktionen", "id": "r79", "diagram": null}, {"title": "Funktionen", "page": 40, "body": "Eine Funktion ist eine eindeutige Zuordnung, in welcher sowohl der Definitionsbereich als auch der Wertebereich alle reellen Zahlen sind.\nBeispiel: 2x+1; 1/3x-25\nGegenbeispiel (keine Funktion, da mehrere Variablen): ax+cy+nxy", "category": "Funktionen & Lineare Funktionen", "id": "r80", "diagram": null}, {"title": "Korrekte Schreibweise von Funktionen", "page": 41, "body": "f(x) = 5x+6: \"f\" ist der Name der Funktion, \"x\" ist der Name/Variable der x-Achse, \"5x+6\" ist der Funktionsterm. Wird gelesen als \"f von x ist gleich 5x+6\".\nAnderes Beispiel: g(h) = 6h+5", "category": "Funktionen & Lineare Funktionen", "id": "r81", "diagram": null}, {"title": "Lineare Funktionen", "page": 41, "body": "Eine lineare Funktion ist eine Funktion, welche durch den Term f(x) = m·x+b definiert wird. Der Graph von f ist eine Gerade.\nf(x) = m·x + b, wobei m die Steigung und b der y-Achsenabschnitt ist.\nAllgemeine Bauart: f(x) = m·x+b\nBeispiele: f(x)=3x+5; g(x)=-7x-5; h(x)=5-x\nSonderfall konstante Funktion : i(x)=-7 bzw. i(x)=0x-7 heißt konstante Funktion.", "category": "Funktionen & Lineare Funktionen", "id": "r82", "diagram": null}, {"title": "Steigungsdreieck und Ablesen von m und b", "page": 42, "body": "f(x) = m·x+b\n1) Um den Wert für b abzulesen (y-Achsenabschnitt), schauen wir, wo der Graph von f die y-Achse schneidet. Hier gilt b=1.\n2) Die Steigung entspricht immer: m = Δy/Δx = 3/2 = 1,5", "category": "Funktionen & Lineare Funktionen", "id": "r83", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"72.80000000000001\" y1=\"28\" x2=\"72.80000000000001\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"117.60000000000001\" y1=\"28\" x2=\"117.60000000000001\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"162.4\" y1=\"28\" x2=\"162.4\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"207.20000000000002\" y1=\"28\" x2=\"207.20000000000002\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"214.66666666666669\" x2=\"252\" y2=\"214.66666666666669\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"177.33333333333334\" x2=\"252\" y2=\"177.33333333333334\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"140.0\" x2=\"252\" y2=\"140.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"102.66666666666669\" x2=\"252\" y2=\"102.66666666666669\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"65.33333333333331\" x2=\"252\" y2=\"65.33333333333331\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"28.0\" x2=\"252\" y2=\"28.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"214.66666666666669\" x2=\"252\" y2=\"214.66666666666669\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"72.80000000000001\" y1=\"252\" x2=\"72.80000000000001\" y2=\"28\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"258\" y=\"218.66666666666669\" font-size=\"12\" fill=\"#94a3b8\">x</text><text x=\"58.80000000000001\" y=\"24\" font-size=\"12\" fill=\"#94a3b8\">y</text><line x1=\"28.0\" y1=\"233.33333333333334\" x2=\"252.0\" y2=\"-46.66666666666663\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/><text x=\"234.07999999999998\" y=\"-32.26666666666665\" font-size=\"12.5\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"end\">f(x)=1,5x+1</text></svg>"}, {"title": "Nullstellen", "page": 42, "body": "Sei f(x) eine Funktion (egal welche), dann hat f(x) genau dort Nullstellen, wo der Graph die x-Achse schneidet.", "category": "Funktionen & Lineare Funktionen", "id": "r84", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"65.33333333333333\" y1=\"28\" x2=\"65.33333333333333\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"102.66666666666666\" y1=\"28\" x2=\"102.66666666666666\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"140.0\" y1=\"28\" x2=\"140.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"177.33333333333331\" y1=\"28\" x2=\"177.33333333333331\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"214.66666666666669\" y1=\"28\" x2=\"214.66666666666669\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"214.66666666666669\" x2=\"252\" y2=\"214.66666666666669\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"177.33333333333334\" x2=\"252\" y2=\"177.33333333333334\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"140.0\" x2=\"252\" y2=\"140.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"102.66666666666669\" x2=\"252\" y2=\"102.66666666666669\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"65.33333333333331\" x2=\"252\" y2=\"65.33333333333331\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"28.0\" x2=\"252\" y2=\"28.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"140.0\" x2=\"252\" y2=\"140.0\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"140.0\" y1=\"252\" x2=\"140.0\" y2=\"28\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"258\" y=\"144.0\" font-size=\"12\" fill=\"#94a3b8\">x</text><text x=\"126.0\" y=\"24\" font-size=\"12\" fill=\"#94a3b8\">y</text><line x1=\"28.0\" y1=\"-9.333333333333371\" x2=\"252.0\" y2=\"214.66666666666669\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/><text x=\"237.06666666666663\" y=\"191.73333333333335\" font-size=\"12.5\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"end\">Nullstelle</text></svg>"}, {"title": "Berechnen einer linearen Funktion durch zwei Punkte", "page": 43, "body": "Sei A(1|3), B(3|6) oder zwei andere beliebige Punkte.\n1) Berechne die Steigung m: m = Δy/Δx = 3/2 = 1,5. Daraus folgt der Funktionsterm f(x)=1,5x+b\n2) Berechne den y-Achsenabschnitt: Erstelle eine Gleichung mit einem beliebigen Punkt der Funktion.\nf(1)=1,5·1+b=3 |T -> 1,5+b=3 |-1,5 -> b=1,5. Daraus folgt der Funktionsterm f(x)=1,5x+1,5", "category": "Funktionen & Lineare Funktionen", "id": "r85", "diagram": null}, {"title": "1. Binomische Formel", "page": 43, "body": "(a+b)² = a²+2·a·b+b²\nWie zeigt man, dass dies gilt? (a+b)² = (a+b)·(a+b) = a·a+a·b+a·b+b·b", "category": "Funktionen & Lineare Funktionen", "id": "r86", "diagram": null}, {"title": "2. Binomische Formel", "page": 44, "body": "(a-b)² = a²-2ab+b²", "category": "Binomische Formeln", "id": "r87", "diagram": null}, {"title": "3. Binomische Formel", "page": 44, "body": "(a+b)·(a-b) = a²-b²", "category": "Binomische Formeln", "id": "r88", "diagram": null}, {"title": "Terme mit mehreren Variablen - Wiederholung der Bruchrechnung", "page": 44, "body": "+) a/b + c/d = ad/bd + cb/bd = (ad+cb)/bd\n×) a/b · c/d = ac/bd\n÷) a/b : c/d = a/b · d/c = ad/bc\nKürzen-Beispiel: xy/x = y; (x+y)/x kann NICHT gekürzt werden\nAusklammern: x+xy = x(1+y) [Distributivgesetz rückwärts = Ausklammern]", "category": "Binomische Formeln", "id": "r89", "diagram": null}, {"title": "Berechnen eines Quadrats", "page": 44, "body": "Beispiel: (x+47)² = x²+15463\nx²+94x+47² = x²+15463 |-x² -> 94x+47² = 15463 |-47² -> 94x=13254 |:94 -> x=141. L={141}", "category": "Binomische Formeln", "id": "r90", "diagram": null}, {"title": "Geometrie - Rechteck und Dreieck", "page": 45, "body": "Rechteck: U = 2a+2b; A = a·b\nDreieck: Formel: 1/2·h·g; A = 1/2·g·h\nBeispiel: A = 1/2·120m·80m = 4800m²\nBeispiel (Umkehraufgabe): A=1000cm², h=50cm gesucht? A=1/2·g·h -> 1000cm²=1/2·50·h -> 1000cm²=25cm·h |:25 -> 40cm=h", "category": "Flächeninhalte", "id": "r91", "diagram": "<svg viewBox=\"0 0 340 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><g transform=\"translate(10,10)\"><polygon points=\"10,90 130,90 70,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"70\" y1=\"90\" x2=\"70\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"65\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">g</text><text x=\"76\" y=\"50\" font-size=\"11\" fill=\"#4f46e5\">h</text></g><g transform=\"translate(170,10)\"><rect x=\"10\" y=\"20\" width=\"120\" height=\"65\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"65\" y=\"100\" font-size=\"11\" fill=\"#94a3b8\">a</text><text x=\"145\" y=\"55\" font-size=\"11\" fill=\"#94a3b8\">b</text></g><g transform=\"translate(10,130)\"><polygon points=\"30,90 150,90 130,10 10,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30\" y1=\"90\" x2=\"30\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"85\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">g</text><text x=\"8\" y=\"55\" font-size=\"11\" fill=\"#4f46e5\">h</text></g><g transform=\"translate(190,130)\"><polygon points=\"10,90 150,90 120,10 40,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"70\" y=\"8\" font-size=\"11\" fill=\"#94a3b8\">c</text><text x=\"75\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">a</text><line x1=\"40\" y1=\"90\" x2=\"40\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"18\" y=\"55\" font-size=\"11\" fill=\"#4f46e5\">h</text></g></svg>"}, {"title": "Flächeninhalt mit außergewöhnlichem Aussehen berechnen", "page": 45, "body": "A = A1+A2+A3. Einzelne Flächen berechnen und dann zusammenrechnen.", "category": "Flächeninhalte", "id": "r92", "diagram": null}, {"title": "Flächeninhalte berechnen (Formelübersicht)", "page": 46, "body": "Dreieck: A = 1/2·g·h\nRechteck: A = a·b\nParallelogramm: A = g·h\nTrapez: A = ((a+c)·h)/2\nEin Rechteck ist auch ein Trapez und ein Parallelogramm!!!", "category": "Flächeninhalte", "id": "r93", "diagram": "<svg viewBox=\"0 0 340 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><g transform=\"translate(10,10)\"><polygon points=\"10,90 130,90 70,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"70\" y1=\"90\" x2=\"70\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"65\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">g</text><text x=\"76\" y=\"50\" font-size=\"11\" fill=\"#4f46e5\">h</text></g><g transform=\"translate(170,10)\"><rect x=\"10\" y=\"20\" width=\"120\" height=\"65\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"65\" y=\"100\" font-size=\"11\" fill=\"#94a3b8\">a</text><text x=\"145\" y=\"55\" font-size=\"11\" fill=\"#94a3b8\">b</text></g><g transform=\"translate(10,130)\"><polygon points=\"30,90 150,90 130,10 10,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30\" y1=\"90\" x2=\"30\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"85\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">g</text><text x=\"8\" y=\"55\" font-size=\"11\" fill=\"#4f46e5\">h</text></g><g transform=\"translate(190,130)\"><polygon points=\"10,90 150,90 120,10 40,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"70\" y=\"8\" font-size=\"11\" fill=\"#94a3b8\">c</text><text x=\"75\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">a</text><line x1=\"40\" y1=\"90\" x2=\"40\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"18\" y=\"55\" font-size=\"11\" fill=\"#4f46e5\">h</text></g></svg>"}, {"title": "Lineare Gleichungssysteme - Einsetzungsverfahren", "page": 47, "body": "Beispiel: 5x-7y=1; 6x+7y=32\n1. Suche dir eine Gleichung aus und stelle sie nach einer von dir gewählten Variable um.\nRechnung: 5x-7y=1 |+7y -> 5x=1+7y |:5 -> x=1/5+7/5y\n2. Setze die von dir berechnete Variable in die andere Gleichung und löse diese Gleichung auf.\nRechnung: 6x+7y=32 => 6·(1/5+7/5y)+7y=32 |T => 6/5+42/5y+7y=32 |·5 => 6+42y+35y=160 |T => 6+77y=160 |-6 => 77y=154 |:77 => y=2\n3. Setze das eben berechnete Ergebnis wieder in die jeweils andere Gleichung ein und löse diese Gleichung.\nRechnung: 5x-7·2=1 => 5x-14=1 |+14 => 5x=15 |:5 => x=3", "category": "Lineare Gleichungssysteme", "id": "r94", "diagram": null}, {"title": "Lineare Gleichungssysteme - Lösungsmenge / Sortieren", "page": 48, "body": "4. Lösungsmenge notieren: L={(3|2)}\nBeispiel Sortieren: 3x+2y+7=x-5y+1; 3x-2y-6=3x-y-4 |-x|+5y|-7 und |-3x|+y|+6 => 2x+7y=-6; -y=2\n1) Sortieren, Umordnen mit Äquivalenzumformungen (Variablen nach links, Zahlen nach rechts)", "category": "Lineare Gleichungssysteme", "id": "r95", "diagram": null}, {"title": "Grafisches Lösen von LGS (Lineare Gleichungssysteme)", "page": 48, "body": "Beispiel: 8x+7y=144; x+y=20\n1) Stelle beide Gleichungen nach y um.\n8x+7y=144 |-8x -> 7y=144-8x |:7 -> y=144/7-8/7x\nx+y=20 |-x -> y=20-x\n2) Zeichne beide Funktionen in ein geeignetes Koordinatensystem.\n3) Lies den Schnittpunkt ab.\n4) Lösungsmenge notieren.", "category": "Lineare Gleichungssysteme", "id": "r96", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"37.33333333333333\" y1=\"28\" x2=\"37.3333
