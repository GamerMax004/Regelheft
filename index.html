<link rel="stylesheet" href="assets/css/fonts.css?v=20261027c">
<link rel="stylesheet" href="assets/css/style.css?v=20261027c">

<body>

<header class="top top--scroll">
  <div class="toprow"><a class="brand" href="index.html"><h1>Regelheft<span> Mathematik</span></h1></a><div data-account></div></div>
</header>

<main>
<div class="searchbar" id="searchbar">
  <a class="sq-btn" id="aiSq" href="ki.html" aria-label="KI-Aufgabenhilfe" title="KI-Aufgabenhilfe"><span class="sq-ic" id="aiSqIcon"></span><span class="sq-tx">KI-Hilfe</span></a>
  <div class="searchwrap">
    <span class="icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <input id="searchInput" type="text" placeholder="Regel suchen …" autocomplete="off" aria-label="Regel suchen">
    <button class="clear-btn" id="clearBtn" aria-label="Suche löschen" data-icon="x" data-size="16"></button>
  </div>
  <a class="sq-btn" id="practiceSq" href="ueben.html" aria-label="Üben mit Karteikarten" title="Üben mit Karteikarten"><span class="sq-ic" data-icon="layers" data-size="22"></span><span class="sq-tx">Üben</span><span class="sq-crown is-hidden" id="practiceCrown" data-icon="crown" data-size="13" aria-hidden="true"></span></a>
</div>
<div class="chips" id="chips"></div>
<div class="meta-row">
  <span><span class="count" id="resultCount"></span> Regeln</span>
  <span id="activeCatLabel"></span>
</div>

<div class="list" id="list"></div>
<div class="empty-state" id="emptyState" style="display:none;">
  <div class="big" id="emptyTitle">Keine Treffer</div>
  <div id="emptySub">Versuch es mit einem anderen Suchbegriff.</div>
</div>
</main>

<div class="news-overlay" id="newsOverlay" role="dialog" aria-modal="true" aria-labelledby="newsTitle">
  <div class="news-card">
    <span class="news-badge">Aktuelles</span>
    <h2 id="newsTitle"></h2>
    <div class="news-date" id="newsDate"></div>
    <ul id="newsList"></ul>
    <button id="newsClose">Alles klar</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-head">
    <button class="back" id="backBtn" aria-label="Zurück zur Liste" data-icon="arrow-left" data-size="20"></button>
    <span class="headcat" id="overlayCat"></span>
    <div class="head-actions">
      <button class="icon-btn is-hidden" id="favBtn" aria-label="Zur Merkliste hinzufügen" aria-pressed="false"></button>
      <button class="icon-btn" id="shareBtn" aria-label="Regel als Bild teilen" data-icon="image" data-size="20"></button>
      <button class="icon-btn" id="copyBtn" aria-label="Link zur Regel kopieren" data-icon="link" data-size="20"></button>
    </div>
  </div>
  <div class="overlay-body">
    <h2 id="overlayTitle"></h2>
    <div id="overlayText"></div>
    <div class="diagram-section" id="diagramSection" style="display:none;">
      <div class="label">Skizze</div>
      <div class="diagram-frame" id="diagramFrame"></div>
    </div>
    <div class="note-box is-hidden" id="noteBox">
      <div class="note-head"><span class="note-title" data-icon="pencil" data-size="16"></span><label for="noteText">Meine Notiz</label><span class="note-status" id="noteStatus" aria-live="polite"></span></div>
      <textarea id="noteText" rows="3" maxlength="2000" placeholder="Eselsbrücke, Beispiel, Tipp vom Lehrer …"></textarea>
      <div class="note-hint">Privat: für andere Nutzer nicht sichtbar.</div>
    </div>
    <a class="note-lock is-hidden" id="noteLock" href="pro.html"><span class="crown-ic" data-icon="crown" data-size="22"></span><span><b>Notizen gibt es mit Pro.</b><br>Schreibe eigene Eselsbrücken zu jeder Regel.</span></a>
    <div class="overlay-copy">Copyright © Gölitzer Development</div>
  </div>
  <div class="nav-bar">
    <div class="nav-buttons">
      <button id="prevBtn"><span data-icon="chevron-left" data-size="18"></span>Vorherige</button>
      <button id="nextBtn">Nächste<span data-icon="chevron-right" data-size="18"></span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer id="siteFooter"></footer>
