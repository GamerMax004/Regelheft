6.666666666666686\" x2=\"252.0\" y2=\"158.66666666666666\" stroke=\"#0d9488\" stroke-width=\"2.3\"/><circle cx=\"140.0\" cy=\"102.66666666666669\" r=\"4\" fill=\"#0d9488\"/><text x=\"147.0\" y=\"95.66666666666669\" font-size=\"12\" fill=\"#0d9488\" font-weight=\"600\">(1|2)</text></svg>"}, {"title": "Thaleskreis - Übungsaufgabe", "page": 51, "body": "Aufgabenstellung: Suche einen Punkt P auf der Halbkreislinie, sodass das Dreieck ABP nicht rechtwinklig ist und zeichne dies ein.\nBeispielwerte 1: β=30°, γ1+γ2=90°, α=60°, γ1=60°, γ2=30°, δ1=60°, δ2=120°\nBeispielwerte 2: β=53°, α=27°, γ1=27°, γ2=63°, δ1=126°, δ2=54°\n(Hinweis: Der eigentliche Satz des Thales besagt, dass ein Dreieck, dessen einer Seite der Durchmesser eines Halbkreises ist und dessen dritter Punkt auf der Halbkreislinie liegt, bei diesem dritten Punkt einen rechten Winkel hat.)", "category": "Thaleskreis & Zentrische Streckung", "id": "r100", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">c</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">b</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">γ</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">β</text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"150\" y=\"235\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">Satz des Thales</text></svg>"}, {"title": "Winkelhalbierende", "page": 52, "body": "Eine Winkelhalbierende ist eine Halbgerade, welche entlang der Hälfte eines Winkels verläuft.", "category": "Thaleskreis & Zentrische Streckung", "id": "r101", "diagram": null}, {"title": "Lot", "page": 52, "body": "Ein Lot ist die kürzeste Strecke von einem Punkt zum Rand eines Objektes. Es steht immer im rechten Winkel zum Rand.", "category": "Thaleskreis & Zentrische Streckung", "id": "r102", "diagram": null}, {"title": "Mittelsenkrechte", "page": 52, "body": "- Zeichne 2 bis 3 ein\n- Der Schnittpunkt der Mittelsenkrechten ist der Mittelpunkt des Umkreises", "category": "Thaleskreis & Zentrische Streckung", "id": "r103", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">c</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">b</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">β</text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">γ</text><text x=\"150\" y=\"235\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">Umkreis / Mittelsenkrechte</text></svg>"}, {"title": "Mittelsenkrechte und Umkreis", "page": 52, "body": "Zu jedem Dreieck ABC gibt es drei Mittelsenkrechten ma, mb und mc.\nSatz von den Mittelsenkrechten im Dreieck: In jedem Dreieck schneiden sich die Mittelsenkrechten der drei Dreieckseiten (in einem Punkt = Umkreismittelpunkt).", "category": "Thaleskreis & Zentrische Streckung", "id": "r104", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">c</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">b</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">β</text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">γ</text><text x=\"150\" y=\"235\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">Umkreis / Mittelsenkrechte</text></svg>"}, {"title": "Zentrische Streckung", "page": 53, "body": "Sei eine Originalfigur gegeben. Dann entsteht eine Bildfigur dadurch, dass man alle Eckpunkte der Originalfigur mithilfe eines Streckungsfaktors an einem Streckungszentrum streckt oder staucht.\nBeispiel: Die zentrische Streckung eines Strichs zum Streckungsfaktor k=2 am Streckungszentrum Z(0|0). Das Streckungszentrum ist immer ein Punkt.", "category": "Thaleskreis & Zentrische Streckung", "id": "r105", "diagram": "<svg viewBox=\"0 140 170 90\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"30\" cy=\"220\" r=\"3\" fill=\"#1f2937\"/><text x=\"14\" y=\"224\" font-size=\"13\" fill=\"#1f2937\">Z</text><line x1=\"30\" y1=\"220\" x2=\"90\" y2=\"220\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"150\" y2=\"220\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"150\" y2=\"160\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"90\" y2=\"160\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><polygon points=\"60,220 90,220 90,190 60,190\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2\"/><polygon points=\"90,220 150,220 150,160 90,160\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"56\" y=\"236\" font-size=\"11\" fill=\"#0d9488\">Original</text><text x=\"150\" y=\"152\" font-size=\"11\" fill=\"#4f46e5\">Bild (k=2)</text></svg>"}, {"title": "Originalfigur verkleinern", "page": 53, "body": "Beispiel mit Streckungsfaktor k=0,5 (Verkleinerung).", "category": "Thaleskreis & Zentrische Streckung", "id": "r106", "diagram": "<svg viewBox=\"0 185.0 80.0 45.0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"30\" cy=\"220\" r=\"3\" fill=\"#1f2937\"/><text x=\"14\" y=\"224\" font-size=\"13\" fill=\"#1f2937\">Z</text><line x1=\"30\" y1=\"220\" x2=\"45.0\" y2=\"220.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"60.0\" y2=\"220.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"60.0\" y2=\"205.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"45.0\" y2=\"205.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><polygon points=\"60,220 90,220 90,190 60,190\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2\"/><polygon points=\"45.0,220.0 60.0,220.0 60.0,205.0 45.0,205.0\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"56\" y=\"236\" font-size=\"11\" fill=\"#0d9488\">Original</text><text x=\"60.0\" y=\"197.0\" font-size=\"11\" fill=\"#4f46e5\">Bild (k=0.5)</text></svg>"}, {"title": "Formel für Flächeninhalt bei zentrischer Streckung", "page": 54, "body": "A_Bildfigur = A_Originalfigur · k²\n<=> A_Bildfigur/A_Originalfigur = k²\n<=> √(A_Bildfigur/A_Originalfigur) = k\nBeispiel: √0,8 = k²; √(35/120)=k²; <=> 0,894=k", "category": "Thaleskreis & Zentrische Streckung", "id": "r107", "diagram": null}, {"title": "Auswirkung auf den Flächeninhalt bei zentrischer Streckung", "page": 54, "body": "Beispiel: Z(0|1), Quadrat ABCD, k=3\nZA=1 => ZA'=ZA·k <=> ZA'=1·3 <=> ZA'=3 => A'(3|1)\nZC=1,41 => ZC'=ZC·k <=> ZC'=1,41·3 <=> ZC'=4,23 => C'(3|4)\nA_Q = 1cm·1cm = 1cm²; A_Q' = 3cm·3cm = 9cm² => A_Q' = A_Q·9 (Flächenfaktor = k²)", "category": "Thaleskreis & Zentrische Streckung", "id": "r108", "diagram": "<svg viewBox=\"0 110 230 120\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"30\" cy=\"220\" r=\"3\" fill=\"#1f2937\"/><text x=\"14\" y=\"224\" font-size=\"13\" fill=\"#1f2937\">Z</text><line x1=\"30\" y1=\"220\" x2=\"120\" y2=\"220\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"210\" y2=\"220\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"210\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"30\" y1=\"220\" x2=\"120\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><polygon points=\"60,220 90,220 90,190 60,190\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2\"/><polygon points=\"120,220 210,220 210,130 120,130\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"56\" y=\"236\" font-size=\"11\" fill=\"#0d9488\">Original</text><text x=\"210\" y=\"122\" font-size=\"11\" fill=\"#4f46e5\">Bild (k=3)</text></svg>"}, {"title": "Allgemeine Formel zentrische Streckung Flächeninhalt", "page": 55, "body": "Sei k ein Streckungsfaktor. Sei F eine Figur im Koordinatensystem, welche unsere Originalfigur darstellt. Sei Z ein Streckungszentrum.\nWenn F' die Bildfigur zu F ist: A_F' = A_F · k²\nUmstellen der Formel: A_F'=A_F·k² |:A_F -> A_F'/A_F=k² |√ -> √(A_F'/A_F)=k", "category": "Zahlenmengen & Wurzeln", "id": "r109", "diagram": null}, {"title": "Zahlenmengen (Vertiefung)", "page": 55, "body": "N = {1,2,3,4,5,...} -> abzählbar unendlich viele Zahlen\nZ = {0,1,-1,2,-2,...} -> abzählbar unendlich viele Zahlen\nQ = {0, 1/2, 1/4, -4/7, 2/3, ...} -> abzählbar unendlich viele Zahlen\nR = {√2, √4, √6, √8, √...} -> überabzählbar unendlich viele Zahlen (ganz viele Zahlen, gezoomt am Zahlenstrahl)\nBeispiel: √2 = 1,41421356... irrationale Zahl also ∈ R (unendlich viele Nachkommastellen, keine Periode)", "category": "Zahlenmengen & Wurzeln", "id": "r110", "diagram": "<svg viewBox=\"0 0 340 90\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"20\" y1=\"50\" x2=\"320\" y2=\"50\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"45\" x2=\"30.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">0</text><line x1=\"100.0\" y1=\"45\" x2=\"100.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"170.0\" y1=\"45\" x2=\"170.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">1</text><line x1=\"240.0\" y1=\"45\" x2=\"240.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"310.0\" y1=\"45\" x2=\"310.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"310.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">2</text><polygon points=\"320,45 330,50 320,55\" fill=\"#1f2937\"/><circle cx=\"227.39999999999998\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"227.39999999999998\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">√2</text></svg>"}, {"title": "Zahlenmengen-Diagramm", "page": 56, "body": "1,41... = √2 (Zahlenstrahl-Darstellung mit Zoom 1m, 0,4m, 0,1m...)\nMengendiagramm: N ⊂ Z ⊂ Q ⊂ R (ineinander verschachtelte Kreise)", "category": "Zahlenmengen & Wurzeln", "id": "r111", "diagram": "<svg viewBox=\"0 0 300 300\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"150\" cy=\"150\" r=\"130\" fill=\"#e0e7ff\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"40\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">R</text><circle cx=\"150\" cy=\"150\" r=\"100\" fill=\"#c7d2fe\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"70\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">Q</text><circle cx=\"150\" cy=\"150\" r=\"68\" fill=\"#a5b4fc\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"102\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">Z</text><circle cx=\"150\" cy=\"150\" r=\"36\" fill=\"#818cf8\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"134\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">N</text></svg>"}, {"title": "Periodische Zahl 0,9 (Periode) = 1", "page": 56, "body": "0,9(periodisch) = 1 (denn: 1/3=0,3(periodisch); 3·1/3=1; 3·0,3(periodisch)=0,9(periodisch)=1)", "category": "Zahlenmengen & Wurzeln", "id": "r112", "diagram": null}, {"title": "Quadratwurzeln und Quadratzahlen", "page": 56, "body": "Man nennt die \"normale\" Wurzel \"Quadratwurzel\" oder \"zweite Wurzel\".\nQuadratzahlen: 1²=1; 5²=25; 11²=121; 0²=0; 21²=441; (-7)²=49; (-5)²=25; (1/2)²=1/4\nWurzeln: √121=11; √25=5; √49=7 (Wurzel ist immer positiv, NICHT -7)\nGleichung: x²=49 |±√ -> x=±7 (denn x=7 => x²=49 UND x=-7 => x²=49)\n±√(x²) = ±√49 -> x = ±7", "category": "Zahlenmengen & Wurzeln", "id": "r113", "diagram": null}, {"title": "Das Heron-Verfahren", "page": 57, "body": "Rekursives Verfahren zur Berechnung von Wurzeln: x_(n+1) = 1/2·(x_n + a/x_n), wobei a der Wert unter der Wurzel ist.\nIdee: suche passende Quadratzahlen in der Nähe. Beispiel: Berechne √2. Ziel: Was da a? -> a=2. Was ist der Startwert x0? Der Startwert x0 muss in der Nähe vom Ergebnis von √a sein.\n√1<√2<√4 -> 1<√2<2. Wähle irgendeine Zahl in der Nähe von √2, z.B. 2 => x0=2\nx1 = 1/2·(x0+a/x0) = 1/2·(2+2/2) = 1,5\nx2 = 1/2·(x1+a/x1) = 1/2·(1,5+2/1,5) = 1,41\nx3 = 1/2·(x2+a/x2) = 1/2·(1,41+2/1,41) = 1,414\nx4 = ...", "category": "Zahlenmengen & Wurzeln", "id": "r114", "diagram": null}, {"title": "Produkt von zwei irrationalen Zahlen", "page": 57, "body": "Kann das Produkt von zwei irrationalen Zahlen wieder rational sein? Ja, wenn das Produkt eine Zahl unter der Wurzel ist, die eine Quadratzahl ist.\nBeispiel: √5·√6=√30\nImpulsfrage: Sind alle Wurzeln irrational? Nein!\nRegel: Wenn a>0 und b>0, dann gilt √a·√b=√(a·b). Insbesondere gilt auch √a/√b=√(a/b)", "category": "Zahlenmengen & Wurzeln", "id": "r115", "diagram": null}, {"title": "Quadratische Funktionen", "page": 58, "body": "f(x) = x². Zeichne für die Funktion f mithilfe einer Wertetabelle in ein geeignetes Koordinatensystem.\nWertetabelle: x=-2,-1.5,-1,-0.5,0,0.5,1,1.5,2; f(x)=4,2.25,1,0.25,0,0.25,1,2.25,4\nDer Graph heißt Parabel, der tiefste/höchste Punkt heißt Scheitelpunkt.", "category": "Quadratische Funktionen", "id": "r116", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"65.33333333333333\" y1=\"28\" x2=\"65.33333333333333\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"102.66666666666666\" y1=\"28\" x2=\"102.66666666666666\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"140.0\" y1=\"28\" x2=\"140.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"177.33333333333331\" y1=\"28\" x2=\"177.33333333333331\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"214.66666666666669\" y1=\"28\" x2=\"214.66666666666669\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"214.66666666666669\" x2=\"252\" y2=\"214.66666666666669\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"177.33333333333334\" x2=\"252\" y2=\"177.33333333333334\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"140.0\" x2=\"252\" y2=\"140.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"102.66666666666669\" x2=\"252\" y2=\"102.66666666666669\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"65.33333333333331\" x2=\"252\" y2=\"65.33333333333331\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"28.0\" x2=\"252\" y2=\"28.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"214.66666666666669\" x2=\"252\" y2=\"214.66666666666669\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"140.0\" y1=\"252\" x2=\"140.0\" y2=\"28\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"258\" y=\"218.66666666666669\" font-size=\"12\" fill=\"#94a3b8\">x</text><text x=\"126.0\" y=\"24\" font-size=\"12\" fill=\"#94a3b8\">y</text><polyline points=\"57.86666666666669,33.97333333333344 61.60000000000003,50.02666666666681 65.33333333333337,65.33333333333348 69.06666666666669,79.89333333333349 72.80000000000004,93.70666666666679 76.53333333333339,106.77333333333348 80.26666666666671,119.09333333333348 84.00000000000006,130.66666666666683 87.73333333333338,141.49333333333348 91.46666666666673,151.5733333333335 95.20000000000006,160.9066666666668 98.9333333333334,169.49333333333345 102.66666666666674,177.33333333333346 106.40000000000006,184.4266666666668 110.13333333333338,190.77333333333343 113.86666666666672,196.37333333333342 117.60000000000007,201.22666666666674 121.3333333333334,205.3333333333334 125.06666666666672,208.69333333333338 128.80000000000007,211.3066666666667 132.53333333333342,213.17333333333335 136.26666666666674,214.29333333333335 140.00000000000006,214.66666666666669 143.7333333333334,214.29333333333332 147.4666666666667,213.1733333333333 151.20000000000005,211.30666666666662 154.9333333333334,208.69333333333327 158.6666666666667,205.33333333333326 162.40000000000003,201.2266666666666 166.13333333333338,196.37333333333328 169.86666666666673,190.77333333333326 173.60000000000005,184.42666666666656 177.3333333333334,177.3333333333332 181.06666666666672,169.49333333333323 184.80000000000007,160.90666666666652 188.5333333333334,151.57333333333315 192.26666666666677,141.4933333333331 196.00000000000009,130.66666666666643 199.7333333333334,119.09333333333308 203.46666666666675,106.77333333333306 207.20000000000007,93.70666666666637 210.9333333333334,79.893333333333 214.6666666666667,65.333333333333 218.4000000000001,50.0266666666663 222.13333333333344,33.97333333333296\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/></svg>"}, {"title": "Vereinfachte Scheitelpunktsform", "page": 58, "body": "f(x) = (x-d)²+e => Scheitelpunkt SP(d|e)\nDie Scheitelpunktsform hat den Vorteil, dass man an ihr den Scheitelpunkt der Parabel direkt ablesen kann.\nBeispiele: f(x)=(x-7)²+4 => SP(7|4); g(x)=(x+2)²-1 => SP(-2|-1); h(x)=x²-2 => SP(0|-2)", "category": "Quadratische Funktionen", "id": "r117", "diagram": null}, {"title": "Allgemeine Scheitelpunktsform", "page": 58, "body": "f(x) = a(x-d)²+e. Beispiel: f(x)=x² = 1(x-0)²+0\ne = Verschiebung in y-Richtung\nd = Verschiebung in x-Richtung\na = Streckung/Stauchung: a>0 gestreckt (Achtung: Originaltext sagt \"0<a gestreckt 0>a gestaucht\" - siehe Bild)", "category": "Quadratische Funktionen", "id": "r118", "diagram": null}, {"title": "Punktprobe (quadratische Funktionen)", "page": 59, "body": "Sei eine Funktion f gegeben. Prüfe, ob der Punkt (x|y) auf f liegt.\nBeispiel: f(x)=6(x-3)²+4. Prüfe, ob der Punkt (7|2) auf f liegt.\nf(7)=6(7-3)²+4 -> f(7)=100 ≠ 2 => P liegt nicht auf f", "category": "Quadratische Funktionen", "id": "r119", "diagram": null}, {"title": "Umkehraufgaben (Scheitelpunkt gegeben)", "page": 59, "body": "Sei ein Scheitelpunkt SP(x|y) gegeben. Bestimme eine passende quadratische Funktion in Scheitelpunktsform.\nBeispiel: Sei SP(5|-1/2) ein Scheitelpunkt => f(x)=3(x-5)²-1/2; g(x)=17(x-5)²-1/2 (beliebiger Streckfaktor a möglich)", "category": "Quadratische Funktionen", "id": "r120", "diagram": null}, {"title": "Scheitelpunktsform vs. Allgemeine Form (Normalform)", "page": 59, "body": "Scheitelpunktsform: f(x) = a·(x-d)²+e (praktisch um den SP abzulesen)\nAllgemeine Form/Normalform: f(x) = ax²+bx+c (praktisch um Nullstellen auszurechnen)\nUmwandlung: Scheitelpunktsform -> Allgemeine Form durch Ausmultiplizieren; Allgemeine Form -> Scheitelpunktsform durch Quadratische Ergänzung.\nBeispiel: f(x)=6(x-3)²+5 => SP(3|5) = 6(x²-6x+9)+5 = 6x²-36x+54+5 = 6x²-36x+59 (Form ax²+bx+c)", "category": "Quadratische Funktionen", "id": "r121", "diagram": null}, {"title": "Quadratische Ergänzung", "page": 60, "body": "Beispiel 1: f(x)=x²+4x+4 (Koeffizient von x halbieren (:2 -> 2), dann quadrieren (()² -> 4)) = (x+2)² => SP(-2|0)\nBeispiel 2: f(x)=x²+4x+6 = x²+4x+4-4+6 = (x+2)²-4+6 = (x+2)²+2 => SP(-2|2)\nBeispiel ohne zu kürzen (für die Arbeit): f(x)=x²-22x+5: (:2 -> 11, ()² -> 121) = (x²-22x+121)-121+5 = (x-11)²-121+5 = (x-11)²-116 => SP(11|-116)", "category": "Quadratische Funktionen", "id": "r122", "diagram": null}, {"title": "Pi", "page": 60, "body": "π ≈ 3,141...\nDie Zahl heißt pi. Pi ist keine Variable, sondern eine feste Zahl, die immer denselben Wert hat!", "category": "Quadratische Funktionen", "id": "r123", "diagram": null}, {"title": "Umfang und Flächeninhalt eines Kreises", "page": 61, "body": "Für einen Kreis mit dem Radius r, dem Umfang U und dem Flächeninhalt A gilt:\nUmfang: U = 2πr = πd\nFlächeninhalt: A = πr²", "category": "Kreis, Prisma & Pythagoras", "id": "r124", "diagram": "<svg viewBox=\"0 0 240 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"120\" cy=\"120\" r=\"90\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><line x1=\"120\" y1=\"120\" x2=\"210\" y2=\"120\" stroke=\"#0d9488\" stroke-width=\"2\"/><text x=\"161.0\" y=\"112\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">r</text><line x1=\"30\" y1=\"160\" x2=\"210\" y2=\"160\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"112\" y=\"178\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">d</text><circle cx=\"120\" cy=\"120\" r=\"3\" fill=\"#1f2937\"/><text x=\"126\" y=\"114\" font-size=\"12\" fill=\"#94a3b8\">M</text></svg>"}, {"title": "Kreisanteile: Flächeninhalt und Umfang", "page": 61, "body": "Ein voller Kreis hat 360°. Betrachten wir nun einen Anteil dieses vollen Kreises in Abhängigkeit eines Winkels z.B. α, dann entspricht der Anteil genau α/360°.\nA_KA = α/360°·π·r² (Fläche Kreisausschnitt)\nU_KA = α/360°·2·π·r + 2·r (Umfang Kreisausschnitt)", "category": "Kreis, Prisma & Pythagoras", "id": "r125", "diagram": "<svg viewBox=\"0 0 240 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"120\" cy=\"120\" r=\"90\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><path d=\"M 120 120 L 210 120 A 90 90 0 0 0 104.37166400997627 31.36730222890128 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/><text x=\"139.28362829059617\" y=\"97.01866670643066\" font-size=\"14\" fill=\"#4f46e5\" font-weight=\"600\">α</text><circle cx=\"120\" cy=\"120\" r=\"3\" fill=\"#1f2937\"/><text x=\"126\" y=\"114\" font-size=\"12\" fill=\"#94a3b8\">M</text></svg>"}, {"title": "Das Prisma", "page": 61, "body": "Das Prisma ist ein Körper, der durch das Stapeln einer beliebigen Grundfläche entsteht.\nV_P = A_G · h (allgemeine Prisma-Formel)\nFür Dreiecksprisma: V_D = 1/2·g·hd·hp\nFür Zylinder: V_Z = π·r²·h", "category": "Kreis, Prisma & Pythagoras", "id": "r126", "diagram": "<svg viewBox=\"0 0 340 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><g transform=\"translate(10,10)\"><polygon points=\"10,90 130,90 70,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"70\" y1=\"90\" x2=\"70\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"65\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">g</text><text x=\"76\" y=\"50\" font-size=\"11\" fill=\"#4f46e5\">h</text></g><g transform=\"translate(170,10)\"><rect x=\"10\" y=\"20\" width=\"120\" height=\"65\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"65\" y=\"100\" font-size=\"11\" fill=\"#94a3b8\">a</text><text x=\"145\" y=\"55\" font-size=\"11\" fill=\"#94a3b8\">b</text></g><g transform=\"translate(10,130)\"><polygon points=\"30,90 150,90 130,10 10,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30\" y1=\"90\" x2=\"30\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"85\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">g</text><text x=\"8\" y=\"55\" font-size=\"11\" fill=\"#4f46e5\">h</text></g><g transform=\"translate(190,130)\"><polygon points=\"10,90 150,90 120,10 40,10\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2\"/><text x=\"70\" y=\"8\" font-size=\"11\" fill=\"#94a3b8\">c</text><text x=\"75\" y=\"108\" font-size=\"11\" fill=\"#94a3b8\">a</text><line x1=\"40\" y1=\"90\" x2=\"40\" y2=\"10\" stroke=\"#4f46e5\" stroke-width=\"1.3\" stroke-dasharray=\"3,3\"/><text x=\"18\" y=\"55\" font-size=\"11\" fill=\"#4f46e5\">h</text></g></svg>"}, {"title": "Trapezprisma Volumenformel", "page": 62, "body": "V_T = ((a+c)/2)·hT·hp", "category": "Kreis, Prisma & Pythagoras", "id": "r127", "diagram": null}, {"title": "Begriff Oberfläche", "page": 62, "body": "Die Oberfläche eines Körpers besteht aus allen Begrenzungsflächen, welche den Körper vollständig verschließen. Addiert man die Flächeninhalte all dieser Begrenzungsflächen, so erhält man den sogenannten Oberflächeninhalt.", "category": "Kreis, Prisma & Pythagoras", "id": "r128", "diagram": null}, {"title": "Begriff Mantelfläche", "page": 62, "body": "Die Mantelfläche enthält alle Bezugsflächen der Oberfläche, außer der Grundfläche und Deckelfläche (des Prismas).", "category": "Kreis, Prisma & Pythagoras", "id": "r129", "diagram": null}, {"title": "Das Volumen eines Prismas", "page": 62, "body": "Formel: V_P = A_G · h (V_P = Volumen des Prisma, A_G = Flächeninhalt der Grundfigur, h = Höhe des Prismas)\nProbleme: Höhen erfassen z.B. der Grundfläche; Höhen untersuchen -> Prisma -> Grundfläche; unterschiedliche Formel für den Flächeninhalt der Grundfläche.", "category": "Kreis, Prisma & Pythagoras", "id": "r130", "diagram": null}, {"title": "Satz des Pythagoras", "page": 63, "body": "Sei ein rechtwinkliges Dreieck gegeben. Im rechtwinkligen Dreieck gilt, dass die Summe der Quadrate über den Katheten dem Inhalt des Quadrats über der Hypotenuse entspricht.\nFormel: a²+b²=c²\n=> c = √(a²+b²)\n=> b = √(c²-a²)\n=> a = √(c²-b²)", "category": "Kreis, Prisma & Pythagoras", "id": "r131", "diagram": "<svg viewBox=\"0 0 300 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"40\" y1=\"200\" x2=\"240\" y2=\"200\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><line x1=\"240\" y1=\"200\" x2=\"40\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><rect x=\"40\" y=\"184\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text x=\"140.0\" y=\"222\" font-size=\"14\" fill=\"#0d9488\" font-weight=\"600\" text-anchor=\"middle\">a</text><text x=\"22\" y=\"120.0\" font-size=\"14\" fill=\"#0d9488\" font-weight=\"600\" text-anchor=\"middle\">b</text><text x=\"166.0\" y=\"114.0\" font-size=\"14\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"middle\">c (Hypotenuse)</text></svg>"}, {"title": "Der Höhensatz", "page": 63, "body": "Sei ein rechtwinkliges Dreieck gegeben. Teilt man die Hypotenuse derart in zwei Hypotenusenabschnitte ein, sodass diese im rechten Winkel zur Höhe des Dreiecks stehen, so gilt:\nDas Quadrat über der Höhe ist genauso groß wie das Rechteck, welches aus dem Produkt der Hypotenusenabschnitte gebildet wird.\nFormel: h² = p·q", "category": "Kreis, Prisma & Pythagoras", "id": "r132", "diagram": "<svg viewBox=\"0 20 300 230\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"40\" y1=\"200\" x2=\"260\" y2=\"200\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"40\" y1=\"200\" x2=\"150\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"260\" y1=\"200\" x2=\"150\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"200\" stroke=\"#4f46e5\" stroke-width=\"2.5\" stroke-dasharray=\"4,3\"/><rect x=\"142\" y=\"192\" width=\"8\" height=\"8\" fill=\"none\" stroke=\"#94a3b8\"/><text x=\"95.0\" y=\"222\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">p</text><text x=\"205.0\" y=\"222\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">q</text><text x=\"162\" y=\"120.0\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">h</text><text x=\"77.0\" y=\"120.0\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"600\">b</text><text x=\"215.0\" y=\"120.0\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"600\">a</text><text x=\"150.0\" y=\"240\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">c</text></svg>"}, {"title": "Der Kathetensatz", "page": 64, "body": "Sei ein rechtwinkliges Dreieck gegeben. Teilt man die Hypotenuse in Hypotenusenabschnitte derart ein, dass sie im rechten Winkel zur angegebenen Höhe des Dreiecks stehen, dann gilt:\nDas jeweilige Quadrat einer Kathete ist genauso groß, wie das Produkt aus dem zur Kathete anliegenden Hypotenusenabschnitt und der Hypotenuse des gesamten Dreiecks.\nFormel: a²=p·c; b²=q·c", "category": "Kreis, Prisma & Pythagoras", "id": "r133", "diagram": "<svg viewBox=\"0 20 300 230\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"40\" y1=\"200\" x2=\"260\" y2=\"200\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"40\" y1=\"200\" x2=\"150\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"260\" y1=\"200\" x2=\"150\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"200\" stroke=\"#4f46e5\" stroke-width=\"2.5\" stroke-dasharray=\"4,3\"/><rect x=\"142\" y=\"192\" width=\"8\" height=\"8\" fill=\"none\" stroke=\"#94a3b8\"/><text x=\"95.0\" y=\"222\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">p</text><text x=\"205.0\" y=\"222\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">q</text><text x=\"162\" y=\"120.0\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">h</text><text x=\"77.0\" y=\"120.0\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"600\">b</text><text x=\"215.0\" y=\"120.0\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"600\">a</text><text x=\"150.0\" y=\"240\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">c</text></svg>"}, {"title": "Herleitung der Formel (a²=p·c)", "page": 64, "body": "a²+b²=c²\na²+b²=(p+q)²\na²+b²=p²+2pq+q²\na²+q²+h²=p²+2pq+q² |-q²\na²+h²=p²+2pq\na²+pq=p²+2pq |-pq\na²=p²+pq\na²=p(p+q)\na²=p·c", "category": "Kreis, Prisma & Pythagoras", "id": "r134", "diagram": "<svg viewBox=\"0 20 300 230\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"40\" y1=\"200\" x2=\"260\" y2=\"200\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"40\" y1=\"200\" x2=\"150\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"260\" y1=\"200\" x2=\"150\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\" /><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"200\" stroke=\"#4f46e5\" stroke-width=\"2.5\" stroke-dasharray=\"4,3\"/><rect x=\"142\" y=\"192\" width=\"8\" height=\"8\" fill=\"none\" stroke=\"#94a3b8\"/><text x=\"95.0\" y=\"222\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">p</text><text x=\"205.0\" y=\"222\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">q</text><text x=\"162\" y=\"120.0\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">h</text><text x=\"77.0\" y=\"120.0\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"600\">b</text><text x=\"215.0\" y=\"120.0\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"600\">a</text><text x=\"150.0\" y=\"240\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">c</text></svg>"}, {"title": "Potenzgesetze", "page": 65, "body": "Beispiel: 2³ = 2·2·2 = 8. Dabei ist 2 die Basis, 3 der Exponent.\n\n1. Regel: Sei a eine reelle Zahl und n eine natürliche Zahl. a^n = a·a·...·a (n-mal)\n\n2. Regel: Sei a eine reelle Zahl und n eine natürliche Zahl. a^(-n) = 1/a^n = 1/(a·...·a) (n-mal)\n\n3. Regel: Sei a eine reelle Zahl wobei a≠0 und n und m ganze Zahlen. a^n · a^m = a^(n+m)\n\n4. Regel: Sei a eine reelle Zahl wobei a≠0 und n und m ganze Zahlen. a^n/a^m = a^(n-m)", "category": "Potenzgesetze", "id": "r135", "diagram": null}, {"title": "Potenzgesetze (Fortsetzung)", "page": 66, "body": "5. Regel: Sei a eine reelle Zahl und m und n ganze Zahlen. (a^m)^n = a^(m·n)\n\n6. Regel: Sei a eine reelle Zahl und m und n ganze Zahlen. a^(m/n) = n-te Wurzel aus a^m (a^(m/n) = ⁿ√(a^m))\n\nWichtig: 5⁰ = 1 (jede Zahl hoch 0 ist 1)\n\n7. Regel: ⁿ√a · ⁿ√b = ⁿ√(a·b)\n\n8. Regel: ⁿ√a / ⁿ√b = ⁿ√(a/b)\n\n9. Regel: ⁿ√(ᵐ√a) = ᵐ√(ⁿ√a) = (ᵐ·ⁿ)√a", "category": "Potenzgesetze", "id": "r136", "diagram": null}, {"title": "Wahrscheinlichkeiten & Statistik", "page": 67, "body": "Beispiel Messung: Jungen (Strichliste) 15; Mädchen (Strichliste) 13\nStatistik-Tabelle:\nJungen: Abs.Häuf.=15, Rel.Häuf.=15/28, %=53,5\nMädchen: Abs.Häuf.=13, Rel.Häuf.=13/28, %=46,5\nSumme: Abs.Häuf.=28, Rel.Häuf.=28/28, %=100", "category": "Stochastik & Wahrscheinlichkeit", "id": "r137", "diagram": null}, {"title": "Stochastik & Wahrscheinlichkeitsrechnung - Def.: Zufallsexperiment", "page": 68, "body": "Ein Zufallsexperiment ist der Vorgang, der\n-> unter den gleichen Bedingungen beliebig oft wiederholbar ist\n-> dessen Ausgang nicht vorhersehbar ist\n-> bei dem alle möglichen Ausgänge bekannt sind\nBeispiele Zufallsexperiment: Würfeln, Münze werfen, Karten ziehen, Lose ziehen\nKein Zufallsexperiment: Wasser kochen (vorhersagbar), Fußballspiel (nicht wiederholbar), Klausurnote (beeinflussbar)", "category": "Stochastik & Wahrscheinlichkeit", "id": "r138", "diagram": null}, {"title": "Def.: Ergebnisraum Ω (Omega)", "page": 68, "body": "Die Menge aller möglichen Ergebnisse eines Zufallsexperiments heißt Ergebnisraum Ω.\nBeispiele: Würfeln Ω={1,2,3,4,5,6}; Münze Ω={Kopf,Zahl}; Ampelfarbe Ω={rot,gelb,grün}", "category": "Stochastik & Wahrscheinlichkeit", "id": "r139", "diagram": null}, {"title": "Def.: Ereignis", "page": 68, "body": "Ein Ereignis E ist eine Teilmenge des Ereignisraums Ω. Ein Ereignis tritt ein, wenn das Ergebnis des Experiments in E liegt.\nBeispiel beim Würfeln: E1={6} \"Eine sechs würfeln\"; E2={2,4,6} \"Eine gerade Zahl würfeln\"; E3={1,2} \"Höchstens eine 2 würfeln\"", "category": "Stochastik & Wahrscheinlichkeit", "id": "r140", "diagram": null}, {"title": "Def.: Das Laplace-Experiment", "page": 69, "body": "Ein Zufallsexperiment heißt Laplace-Experiment, wenn alle Ergebnisse des Ereignisraums gleich wahrscheinlich sind.\nBeispiele Laplace-Experimente: Faire Würfel, Faire Münze, Ziehen einer Kugel aus einer Urne\nKeine Laplace-Experimente: gezinkter Würfel, Lose ziehen, Glücksrad mit unterschiedlich großen Feldern", "category": "Stochastik & Wahrscheinlichkeit", "id": "r141", "diagram": null}, {"title": "Def.: Wahrscheinlichkeit eines Laplace-Experiments", "page": 69, "body": "Die Wahrscheinlichkeit eines Ereignis E ist: P(E) = |E|/|Ω| = Anzahl der günstigen Ergebnisse / Anzahl aller möglichen Ergebnisse\n(Die vertikalen Striche stellen die Anzahl der Elemente in der Menge dar.)\nBeispiel Würfeln mit einem Würfel: Ω={1,2,3,4,5,6}, |Ω|=6\nP(\"eine sechs Würfeln\") = P({6}) = |{6}|/|Ω| = 1/6\nP(\"eine gerade Zahl\") = P({2,4,6}) = |{2,4,6}|/|Ω| = 3/6 = 1/2\nP(\"eine Zahl kleiner als 7\") = P(Ω) = |Ω|/|Ω| = 6/6 = 1\nP(\"eine 7 würfeln\") = P({}) = |{}|/|Ω| = 0/6 = 0", "category": "Stochastik & Wahrscheinlichkeit", "id": "r142", "diagram": null}, {"title": "Mehrstufiges Zufallsexperiment", "page": 70, "body": "Beispiel: Zweimaliges Werfen einer Münze. Dann können wir den Ergebnisraum für jeden Wurf einzeln notieren und dann zusammenfassen.\n1.Wurf: Ω1={Kopf,Zahl}; 2.Wurf: Ω2={Kopf,Zahl}\nΩ = Ω1 × Ω2 = {Kopf,Zahl}×{Kopf,Zahl} = {Kopf,Zahl}² (kartesisches Produkt der Ergebnisräume)", "category": "Stochastik & Wahrscheinlichkeit", "id": "r143", "diagram": null}, {"title": "Die konkreten Ergebnisse", "page": 70, "body": "Ergebnisse notiert man in sogenannten Tupeln. (Kopf,Zahl); (Zahl,Kopf); (Zahl,Zahl); (Kopf,Kopf) - runde Klammern bei Tupeln. Alle vier Ergebnisse bilden wieder den Ergebnisraum Ω.\n\nBeispiel: Erst Münzwurf, dann Würfelwurf\nΩ1={Kopf,Zahl}; Ω2={1,2,3,4,5,6}\nΩ = Ω1×Ω2 = {Kopf,Zahl}×{1,2,3,4,5,6} = {(Kopf,1);(Kopf,2);(Kopf,3);(Kopf,4);(Kopf,5);(Kopf,6);...} (kartesisches Produkt)\n|Ω| = 12\nMerksatz: Ω=Ω1×Ω2 => |Ω|=|Ω1|·|Ω2|", "category": "Stochastik & Wahrscheinlichkeit", "id": "r144", "diagram": null}, {"title": "Beispiel: Zweimaliger Münzwurf (Wahrscheinlichkeitsberechnung)", "page": 71, "body": "=> Ω = {Kopf,Zahl}²\nE1 = (Kopf,Kopf); P(E1) = 1/2·1/2 = 1/4\nE2 = \"Genau einmal Kopf\" = {(Kopf,Zahl),(Zahl,Kopf)}; P(E2) = 1/2·1/2 + 1/2·1/2 = 2/4 = 1/2", "category": "Stochastik & Wahrscheinlichkeit", "id": "r145", "diagram": null}, {"title": "Def.: Baumdiagramm", "page": 72, "body": "Ein Baumdiagramm ist eine graphische Darstellung mehrstufiger Zufallsexperimente.\n-> Jede Stufe des Experiments wird durch eine Verzweigung dargestellt\n-> An den Ästen stehen die Wahrscheinlichkeiten\n-> Die Pfade führen zu den Ergebnissen", "category": "Stochastik & Wahrscheinlichkeit", "id": "r146", "diagram": "<svg viewBox=\"0 -10 380 220\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"20\" cy=\"110\" r=\"3\" fill=\"#1f2937\"/><line x1=\"20\" y1=\"110\" x2=\"160\" y2=\"50\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"80.0\" y=\"72.0\" font-size=\"11.5\" fill=\"#4f46e5\">1/2</text><circle cx=\"160\" cy=\"50\" r=\"2.5\" fill=\"#1f2937\"/><text x=\"168\" y=\"42\" font-size=\"12.5\" fill=\"#1f2937\" font-weight=\"700\">Kopf</text><line x1=\"160\" y1=\"50\" x2=\"300\" y2=\"27.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"32.5\" font-size=\"10.5\" fill=\"#0d9488\">1/2</text><text x=\"306\" y=\"31.0\" font-size=\"11.5\" fill=\"#1f2937\">Kopf</text><line x1=\"160\" y1=\"50\" x2=\"300\" y2=\"73.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"74.5\" font-size=\"10.5\" fill=\"#0d9488\">1/2</text><text x=\"306\" y=\"77.0\" font-size=\"11.5\" fill=\"#1f2937\">Zahl</text><line x1=\"20\" y1=\"110\" x2=\"160\" y2=\"150\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"80.0\" y=\"142.0\" font-size=\"11.5\" fill=\"#4f46e5\">1/2</text><circle cx=\"160\" cy=\"150\" r=\"2.5\" fill=\"#1f2937\"/><text x=\"168\" y=\"142\" font-size=\"12.5\" fill=\"#1f2937\" font-weight=\"700\">Zahl</text><line x1=\"160\" y1=\"150\" x2=\"300\" y2=\"127.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"132.5\" font-size=\"10.5\" fill=\"#0d9488\">1/2</text><text x=\"306\" y=\"131.0\" font-size=\"11.5\" fill=\"#1f2937\">Kopf</text><line x1=\"160\" y1=\"150\" x2=\"300\" y2=\"173.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"174.5\" font-size=\"10.5\" fill=\"#0d9488\">1/2</text><text x=\"306\" y=\"177.0\" font-size=\"11.5\" fill=\"#1f2937\">Zahl</text></svg>"}, {"title": "Def.: Die Pfadregeln", "page": 72, "body": "1) Die Produktregel: Die Wahrscheinlichkeit eines Pfades ist das Produkt der Wahrscheinlichkeiten entlang eines Pfades.\n2) Die Summenregel: Die Wahrscheinlichkeit eines Ereignisses ist die Summe der Wahrscheinlichkeiten aller Pfade, die zu diesem Ereignis führen.", "category": "Stochastik & Wahrscheinlichkeit", "id": "r147", "diagram": null}, {"title": "Def.: Die Wahrscheinlichkeit eines Gegenereignisses", "page": 73, "body": "Sei E ein Ereignis und sei Ē sein logisches Gegenereignis, sodass |E|+|Ē|=|Ω|\n=> P(E) = 1 - P(Ē)", "category": "Stochastik & Wahrscheinlichkeit", "id": "r148", "diagram": null}, {"title": "Def.: Ereignisse als Mengen", "page": 73, "body": "Ergebnisse können mit Mengenoperationen verknüpft werden.\nSchnittmenge: A∩B -> \"A und B treten ein\". Enthält alle Ergebnisse, die sowohl in A als auch in B sind.\nVereinigungsmenge: A∪B -> \"A oder B treten ein\". Enthält alle Ergebnisse, die in A oder B (oder auch in beiden) liegen.\nBeispiel: A=\"Eine Gerade Zahl\"={2,4,6}; B=\"Größer als 3\"={4,5,6}\nA∩B = \"gerade UND größer als 3\" = {4,6}\nA∪B = \"gerade ODER größer als 3\" = {2,4,5,6}\nP(A∩B) = |{4,6}|/|Ω| = 2/6 = 1/3\nP(A∪B) = |{2,4,5,6}|/|Ω| = 4/6 = 2/3", "category": "Stochastik & Wahrscheinlichkeit", "id": "r149", "diagram": null}, {"title": "Urne mit 3 roten und 2 blauen Kugeln - ohne Zurücklegen", "page": 73, "body": "1.Zug: P(rot) = 3/5\n-> Angenommen der 1.Zug war tatsächlich rot: P(rot 2.Zug) = 2/4\n-> Angenommen der 1.Zug war blau: P(rot 2.Zug) = 3/4", "category": "Stochastik & Wahrscheinlichkeit", "id": "r150", "diagram": null}, {"title": "Def.: Bedingte Wahrscheinlichkeit", "page": 74, "body": "Seien A und B Ereignisse. Definiere die Wahrscheinlichkeit, dass das Ereignis A eintritt, unter der Voraussetzung, dass B bereits eingetreten ist.\nP(A|B) = P(A∩B)/P(B) — Die Wahrscheinlichkeit, dass A eintritt unter der Bedingung, dass B bereits eingetreten ist.\nBeispiel: Würfeln - Eine 6 unter Bedingung Ergebnis ist gerade Zahl\nΩ={1,2,3,4,5,6}; A=\"Eine 6 würfeln\"={6}; B=\"Eine gerade Zahl\"={2,4,6}; A∩B={6}\nP(A|B) = P(A∩B)/P(B) = (1/6)/(1/3) = 1/3... [Hinweis: hier stand ursprünglich 1/2 für B, ergibt 1/3]", "category": "Stochastik & Wahrscheinlichkeit", "id": "r151", "diagram": null}, {"title": "Def.: Vierfeldertafeln", "page": 75, "body": "Eine Vierfeldertafel ist eine Tabelle zur übersichtlichen Darstellung von zwei Ergebnissen A und B.\nTabelle: Zeilen A, Ā; Spalten B, B̄; Zellen: P(A∩B), P(A∩B̄), P(Ā∩B), P(Ā∩B̄); Randsummen: P(A), P(Ā), P(B), P(B̄), Gesamtsumme 1.\n\nBaumdiagramm-Formeln: P(A∩B)=P(A)·P(B|A); P(A∩B̄)=P(A)·P(B̄|A); P(Ā∩B)=P(Ā)·P(B|Ā); P(Ā∩B̄)=P(Ā)·P(B̄|Ā)", "category": "Stochastik & Wahrscheinlichkeit", "id": "r152", "diagram": "<svg viewBox=\"0 -10 380 220\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"20\" cy=\"110\" r=\"3\" fill=\"#1f2937\"/><line x1=\"20\" y1=\"110\" x2=\"160\" y2=\"50\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"80.0\" y=\"72.0\" font-size=\"11.5\" fill=\"#4f46e5\">P(A)</text><circle cx=\"160\" cy=\"50\" r=\"2.5\" fill=\"#1f2937\"/><text x=\"168\" y=\"42\" font-size=\"12.5\" fill=\"#1f2937\" font-weight=\"700\">A</text><line x1=\"160\" y1=\"50\" x2=\"300\" y2=\"27.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"32.5\" font-size=\"10.5\" fill=\"#0d9488\">P(B|A)</text><text x=\"306\" y=\"31.0\" font-size=\"11.5\" fill=\"#1f2937\">B</text><line x1=\"160\" y1=\"50\" x2=\"300\" y2=\"73.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"74.5\" font-size=\"10.5\" fill=\"#0d9488\">P(B̄|A)</text><text x=\"306\" y=\"77.0\" font-size=\"11.5\" fill=\"#1f2937\">B̄</text><line x1=\"20\" y1=\"110\" x2=\"160\" y2=\"150\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"80.0\" y=\"142.0\" font-size=\"11.5\" fill=\"#4f46e5\">P(Ā)</text><circle cx=\"160\" cy=\"150\" r=\"2.5\" fill=\"#1f2937\"/><text x=\"168\" y=\"142\" font-size=\"12.5\" fill=\"#1f2937\" font-weight=\"700\">Ā</text><line x1=\"160\" y1=\"150\" x2=\"300\" y2=\"127.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"132.5\" font-size=\"10.5\" fill=\"#0d9488\">P(B|Ā)</text><text x=\"306\" y=\"131.0\" font-size=\"11.5\" fill=\"#1f2937\">B</text><line x1=\"160\" y1=\"150\" x2=\"300\" y2=\"173.0\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"222.0\" y=\"174.5\" font-size=\"10.5\" fill=\"#0d9488\">P(B̄|Ā)</text><text x=\"306\" y=\"177.0\" font-size=\"11.5\" fill=\"#1f2937\">B̄</text></svg>"}, {"title": "Def.: Der Multiplikationssatz für Bedingte Wahrscheinlichkeiten", "page": 75, "body": "P(A∩B) = P(B)·P(A|B) = P(A)·P(B|A)\nBeispiel: P(3|ungerade) = 1/3 = P(eine 3 UND die Zahl ist ungerade)/P(ungerade) = (1/6)/(1/2) = 1/3", "category": "Stochastik & Wahrscheinlichkeit", "id": "r153", "diagram": null}, {"title": "Def.: Quadratische Gleichungen", "page": 76, "body": "Zunächst kennen wir bereits lineare Gleichungen, z.B.: 22x+3=17x-4 |-3 -> 22x=17x-7 |-17x -> 5x=-7 |:5 -> x=-7/5 => L={-7/5}\n\nBei den quadratischen Gleichungen taucht nun das x² in der Gleichung auf, z.B.:\nx²-4=0 |+4 -> x²=4 |±√ -> x=±2 => x1=2; x2=-2 => L={2,-2}\nErkenntnis: Eine Quadratische Gleichung hat immer zwei Lösungen. Diese müssen nicht immer in R liegen!\n\nBeispiel quadratische Ergänzung: x²+2x+1=0 (Koeffizient :2 -> 1, ()² -> 1) <=> (x+1)²=±√0 <=> x+1=0 |-1 <=> x=-1 => L={-1}\n\nBeispiel Ausklammern (Satz des Nullproduktes): x²+2x=0. Wenn x als Faktor jedes Summanden auftritt, dann lohnt es sich auszuklammern!\n<=> x(x+2)=0. x=0 oder x+2=0 -> x=-2. L={0,-2}\nSatz des Nullproduktes: Ein Produkt ist genau dann null, wenn einer der Faktoren null ist.", "category": "Quadratische Gleichungen", "id": "r154", "diagram": null}, {"title": "Def.: Die Normalform von quadratischen Funktionen", "page": 77, "body": "Wir kennen bereits die allgemeine Form einer quadratischen Funktion: ax²+bx+c\nWir setzen nun zwingend den Parameter a=1 und benennen das b zu p und c zu q um, sodass wir folgende Darstellung erhalten: x²+px+q\nBeispiele: x²+7x-3; x²-8x+5", "category": "Quadratische Gleichungen", "id": "r155", "diagram": null}, {"title": "Def.: Die pq-Formel zum Lösen von Nullstellen quadratischer Funktionen in Normalform", "page": 77, "body": "Wichtig: Die pq-Formel kann nur angewendet werden, wenn die Form x²+px+q gegeben ist.\nWenn wir berechnen: x²+px+q=0 <=> x1,2 = -p/2 ± √((p²/4)-q)\nBeispiel: x²+6x+1: p=6, q=1\npq-Formel => x1,2 = -6/2 ± √((6²/4)-1) \ni) x1 = -3-√8\nii) x2 = -3+√8", "category": "Quadratische Gleichungen", "id": "r156", "diagram": null}, {"title": "Def.: Quadratische Gleichungen - universeller Weg", "page": 78, "body": "1) Der universelle Weg (der immer geht, aber nicht immer effizient ist)\nBeispiel: 3x²+6x-7=5x²+2x-1 |-5x²|-2x|+1 <=> -2x²+4x-6=0 |:(-2) <=> x²-2x+3\nIdee: Alles auf eine Seite sortieren, sodass z.B. rechts eine 0 steht.\npq-Formel => x1,2 = -p/2 ± √((p²/4)-q) = -(-2)/2 ± √(((-2)²/4)-3) = 1±√(-2) => Keine Lösung!", "category": "Quadratische Gleichungen", "id": "r157", "diagram": null}, {"title": "Def.: Quadratische Gleichungen (Sonderfälle ohne pq-Formel, mit Ausklammern und Satz des Nullproduktes)", "page": 78, "body": "1) Sortiere wie sonst auch alle Termteile auf eine Seite, sodass z.B. rechts eine 0 steht.\nBeispiel: 4x²=-8x |+8x -> 4x²+8x=0\n2) Wenn der Term nun die Bauart hat, dass in jedem Summanden mindestens ein x als Faktor auftaucht, dann ist das Ziel, diesen Teil auszuklammern. Denn nach dem Ausklammern können wir den Satz des Nullproduktes anwenden.\n<=> 4x(x+2)=0 => 4x=0 => x=0; => x+2=0 => x=-2. L={0,-2}", "category": "Quadratische Gleichungen", "id": "r158", "diagram": null}, {"title": "Exponentielles Wachstum", "page": 79, "body": "Wenn sich ein Bestand in jeder Zeiteinheit um denselben Wachstumsfaktor q ändert, spricht man von exponentiellem Wachstum. Mit B(0) bezeichnet man den Anfangsbestand bzw. Ausgangswert. Den Bestand B(t) nach t Zeiteinheiten kann man mit der Gleichung B(t)=B(0)·q^t berechnen.", "category": "Exponentielles Wachstum & Logarithmus", "id": "r159", "diagram": null}, {"title": "Def.: Exponentialfunktionen", "page": 79, "body": "f(t) = a·q^t, wobei a der Ausgangswert und q der Wachstumsfaktor ist.\nGrundvoraussetzungen: q>1, q≠0; a≠0, t∈R (\"t ist Element der reellen Zahlen\")\nEs gelten nun folgende Beziehungen: a=f(0); f(1)=a·q¹\nf(t+1)=a·q^(t+1) <=> f(t+1)=a·q^t·q <=> q=f(t+1)/f(t)\nDie Formel q=f(t+1)/f(t) ist ein wichtiges Werkzeug, um den Wachstumsfaktor q zu berechnen, wenn zwei aufeinander folgende Funktionswerte gegeben sind.\nBeispiel: t=0,1; f(t)=1,2 => f(0)=1, f(1)=2 => q=f(1)/f(0)=2/1=2\nSpezialfall => q=f(1)/f(0); q=ˣ√(f(x)/f(0))\nAlternativ => q=f(1)/a; q=ˣ√(f(x)/a)\nFormel => f(t) = f(0)·(f(1)/f(0))^t", "category": "Exponentielles Wachstum & Logarithmus", "id": "r160", "diagram": null}, {"title": "Gleichungen bisher - Verdopplungszeit / Wurzelgleichungen mit Variable in der Basis", "page": 80, "body": "Beispiel: Verdopplungszeit exponentielles Wachstum ist 5 Einheiten. Man kann q berechnen, denn betrachten wir einen beliebigen Startwert, z.B.: 1 => 1·q⁵=2 |⁵√ <=> q=⁵√2\n[...] z.B.: 8 => 8·q⁵=16 |:8 <=> q⁵=2 |⁵√ <=> q=⁵√2\nHat man die Variable in der Basis, benötigen wir eine höherwertige Wurzel.", "category": "Exponentielles Wachstum & Logarithmus", "id": "r161", "diagram": null}, {"title": "Der Logarithmus", "page": 80, "body": "Frage: was ist, wenn die unbekannte Zahl im Exponenten steht? Beispiel: 10^x=10000\nHat man dieses Setting, benötigt man als Äquivalenzumformung den sogenannten Logarithmus zur gegebenen Basis.\nBeispiel: Hier ist die Basis der Gleichung 10, somit braucht man den Logarithmus zur Basis 10 => kurz: log10()\nBeispiel: 10^x=10000 |log10() -> x=log10(10000) -> x=4 => L={4}\nSchreibt man nur log() als Umformung, meint man immer Basis 10. Bei ln() meint man e als Basis für die Umformung.\nln() - Erst in Q1!", "category": "Exponentielles Wachstum & Logarithmus", "id": "r162", "diagram": null}, {"title": "Der Logarithmus als Umkehrfunktion zur Exponentialfunktion", "page": 81, "body": "Wir betrachten Gleichungen, wo die unbekannte Variable im Exponenten steht.\nBeispiel: 2^x=8 |log2() -> x=log2(8) => log2(8)=3\nMan sucht eine Zahl x, sodass die Basis hoch x das Argument im Logarithmus ist. => Hier als 2^x=8", "category": "Trigonometrie", "id": "r163", "diagram": null}, {"title": "Einführung in Trigonometrie", "page": 81, "body": "Wir betrachten rechtwinklige Dreiecke. Es gilt:\nsin(α) = Gegenkathete/Hypotenuse\ncos(α) = Ankathete/Hypotenuse\nBeispiel: Dreieck mit Seiten 3,4,5: sin(α)=Gegenkathete/Hypotenuse=3/5 |arcsin() -> α=arcsin(3/5)=36,869°\nUmkehrfunktion vom Sinus ist der Arcus-Sinus.", "category": "Trigonometrie", "id": "r164", "diagram": "<svg viewBox=\"0 0 300 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"40\" y1=\"200\" x2=\"240\" y2=\"200\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><line x1=\"240\" y1=\"200\" x2=\"40\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><rect x=\"40\" y=\"184\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/><text x=\"140.0\" y=\"222\" font-size=\"14\" fill=\"#0d9488\" font-weight=\"600\" text-anchor=\"middle\">Ankathete</text><text x=\"22\" y=\"120.0\" font-size=\"14\" fill=\"#0d9488\" font-weight=\"600\" text-anchor=\"middle\">Gegenkathete</text><text x=\"166.0\" y=\"114.0\" font-size=\"14\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"middle\">Hypotenuse</text><text x=\"210\" y=\"186\" font-size=\"13\" fill=\"#1f2937\">α</text></svg>"}, {"title": "Der Tangenz (Tangens)", "page": 82, "body": "Es gilt im rechtwinkligen Dreieck: tan(α) = Gegenkathete/Ankathete\nBeispiel: = 3/3 |arctan() -> α=arctan(3/3) = 45°", "category": "Trigonometrie", "id": "r165", "diagram": null}, {"title": "Steigungswinkel einer linearen Funktion", "page": 82, "body": "Die Art von Aufgabe die ihr gerade bearbeitet ist in 90% der Fälle eine AFB II-III Aufgabe mit:\n- gegeben ist lineare Funktion f(x)\n- berechne den Steigungswinkel von f(x)\nBeispiel: f(x)=1,5x-1. α=arctan(1,5)=56,3°\nAllgemein: α = arctan(m) (m = Steigung der linearen Funktion)", "category": "Trigonometrie", "id": "r166", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"84.0\" y1=\"28\" x2=\"84.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"140.0\" y1=\"28\" x2=\"140.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"196.0\" y1=\"28\" x2=\"196.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"207.2\" x2=\"252\" y2=\"207.2\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"162.39999999999998\" x2=\"252\" y2=\"162.39999999999998\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"117.6\" x2=\"252\" y2=\"117.6\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"72.79999999999998\" x2=\"252\" y2=\"72.79999999999998\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"28.0\" x2=\"252\" y2=\"28.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"162.39999999999998\" x2=\"252\" y2=\"162.39999999999998\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"84.0\" y1=\"252\" x2=\"84.0\" y2=\"28\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"258\" y=\"166.39999999999998\" font-size=\"12\" fill=\"#94a3b8\">x</text><text x=\"70.0\" y=\"24\" font-size=\"12\" fill=\"#94a3b8\">y</text><line x1=\"28.0\" y1=\"274.4\" x2=\"252.0\" y2=\"5.599999999999966\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/><text x=\"229.6\" y=\"24.47999999999999\" font-size=\"12.5\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"end\">f(x)=1,5x-1</text></svg>"}, {"title": "Zentrische Streckung - Fachbegriffe", "page": 83, "body": "Fachbegriffe: Originalpunkt, Bildpunkt, Originalfigur, Bildfigur, Streckungsfaktor, Streckungszentrum", "category": "Trigonometrie", "id": "r167", "diagram": null}, {"title": "Grad- und Bogenmaß / Einheitskreis", "page": 83, "body": "α = 360° [Gradmaß]; α = 2π [Bogenmaß]\nUmrechnung: α[Bogenmaß] = α[Gradmaß]·π/180\nα[Gradmaß] = α[Bogenmaß]·180/π\nTrigonometrischer Pythagoras: cos²(α)+sin²(α) = 1", "category": "Trigonometrie", "id": "r168", "diagram": "<svg viewBox=\"-40 0 320 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"130\" cy=\"130\" r=\"95\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.3\"/><line x1=\"20\" y1=\"130\" x2=\"240\" y2=\"130\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><line x1=\"130\" y1=\"240\" x2=\"130\" y2=\"20\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><line x1=\"130\" y1=\"130\" x2=\"191.06482292022125\" y2=\"57.22577790369709\" stroke=\"#4f46e5\" stroke-width=\"2.2\"/><line x1=\"191.06482292022125\" y1=\"57.22577790369709\" x2=\"191.06482292022125\" y2=\"130\" stroke=\"#0d9488\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/><line x1=\"130\" y1=\"130\" x2=\"191.06482292022125\" y2=\"130\" stroke=\"#0d9488\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/><circle cx=\"191.06482292022125\" cy=\"57.22577790369709\" r=\"3.5\" fill=\"#4f46e5\"/><text x=\"199.06482292022125\" y=\"47.22577790369709\" font-size=\"12\" fill=\"#4f46e5\" font-weight=\"600\">P(cos α, sin α)</text><text x=\"160.5324114601106\" y=\"148\" font-size=\"12\" fill=\"#0d9488\">cos(α)</text><text x=\"197.06482292022125\" y=\"93.61288895184855\" font-size=\"12\" fill=\"#0d9488\">sin(α)</text></svg>"}, {"title": "Transformation von Funktionen", "page": 83, "body": "Lineare Funktion: f(x) = mx+b. Beispiel: f(x)=2x+1\nVerschiebung in y-Richtung (z.B. 5 Koordinaten nach oben): fT(x)=f(x)+5 = 2x+1+5 = 2x+6. Allgemein: fT(x) = f(x)+d\nVerschiebung in x-Richtung: fT(x) = f(x-c)", "category": "Trigonometrie", "id": "r169", "diagram": null}, {"title": "Transformation von Funktionen - kombiniertes Beispiel", "page": 84, "body": "f(x) = 3x²+6x-2\nfT(x) = f(x-c)+d = f(x-3)-6\n= 3(x-3)²+6(x-3)-2-6\n= 3(x²-6x+9)+6(x-3)-8\n= 3x²-18x+27+6x-18-8\n= 3x²-12x+1", "category": "Trigonometrie", "id": "r170", "diagram": null}]</script>
<script>
const RULES = JSON.parse(document.getElementById('rules-data').textContent);

const categories = [];
RULES.forEach(r => { if(!categories.includes(r.category)) categories.push(r.category); });

let activeCat = "Alle";
let query = "";
let filtered = RULES.slice();
let currentIndex = -1;

const chipsEl = document.getElementById('chips');
function renderChips(){
  let html = `<div class="chip ${activeCat==='Alle'?'active':''}" data-cat="Alle">Alle</div>`;
  categories.forEach(c=>{
    html += `<div class="chip ${activeCat===c?'active':''}" data-cat="${escapeAttr(c)}">${escapeHtml(c)}</div>`;
  });
  chipsEl.innerHTML = html;
  chipsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCat = el.getAttribute('data-cat');
      applyFilter();
    });
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return s.replace(/"/g,'&quot;');
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const qEsc = escapeHtml(q);
  try{
    const re = new RegExp('(' + qEsc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return esc.replace(re, '<mark>$1</mark>');
  }catch(e){ return esc; }
}

function applyFilter(){
  const q = query.trim().toLowerCase();
  filtered = RULES.filter(r=>{
    const catOk = activeCat === "Alle" || r.category === activeCat;
    if(!catOk) return false;
    if(!q) return true;
    return (r.title.toLowerCase().includes(q) || r.body.toLowerCase().includes(q) || r.category.toLowerCase().includes(q));
  });
  renderChips();
  renderList();
  document.getElementById('resultCount').textContent = filtered.length;
  document.getElementById('activeCatLabel').textContent = activeCat === 'Alle' ? '' : activeCat;
}

function renderList(){
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  if(filtered.length === 0){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  const q = query.trim();
  listEl.innerHTML = filtered.map((r,idx) => `
    <div class="rule-card" data-id="${r.id}" style="animation-delay:${Math.min(idx*18,240)}ms">
      <div class="row-top">
        <span class="cat-pill">${escapeHtml(r.category)}</span>
        ${r.diagram ? '<span class="diag-dot" title="mit Skizze"></span>' : ''}
      </div>
      <h3>${highlight(r.title, q)}</h3>
      <p>${highlight(r.body.replace(/\n/g,' '), q)}</p>
    </div>
  `).join('');
  listEl.querySelectorAll('.rule-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      openDetail(el.getAttribute('data-id'));
    });
  });
}

// ---- Math formula renderer: turns plain-text formulas into proper HTML ----
const SUP_MAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
const SUP_O='\uE001', SUP_C='\uE002';
const SUB_O='\uE003', SUB_C='\uE004';
const SQRT_O='\uE005', SQRT_C='\uE006';
const FRAC_O='\uE007', FRAC_M='\uE008', FRAC_C='\uE009';
const PROTECT_OPEN = new Set(['(', SUP_O, SUB_O, SQRT_O]);
const PROTECT_CLOSE = new Set([')', SUP_C, SUB_C, SQRT_C]);

function topLevelSlashSplit(tok){
  let depth = 0;
  for(let i=0;i<tok.length;i++){
    const c = tok[i];
    if(PROTECT_OPEN.has(c)) depth++;
    else if(PROTECT_CLOSE.has(c)) depth--;
    else if(c === '/' && depth === 0){
      const num = tok.slice(0,i), den = tok.slice(i+1);
      if(num.length && den.length) return [num, den];
      return null;
    }
  }
  return null;
}

function splitAdditive(str){
  const terms = [];
  let current = '';
  let depth = 0;
  for(let i=0;i<str.length;i++){
    const c = str[i];
    if(PROTECT_OPEN.has(c)) depth++;
    if(PROTECT_CLOSE.has(c)) depth--;
    if(depth === 0 && (c === '+' || c === '-') && current.length > 0){
      terms.push(current);
      terms.push(c);
      current = '';
    } else {
      current += c;
    }
  }
  terms.push(current);
  return terms; // [term, op, term, op, term, ...]
}

function processSegment(seg){
  if(/[<>≤≥≠]/.test(seg)) return seg;
  const parts = splitAdditive(seg);
  return parts.map((part, idx) => {
    if(idx % 2 === 1) return part; // '+' or '-' operator, unchanged
    const split = topLevelSlashSplit(part);
    if(split){
      return FRAC_O + split[0] + FRAC_M + split[1] + FRAC_C;
    }
    return part;
  }).join('');
}

function renderToken(tok){
  if(tok === '') return tok;
  let s = tok;
  // unicode superscript digit runs
  s = s.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+)/g, m => SUP_O + m.split('').map(c=>SUP_MAP[c]||c).join('') + SUP_C);
  // caret exponent: ^(...) or ^token
  s = s.replace(/\^\(([^()]+)\)/g, (m, inner) => SUP_O + inner + SUP_C);
  s = s.replace(/\^(-?[A-Za-zΑ-Ωα-ω0-9]+)/g, (m, inner) => SUP_O + inner + SUP_C);
  // underscore subscript: _(...) or _token
  s = s.replace(/_\(([^()]+)\)/g, (m, inner) => SUB_O + inner + SUB_C);
  s = s.replace(/_([A-Za-zΑ-Ωα-ω0-9]+)/g, (m, inner) => SUB_O + inner + SUB_C);
  // square root (allows one level of nested parentheses inside)
  s = s.replace(/√\(((?:[^()]|\([^()]*\))+)\)/g, (m, inner) => SQRT_O + inner + SQRT_C);
  s = s.replace(/√([A-Za-zΑ-Ωα-ω0-9]+)/g, (m, inner) => SQRT_O + inner + SQRT_C);

  // Handle chained equalities, then within each side, handle separate additive terms
  // so "1/5+7/5y" becomes two distinct fractions instead of one wrongly-nested fraction.
  s = s.split('=').map(processSegment).join('=');

  s = escapeHtml(s);

  s = s.split(SUP_O).join('<sup>').split(SUP_C).join('</sup>');
  s = s.split(SUB_O).join('<sub>').split(SUB_C).join('</sub>');
  s = s.split(SQRT_O).join('<span class="sqrt"><span class="rad">√</span><span class="radicand">').split(SQRT_C).join('</span></span>');
  s = s.split(FRAC_O).join('<span class="frac"><span class="num">').split(FRAC_M).join('</span><span class="den">').split(FRAC_C).join('</span></span>');
  return s;
}

function renderFormula(raw){
  return raw.split(/(\s+)/).map(tok=>{
    if(/^\s*$/.test(tok)) return tok;
    return renderToken(tok);
  }).join('');
}
// ---- end math formula renderer ----

function classifyLine(line){
  const trimmed = line.trim();
  if(!trimmed) return 'empty';
  if(/^(-|•|->)\s+/.test(trimmed)) return 'bullet';
  const mathChars = (trimmed.match(/[0-9+\-*/=<>≤≥≠√π°²³¹⁴⁵⁶⁷⁸⁹⁰·%±∡ΩαβγδεΔ]/g)||[]).length;
  const proseWords = (trimmed.match(/[A-Za-zÀ-ÖØ-öø-ÿ]{4,}/g)||[]).length;
  if(mathChars >= 2 && proseWords <= 3) return 'formula';
  return 'prose';
}

function formatBody(body){
  const lines = body.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  let html = '';
  let i = 0;
  while(i < lines.length){
    const type = classifyLine(lines[i]);
    if(type === 'bullet'){
      let items = [];
      while(i < lines.length && classifyLine(lines[i]) === 'bullet'){
        items.push(`<li>${renderFormula(lines[i].replace(/^(-|•|->)\s+/,''))}</li>`);
        i++;
      }
      html += `<ul class="bullet-list">${items.join('')}</ul>`;
    } else if(type === 'formula'){
      let items = [];
      while(i < lines.length && classifyLine(lines[i]) === 'formula'){
        items.push(`<div class="formula-line">${renderFormula(lines[i])}</div>`);
        i++;
      }
      html += `<div class="formula-block">${items.join('')}</div>`;
    } else {
      html += `<p class="prose-line">${renderFormula(lines[i])}</p>`;
      i++;
    }
  }
  return html;
}

function openDetail(id){
  const idx = filtered.findIndex(r => r.id === id);
  if(idx === -1) return;
  currentIndex = idx;
  showCurrent();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').scrollTop = 0;
}

function showCurrent(){
  const r = filtered[currentIndex];
  document.getElementById('overlayCat').textContent = r.category;
  document.getElementById('overlayTitle').textContent = r.title;
  document.getElementById('overlayText').innerHTML = formatBody(r.body);
  document.getElementById('overlaySource').textContent = 'Aus deinem Regelheft · Seite ' + r.page;
  const diagSection = document.getElementById('diagramSection');
  const diagFrame = document.getElementById('diagramFrame');
  if(r.diagram){
    diagFrame.innerHTML = r.diagram;
    diagSection.style.display = 'block';
  } else {
    diagFrame.innerHTML = '';
    diagSection.style.display = 'none';
  }
  document.getElementById('prevBtn').disabled = currentIndex <= 0;
  document.getElementById('nextBtn').disabled = currentIndex >= filtered.length - 1;
  document.getElementById('overlay').scrollTop = 0;
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentIndex > 0){ currentIndex--; showCurrent(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentIndex < filtered.length - 1){ currentIndex++; showCurrent(); }
});

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', (e)=>{
  query = e.target.value;
  clearBtn.style.display = query ? 'flex' : 'none';
  applyFilter();
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  query = '';
  clearBtn.style.display = 'none';
  applyFilter();
  searchInput.focus();
});

renderChips();
applyFilter();
