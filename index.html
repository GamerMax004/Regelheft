<style>
  :root{
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --ink: #14181f;
    --ink-soft: #667085;
    --border: #e6e8ec;
    --accent: #4338ca;
    --accent-soft: #eef0fd;
    --accent-hover: #372f9c;
    --teal: #0d9488;
    --teal-soft: #e6f6f4;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .top{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:18px 18px 14px;
  }
  .top h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 3px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .top .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .searchwrap{ position:relative; }
  .searchwrap input{
    width:100%;
    padding:13px 42px 13px 40px;
    border-radius:14px;
    border:1.5px solid var(--border);
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    outline:none;
    box-shadow:0 1px 2px rgba(20,24,31,0.04);
    transition:border-color .18s ease, box-shadow .18s ease;

<script id="rules-data" type="application/json">[{"title": "Brüche und Anteile", "page": 1, "body": "Zur Beschreibung von Anteilen verwendet man Brüche, z.B. 1/4. Um 3/4 zu erhalten, zerlegt man ein Ganzes in vier gleiche Teile und nimmt dann drei davon.\nBeispiel: 3 (Zähler) / Bruchstrich / 4 (Nenner)", "category": "Brüche & Dezimalzahlen", "id": "r0", "diagram": null}, {"title": "Bruchteile von Größen", "page": 1, "body": "Wird eine Größe mit Bruchteilen dargestellt, kann man die Einheit in die nächstkleinere Einheit umrechnen, und den Bruch \"umrechnen\": 3/8 l = 3/8 von 1000ml = (1000ml : 8) · 7 = 125ml · 7 = 875ml", "category": "Brüche & Dezimalzahlen", "id": "r1", "diagram": null}, {"title": "Kürzen und Erweitern", "page": 1, "body": "Man erweitert einen Bruch, indem man Zähler und Nenner mit der gleichen Zahl multipliziert.\nMan kürzt einen Bruch, indem man Zähler und Nenner durch die gleiche Zahl dividiert.\nWichtig: Erweitern und Kürzen verändert den Wert eines Bruches nicht!\nBeispiel: 2/5 = 6/15; 12/30 = 6/15 = 2/5 = 4/10", "category": "Brüche & Dezimalzahlen", "id": "r2", "diagram": null}, {"title": "Vollständiges Kürzen", "page": 2, "body": "Ein Bruch heißt vollständig gekürzt, wenn Zähler und Nenner des Bruches keinen gemeinsamen Teiler mehr haben außer der Zahl 1, wenn sie also teilerfremd sind.\nBeim vollständigen Kürzen kann man schrittweise vorgehen, oder direkt mit dem größten gemeinsamen Teiler von Zähler und Nenner kürzen.\nBeispiel: 48/72 = 24/36 = 12/18 = 6/9 = 2/3 oder 48/72 = 2/3", "category": "Brüche & Dezimalzahlen", "id": "r3", "diagram": null}, {"title": "Brüche vergleichen", "page": 2, "body": "Man erweitert oder kürzt so, dass Zähler oder Nenner übereinstimmen:\n- Wenn die Zähler gleich sind, ist der Bruch mit dem kleineren Nenner größer: Bsp: 5/7 > 5/10\n- Wenn die Nenner gleich sind, ist der Bruch mit dem größeren Zähler größer: Bsp: 7/8 > 5/8\nBeispiel: Welcher Bruch ist größer? 5/6 oder 7/3? 5/6=15/18, 7/3=14/18(?) Dieser Bruch ist größer (5/6).", "category": "Brüche & Dezimalzahlen", "id": "r4", "diagram": null}, {"title": "Prozente", "page": 3, "body": "Anteile werden häufig in Prozentschreibweise angegeben. 1% ist eine andere Schreibweise für 1/100. Ein Anteil lässt sich in Prozent angeben, indem man den Bruch so kürzt oder erweitert, dass im Nenner 100 steht.\nBeispiel: 1/4 = 25/100 = 25%; 3/8 = 375/1000 = 37,5%", "category": "Brüche & Dezimalzahlen", "id": "r5", "diagram": null}, {"title": "Brüche als Quotienten", "page": 3, "body": "Wenn man zwei Zahlen dividiert, kann man das Ergebnis als Bruch darstellen.\nBeispiel: 3:4 = 3/4", "category": "Brüche & Dezimalzahlen", "id": "r6", "diagram": null}, {"title": "Weitere Schreibweisen von Brüchen", "page": 3, "body": "Auch ganze Zahlen können als Bruch geschrieben werden: 5 = 5/1 = 10/2 = 20/4 = ...; 1 = 1/1 = 2/2 = 1000/1000 = ...\nIst bei einem Bruch der Zähler größer als der Nenner, wird er oft in gemischter Schreibweise angegeben.\nBeispiel: 7/6 = 6/6 + 1/6 = 1 + 1/6 = 1 1/6; 5/2 = 4/2+1/2=2+1/2=2 1/2; 8/5=5/5+3/5=1+3/5=1 3/5", "category": "Brüche & Dezimalzahlen", "id": "r7", "diagram": null}, {"title": "Beispiele zum Umrechnen unechter <-> gemischter Bruch", "page": 4, "body": "A) unechter Bruch -> gemischter Bruch: 60/11 = 55/11 + 5/11 = 5 + 5/11 = 5 5/11 (60:11 = 5 Rest 5)\nB) gemischter Bruch -> unechter Bruch: 6 5/7 = 6/1 + 5/7 = 42/7 + 5/7 = 47/7 (Ganzzahl erweitern und addieren)", "category": "Brüche & Dezimalzahlen", "id": "r8", "diagram": null}, {"title": "Brüche am Zahlenstrahl", "page": 4, "body": "Man kann jeden Bruch auf dem Zahlenstrahl eintragen. Brüche, die durch Erweitern oder Kürzen auseinander hervorgehen, werden an derselben Stelle eingetragen. Sie bezeichnen dieselbe Zahl.\nBeim Zeichnen eines Zahlenstrahls kann es hilfreich sein, sich vorher eine geeignete Länge für den Abstand zwischen zwei ganzen Zahlen zu überlegen.\nBeispiel: 3/8, 1/4, 1/2, 3/6, 10/10 -> 10/10=8/8=1; 3/6=1/2=4/8; 1/4=2/8 (mit Zahlenstrahl-Grafik dargestellt)", "category": "Brüche & Dezimalzahlen", "id": "r9", "diagram": "<svg viewBox=\"0 0 340 90\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"20\" y1=\"50\" x2=\"320\" y2=\"50\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"45\" x2=\"30.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">0</text><line x1=\"310.0\" y1=\"45\" x2=\"310.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"310.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">1</text><polygon points=\"320,45 330,50 320,55\" fill=\"#1f2937\"/><circle cx=\"135.0\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"135.0\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">3/8</text><circle cx=\"100.0\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"100.0\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">1/4</text><circle cx=\"170.0\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"170.0\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">1/2</text><circle cx=\"310.0\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"310.0\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">10/10</text></svg>"}, {"title": "Dezimalschreibweise", "page": 5, "body": "Brüche können auch als Kommazahl, besser: Dezimalzahl, angegeben werden.\nHat eine Dezimalzahl eine, zwei, drei... Stellen hinter dem Komma, dann kann man sie als Bruch mit dem Nenner 10, 100, 1000 ... schreiben.\nBeispiele: 135,4 = 1354/10; 2,34 = 234/100; 0,002 = 2/1000; 0,7 = 7/10; 3,31 = 331/100; 10,002 = 10002/1000", "category": "Brüche & Dezimalzahlen", "id": "r10", "diagram": null}, {"title": "Vom Bruch zur Dezimalzahl", "page": 6, "body": "Um einen Bruch als Dezimalzahl zu schreiben, muss man ihn so erweitern (oder kürzen), dass im Nenner eine 10, 100, 1000... steht. Dann beginnt man von hinten nach vorne die Ziffern des Zählers aufzuschreiben und setzt das Komma so, dass 1,2,3,... Nachkommastellen entstehen.\nBeispiel: 1/4=25/100=0,25; 37/20=185/100=1,85", "category": "Brüche & Dezimalzahlen", "id": "r11", "diagram": null}, {"title": "Umwandeln in Prozentschreibweise", "page": 6, "body": "15% = 15/100 = 0,15; 32% = 32/100 = 0,32; 0,321 = 32,1%; 0,60=60%; 0,06=6%\nVerschiebt man bei der Dezimalzahl das Komma um zwei Stellen nach rechts, erhält man die Prozentzahl (und umgekehrt).", "category": "Brüche & Dezimalzahlen", "id": "r12", "diagram": null}, {"title": "Dezimalzahlen vergleichen", "page": 7, "body": "Beispiel: 5,342 < 5,542 < 17,892 < 28,328 < 28,348 < 52,242\nVon zwei Dezimalzahlen ist diejenige größer, die von links nach rechts gelesen an derselben Stelle zuerst eine größere Ziffer hat.", "category": "Brüche & Dezimalzahlen", "id": "r13", "diagram": null}, {"title": "Runden von Dezimalzahlen", "page": 7, "body": "Beispiele: 17,89214 km ≈ 17,9 km; 17,89214 km ≈ 18 km; 172,4219 cm ≈ 172 cm\nVor dem Runden von Dezimalzahlen muss man festlegen, wie viele Stellen nach dem Komma die gerundete Zahl haben soll.\nIst die erste Ziffer, die man weglässt, eine 0,1,2,3 oder 4, so wird abgerundet.\nIst die erste Ziffer, die man weglässt, eine 5,6,7,8 oder 9, so wird aufgerundet.\nDas Runden braucht man für Überschlagsrechnungen.", "category": "Brüche & Dezimalzahlen", "id": "r14", "diagram": null}, {"title": "Abbrechende und periodische Dezimalzahl - Schriftliche Division mit Komma", "page": 8, "body": "Mithilfe einer schriftlichen Division lässt sich jeder Bruch als Dezimalzahl schreiben. Dazu dividiert man den Zähler durch den Nenner. Man setzt im Ergebnis ein Komma, sobald man beim Dividenden das Komma überschreiten muss.\nDabei erhält man entweder eine abbrechende oder eine periodische Dezimalzahl.\nBeispiel abbrechend: 37,000 : 8 = 4,625\nBeispiel periodisch: 130000 : 11 = 1,181818... = 1,18 (periodisch), 13/11 = 1,18 mit Periodenstrich", "category": "Brüche & Dezimalzahlen", "id": "r15", "diagram": null}, {"title": "Vergleichen von periodischen Dezimalzahlen", "page": 9, "body": "Beispiele: 0,45 < 0,45(periodisch); 0,45(per)=0,45454545...; 0,45(per)>0,454(per); 0,213(per)>0,121; 0,98<0,998", "category": "Brüche & Dezimalzahlen", "id": "r16", "diagram": null}, {"title": "Runden von periodischen Dezimalzahlen", "page": 9, "body": "Auf die 3. Dezimale: 0,3(per)≈0,333; 0,28(per)≈0,283; 0,82(per)≈0,828; 0,796(per)≈0,797; 0,19(per)≈0,200", "category": "Brüche & Dezimalzahlen", "id": "r17", "diagram": null}, {"title": "Dezimalschreibweise bei Größen - Kommaverschiebung bei Flächen-, Längen-, Volumen- und Gewichtsangaben", "page": 10, "body": "Wenn man eine Größe in einer kleineren Maßeinheit angeben möchte, dann muss man bei der Maßzahl das Komma nach rechts verschieben.\nBeispiel: 3,21m = 32,1dm; 3,21m² = 321dm²; 3,21m³=3210dm³; 1,2kg=1200g\nWenn man eine Größe in einer größeren Maßeinheit angeben möchte, dann muss man bei der Maßzahl das Komma nach links verschieben.\nBeispiel: 7,2dm=0,72m; 7,2dm²=0,072m²; 7,2dm³=0,0072m³; 345g=0,345kg", "category": "Brüche & Dezimalzahlen", "id": "r18", "diagram": null}, {"title": "Addieren und Subtrahieren von Brüchen", "page": 10, "body": "Beispiele: 1/8+2/8=3/8; 2/10+2/10=4/10=2/5; 3/10+1/5=5/10=1/2\nMan addiert (subtrahiert) zwei Brüche, indem man sie zuerst gleichnamig macht (sie also auf denselben Nenner bringt), und danach die Zähler addiert (subtrahiert) und den Nenner beibehält. Ergebnis vollständig kürzen!", "category": "Brüche & Dezimalzahlen", "id": "r19", "diagram": null}, {"title": "Brüche addieren/subtrahieren mit gemischten Zahlen", "page": 11, "body": "Beispiel: 4 - 55/60 = 3 5/60 (oder: 4-55/60 = 3 60/60 - 55/60 = 3 5/60)\n2 3/5 + 1 1/15 = 2 9/15 + 1 1/15 = 3 10/15 = 3 2/3\n2 3/5 + 1 7/15 = 2 9/15 + 1 7/15 = 3 16/15 = 4 1/15\n4 1/6 - 2 1/3 = 4 1/6 - 2 2/6 = 3 7/6 - 2 2/6 = 1 5/6", "category": "Brüche & Dezimalzahlen", "id": "r20", "diagram": null}, {"title": "Dezimalzahl addieren und subtrahieren", "page": 11, "body": "Wie bei den ganzen Zahlen addiert und subtrahiert man Dezimalzahlen stellenweise.\nDamit gleiche Stellen untereinander stehen, muss Komma unter Komma stehen!!!\nBeispiel: 12,534 + 8,910 = 21,444; 12,534 - 8,910 = 03,624", "category": "Brüche & Dezimalzahlen", "id": "r21", "diagram": null}, {"title": "Geschicktes Rechnen", "page": 11, "body": "- Es sollten zunächst alle Zahlen in derselben Form vorliegen (Bruch oder Prozent oder Dezimalzahl)\n- In einer Summe kann man Summanden vertauschen (Kommutativgesetz) oder einklammern (Assoziativgesetz), um schneller rechnen zu können.", "category": "Brüche & Dezimalzahlen", "id": "r22", "diagram": null}, {"title": "Die Minusklammerregel", "page": 12, "body": "Statt mehrere Zahlen zu subtrahieren, kann es manchmal geschickter sein, ihre Summe zu subtrahieren, also eine Minusklammer zu setzen.\nBeispiel: 3 - 3/10 - 0,7 = 3-(3/10+7/10) = 3-1 = 2\nManchmal kann es sinnvoll sein keine Minusklammer zu setzen: 6,8-2,8-3,5 = 4-3,5 = 0,5", "category": "Brüche & Dezimalzahlen", "id": "r23", "diagram": null}, {"title": "Richtiges Vertauschen beim Addieren und Subtrahieren", "page": 12, "body": "Das Kommutativgesetz gilt nur für \"+\" und \"·\". Manchmal kann es aber auch beim Subtrahieren geschickt sein, die Zahlen zu vertauschen. Dann muss man darauf achten, die Rechenzeichen mit der Zahl zusammen, die hinter dem Zeichen steht, zu vertauschen. (Vorzeichen mitnehmen!)\nBeispiel: 3,89+2,5+0,11-0,5 = 3,89+0,11+2,5-0,5 = 4+2 = 6", "category": "Brüche & Dezimalzahlen", "id": "r24", "diagram": null}, {"title": "Addieren und Subtrahieren von Größen", "page": 12, "body": "- Verschiedene Größenangaben zuerst in die gleiche Einheit umrechnen\n- Zahlen mathematisch korrekt addieren/subtrahieren (Komma unter Komma, evtl. geschickt rechnen)\n- Erinnerung: Einheiten (Einheit kleiner => Zahl größer!)", "category": "Brüche & Dezimalzahlen", "id": "r25", "diagram": null}, {"title": "Das erweiterte Koordinatensystem", "page": 13, "body": "Man kann die beiden Achsen des Koordinatensystems in den negativen Zahlen hinein erweitern.", "category": "Koordinatensystem, Kreis & Winkel", "id": "r26", "diagram": null}, {"title": "Verschiebungen", "page": 13, "body": "Bei einer Verschiebung verschiebt man alle Punkte dieser Figur gleich weit und in die gleiche Richtung. Der Verschiebungspfeil legt durch seine Länge und Richtung die Verschiebung fest.", "category": "Koordinatensystem, Kreis & Winkel", "id": "r27", "diagram": "<svg viewBox=\"0 0 260 200\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><defs><marker id=\"arrowhead\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><polygon points=\"0,0 8,4 0,8\" fill=\"#4f46e5\"/></marker></defs><circle cx=\"40\" cy=\"150\" r=\"3\" fill=\"#1f2937\"/><text x=\"26\" y=\"156\" font-size=\"14\" fill=\"#1f2937\" font-weight=\"600\">A</text><line x1=\"40\" y1=\"150\" x2=\"220\" y2=\"60\" stroke=\"#4f46e5\" stroke-width=\"2.5\" marker-end=\"url(#arrowhead)\"/><circle cx=\"220\" cy=\"60\" r=\"3\" fill=\"#0d9488\"/><text x=\"228\" y=\"54\" font-size=\"14\" fill=\"#0d9488\" font-weight=\"600\">A'</text></svg>"}, {"title": "Kreis und Kreisfiguren", "page": 13, "body": "Alle Punkte eines Kreises (also alle Punkte auf der Kreislinie) haben vom Mittelpunkt (M) des Kreises den gleichen Abstand. Dieser Abstand heißt Radius (r).", "category": "Koordinatensystem, Kreis & Winkel", "id": "r28", "diagram": "<svg viewBox=\"0 0 240 240\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"120\" cy=\"120\" r=\"90\" fill=\"none\" stroke=\"#1f2937\" stroke-width=\"2.5\"/><line x1=\"120\" y1=\"120\" x2=\"210\" y2=\"120\" stroke=\"#0d9488\" stroke-width=\"2\"/><text x=\"161.0\" y=\"112\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">r</text><line x1=\"30\" y1=\"160\" x2=\"210\" y2=\"160\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"112\" y=\"178\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">d</text><circle cx=\"120\" cy=\"120\" r=\"3\" fill=\"#1f2937\"/><text x=\"126\" y=\"114\" font-size=\"12\" fill=\"#94a3b8\">M</text></svg>"}, {"title": "Winkel", "page": 14, "body": "Ein Winkel wird von zwei Schenkeln mit gemeinsamem Anfangspunkt eingeschlossen. Der gemeinsame Punkt heißt Scheitelpunkt. Winkel benennt man mit griechischen Buchstaben: α=alpha, β=beta, γ=gamma, δ=delta, ε=epsilon, π=pi, Ω=omega.\nWinkel werden immer gegen den Uhrzeigersinn gemessen.", "category": "Koordinatensystem, Kreis & Winkel", "id": "r29", "diagram": "<svg viewBox=\"0 0 220 220\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <line x1=\"40\" y1=\"180\" x2=\"180\" y2=\"180\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <line x1=\"40\" y1=\"180\" x2=\"120.30070108914646\" y2=\"65.31871379954114\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <path d=\"M 74 180 A 34 34 0 0 0 59.50159883593557 152.1488304941743\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n    <text x=\"86.12456332526753\" y=\"155.98907211177823\" font-size=\"16\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"middle\">α</text>\n    <circle cx=\"40\" cy=\"180\" r=\"3\" fill=\"#1f2937\"/>\n    <text x=\"26\" y=\"196\" font-size=\"13\" fill=\"#94a3b8\">S</text>\n    </svg>"}, {"title": "Verschiedene Winkelarten und ihre Größen", "page": 14, "body": "Die Größe von Winkeln wird in Grad angegeben. Ein Winkel von 1 Grad (kurz 1°) entsteht, wenn ein Kreis in 360 gleiche Teile zerlegt wird. Winkel werden nach ihrer Größe in verschiedene Winkelarten eingeteilt:\n- spitzer Winkel (kleiner als 90°)\n- rechter Winkel (genau 90°)\n- stumpfer Winkel (zwischen 90° und 180°)\n- gestreckter Winkel (180°)\n- überstumpfer Winkel (zwischen 180° und 360°)\n- voller Winkel (360°)", "category": "Koordinatensystem, Kreis & Winkel", "id": "r30", "diagram": "<svg viewBox=\"0 0 450 300\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n        <circle cx=\"75.0\" cy=\"62\" r=\"40\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n        <path d=\"M 75.0 62 L 115.0 62 A 40 40 0 0 0 100.71150438746157 31.35822227524088 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n        <text x=\"75.0\" y=\"128\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">spitzer Winkel</text>\n        <text x=\"75.0\" y=\"143\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"middle\"><90°</text>\n        \n        <circle cx=\"225.0\" cy=\"62\" r=\"40\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n        <path d=\"M 225.0 62 L 265.0 62 A 40 40 0 0 0 225.0 22.0 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n        <text x=\"225.0\" y=\"128\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">rechter Winkel</text>\n        <text x=\"225.0\" y=\"143\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"middle\">=90°</text>\n        \n        <circle cx=\"375.0\" cy=\"62\" r=\"40\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n        <path d=\"M 375.0 62 L 415.0 62 A 40 40 0 0 0 349.28849561253844 31.35822227524088 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n        <text x=\"375.0\" y=\"128\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">stumpfer Winkel</text>\n        <text x=\"375.0\" y=\"143\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"middle\">90°–180°</text>\n        \n        <circle cx=\"75.0\" cy=\"212\" r=\"40\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n        <path d=\"M 75.0 212 L 115.0 212 A 40 40 0 0 0 35.0 212.0 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n        <text x=\"75.0\" y=\"278\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">gestreckter Winkel</text>\n        <text x=\"75.0\" y=\"293\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"middle\">=180°</text>\n        \n        <circle cx=\"225.0\" cy=\"212\" r=\"40\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n        <path d=\"M 225.0 212 L 265.0 212 A 40 40 0 1 0 218.0540728933228 251.39231012048833 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n        <text x=\"225.0\" y=\"278\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">überstumpfer Winkel</text>\n        <text x=\"225.0\" y=\"293\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"middle\">180°–360°</text>\n        \n        <circle cx=\"375.0\" cy=\"212\" r=\"40\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n        <path d=\"M 375.0 212 L 415.0 212 A 40 40 0 1 0 414.84778792366984 215.48622970990633 Z\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.5\"/>\n        <text x=\"375.0\" y=\"278\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">voller Winkel</text>\n        <text x=\"375.0\" y=\"293\" font-size=\"11\" fill=\"#94a3b8\" text-anchor=\"middle\">=360°</text>\n        </svg>"}, {"title": "Benennungsmöglichkeiten von Winkeln", "page": 15, "body": "Winkel können benannt werden als: α = ∡(a,b) [Schenkel-Namen]; β = ∡(b,a); γ = ∡BAC [Punkt-Namen, Scheitelpunkt in der Mitte]", "category": "Koordinatensystem, Kreis & Winkel", "id": "r31", "diagram": "<svg viewBox=\"0 0 300 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style>\n    <polygon points=\"30,200 260,200 150,30\" fill=\"#eef2ff\" stroke=\"#1f2937\" stroke-width=\"2.5\"/>\n    <text x=\"24\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">A</text><text x=\"262\" y=\"220\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">B</text><text x=\"146\" y=\"20\" font-size=\"13\" fill=\"#1f2937\" font-weight=\"700\">C</text><text x=\"145.0\" y=\"220\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">b</text><text x=\"219.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\"></text><text x=\"74.0\" y=\"115.0\" font-size=\"13\" fill=\"#0d9488\" font-weight=\"600\">a</text><text x=\"50\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\">α</text><text x=\"236\" y=\"190\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\"></text><text x=\"150\" y=\"52\" font-size=\"13\" fill=\"#4f46e5\" font-weight=\"600\"></text><text x=\"150\" y=\"235\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">∡(a,b) / ∡BAC</text></svg>"}, {"title": "Winkel zwischen 0° und 180° - Aufgabe: Zeichne einen 30°-Winkel", "page": 15, "body": "1) Zeichne einen Schenkel des Winkels und den Scheitelpunkt S.\n2) Geodreieck so an den ersten Schenkel anlegen, dass der Scheitelpunkt S bei der 0 liegt. Danach die Größe des Winkels bei 30° markieren -> dabei darauf achten, dass man die richtige der beiden Winkelskalen verwendet.\n3) Anschließend den zweiten Schenkel zeichnen.", "category": "Koordinatensystem, Kreis & Winkel", "id": "r32", "diagram": null}, {"title": "Vervielfachen von Brüchen", "page": 16, "body": "Beispiel: 5 · 3/4 = 3/4+3/4+3/4+3/4+3/4 = 15/4 = 3 3/4\nMultipliziert man einen Bruch mit einer ganzen Zahl, so wird der Zähler mit der Zahl multipliziert und der Nenner wird beibehalten. Bei Möglichkeit sollte noch vor dem Multiplizieren gekürzt werden.\nBeispiel: 25·13/10 = 25·13/10 = 325/10 = 65/2 (mit Kürzen vorher: 25·13/10 = 5·13/2 = 65/2)", "category": "Bruchrechnung: Malnehmen & Teilen", "id": "r33", "diagram": null}, {"title": "Teilen von Brüchen", "page": 16, "body": "Beispiel: 8/9 : 4 = 2/9; 8/9 : 3 = 8/27\nWenn man einen Bruch durch eine ganze Zahl dividiert, hat man zwei Möglichkeiten:\n1. Der Zähler wird durch die Zahl dividiert, der Nenner wird beibehalten.\n2. Der Zähler wird beibehalten und der Nenner wird mit der Zahl multipliziert.\nDie zweite Möglichkeit ist sinnvoll, wenn die Zahl, durch die geteilt wird, kein Teiler des Zählers ist.", "category": "Bruchrechnung: Malnehmen & Teilen", "id": "r34", "diagram": null}, {"title": "Multiplizieren von Brüchen", "page": 17, "body": "Beispiel: 1/2 von 3/4: A) 3/4:2 = 3/(4·2) = 3/8; B) 3/4 · 1/2 = 3·1/(4·2) = 3/8; 2/3 von 4/5 = 2/3·4/5=8/15\nMan multipliziert zwei Brüche, indem man den Zähler mit dem Zähler und den Nenner mit dem Nenner multipliziert. Wenn möglich vorher kürzen.", "category": "Bruchrechnung: Malnehmen & Teilen", "id": "r35", "diagram": "<svg viewBox=\"0 0 128 64\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><rect x=\"1.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"33.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"65.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"97.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"1.5\" y=\"33.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#f3f4f6\" fill-opacity=\"1\" stroke=\"#94a3b8\" stroke-width=\"1\"/><rect x=\"33.5\" y=\"33.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#f3f4f6\" fill-opacity=\"1\" stroke=\"#94a3b8\" stroke-width=\"1\"/><rect x=\"65.5\" y=\"33.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#f3f4f6\" fill-opacity=\"1\" stroke=\"#94a3b8\" stroke-width=\"1\"/><rect x=\"97.5\" y=\"33.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#f3f4f6\" fill-opacity=\"1\" stroke=\"#94a3b8\" stroke-width=\"1\"/></svg>"}, {"title": "Dividieren von Brüchen", "page": 17, "body": "Beispielaufgabe: Wie viele (gleich große) Gefäße mit dem angegebenen Fassungsvermögen brauche ich, um 12l Wasser umzufüllen?\nTabelle: 12l/2l=6; 12l/1l=12; 12l/(1/2)l=24; 12l/(1/3)l=36; 12l/(1/4)l=48; 12l/(3/4)l=16\nMan dividiert durch einen Bruch, indem man mit dem Kehrwert multipliziert. Bei Multiplizieren darf gekürzt werden.\nBeispiel: 12 : 2/3 = 12 · 3/2 = 18; 5/6 : 2/7 = 5/6 · 7/2 = 35/12\nMerksatz: Division als Multiplikation schreiben -> kürzen -> multiplizieren", "category": "Bruchrechnung: Malnehmen & Teilen", "id": "r36", "diagram": "<svg viewBox=\"0 0 288 32\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><rect x=\"1.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"33.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"65.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"97.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"129.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"161.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"193.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"225.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#4f46e5\" fill-opacity=\"0.85\" stroke=\"none\" stroke-width=\"1\"/><rect x=\"257.5\" y=\"1.5\" width=\"29\" height=\"29\" rx=\"4\" fill=\"#f3f4f6\" fill-opacity=\"1\" stroke=\"#94a3b8\" stroke-width=\"1\"/></svg>"}, {"title": "Multiplizieren und Dividieren mit Zehnerpotenzen", "page": 18, "body": "Beispiel: 0,32·10 = 32/100·10 = 32·10/100 = 32/10; 320:100 = 320·1/100=320/100=32/10=3,2\nBeim Multiplizieren einer Dezimalzahl mit 10,100,1000,... verschiebt sich das Komma der Dezimalzahl um 1,2,3,... Stellen nach rechts.\nBeim Dividieren einer Dezimalzahl mit 10,100,1000,... verschiebt sich das Komma der Dezimalzahl um 1,2,3,... Stellen nach links.\nMerke: Das Komma wird um so viele Stellen verschoben wie die Zehnerpotenz Nullen hat. Beispiel: 10³=1.000 (3 Nullen); 10⁶=1.000.000 (6 Nullen)", "category": "Bruchrechnung: Malnehmen & Teilen", "id": "r37", "diagram": null}, {"title": "Dezimalzahlen multiplizieren", "page": 18, "body": "1) Mache eine Nebenrechnung. Multipliziere die Zahlen zunächst ohne das Komma.\n2) Setze das Komma dann so, dass das Ergebnis genauso viele Nachkommastellen hat wie die beiden Faktoren zusammen.", "category": "Bruchrechnung: Malnehmen & Teilen", "id": "r38", "diagram": null}, {"title": "Wiederholung: Ausmultiplizieren", "page": 19, "body": "Beispiel: 12/5 · (5/3 + 10/4) = 12/5·5/3 + 12/5·10/4 = 4 + 6 = 10", "category": "Statistik-Basics & Terme", "id": "r39", "diagram": null}, {"title": "Relative Häufigkeiten und Diagramme", "page": 19, "body": "Anzahlen nennt man in der Statistik absolute Häufigkeiten. Die zugehörigen Anteile an der Gesamtzahl nennt man relative Häufigkeiten.\nrelative Häufigkeit = absolute Häufigkeit / Gesamtzahl\nDie Summe aller relativen Häufigkeiten muss 1 bzw. 100% ergeben.\nabsolute Häufigkeit = relative Häufigkeit · Gesamtzahl", "category": "Statistik-Basics & Terme", "id": "r40", "diagram": null}, {"title": "Zahlenfolgen", "page": 19, "body": "Zahlenfolgen weisen eine Struktur auf, wenn sich eine Regel aufstellen lässt, mit der man weitere Zahlen der Folge ermitteln kann.", "category": "Statistik-Basics & Terme", "id": "r41", "diagram": null}, {"title": "Mittelwerte: Median und arithmetisches Mittel", "page": 20, "body": "Der Median einer Zahlenliste ist der Wert, der nach dem Sortieren der Liste in der Mitte steht.\nDas arithmetische Mittel gibt an, wie viel bei gleichmäßiger Aufteilung der Summe auf jeden einzelnen Wert entfällt. (Dieser Wert wird im Alltag oft \"Durchschnitt\" genannt.)\narithmetisches Mittel = Summe aller Werte / Anzahl der Werte\nSonderfall beim Median: Wenn eine Liste keinen mittleren Wert hat, ist der Median das arithmetische Mittel der beiden mittleren Werte.", "category": "Statistik-Basics & Terme", "id": "r42", "diagram": null}, {"title": "Terme mit einer Variablen", "page": 20, "body": "In einem Term 2·x+1 kann man anstelle von x verschiedene Zahlen einsetzen, denn x ist variabel (=veränderlich). Setzt man für die Variable eine Zahl ein, so berechnet man den Wert des Terms.\nUm zu einem Sachverhalt einen Term aufzustellen, kann man wie folgt vorgehen:\n1) systematisch einfache Beispiele betrachten (z.B. in einer Tabelle).\n2) erkennen, was sich verändert, und dafür eine Variable festlegen.\n3) den Term mit einer Variablen aufstellen.", "category": "Statistik-Basics & Terme", "id": "r43", "diagram": null}, {"title": "Dezimalzahlen dividieren", "page": 21, "body": "Beispielaufgabe: 12,75l Bowle sollen auf 0,4l-Becher aufgeteilt werden. Wie viele Becher werden benötigt?\n12,75l : 0,4l = 12750ml : 400ml (Komma bei beiden Zahlen um 3 Stellen verschieben); 12750:400 = 31,875 -> Man braucht 32 Becher.\n1) Kommas in beiden Zahlen um die gleiche Anzahl an Stellen nach rechts verschieben, bis die Zahl, durch die geteilt wird, eine ganze Zahl ist.\n2) Division durchführen; Beim Überschreiten des Kommas wird auch im Ergebnis ein Komma gesetzt.\nTipp für geeignete Überschläge: Ebenfalls Kommaverschiebung nutzen!", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r44", "diagram": null}, {"title": "Distributivgesetz: Ausklammern", "page": 21, "body": "Beispiel: 2/3·2/9 + 2/3·7/9 = 2/3·(2/9+7/9) = 2/3·1 = 2/3\nBeispiel: 3,2·9,84 - 3,2·4,84 = 3,2·(9,84-4,84) = 3,2·5 = 16", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r45", "diagram": null}, {"title": "Der Je-mehr-desto-mehr-Dreisatz", "page": 22, "body": "Beispiel: 500g Kirschen kosten 1,80€. Wieviel kosten 400g Kirschen?\nTabelle: 500g -> 1,80€ (:5) -> 100g -> 0,36€ (·4) -> 400g -> 1,44€. 400g Kirschen kosten also 1,44€.\nEin Je-mehr-desto-mehr-Dreisatz darf nur angewendet werden, wenn zum Doppelten der einen Größe immer das Doppelte der anderen Größe gehört.", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r46", "diagram": null}, {"title": "Ganze Zahlen an der Zahlengeraden", "page": 22, "body": "Die Zahlen ...,-3,-2,-1,0,1,2,3,... nennt man ganze Zahlen (Z). Man kann sie an einer Zahlengeraden darstellen.\nNegative Zahlen stehen links von 0. Positive Zahlen stehen rechts von 0.\nVon zwei Zahlen ist diejenige kleiner, die weiter links auf der Zahlengerade liegt: -5<3.\n+1 und -1 nennt man Gegenzahlen. Gegenzahlen haben denselben Abstand zu 0.", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r47", "diagram": "<svg viewBox=\"0 0 340 90\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"20\" y1=\"50\" x2=\"320\" y2=\"50\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"45\" x2=\"30.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-6</text><line x1=\"53.33333333333333\" y1=\"45\" x2=\"53.33333333333333\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"53.33333333333333\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-5</text><line x1=\"76.66666666666666\" y1=\"45\" x2=\"76.66666666666666\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"76.66666666666666\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-4</text><line x1=\"100.0\" y1=\"45\" x2=\"100.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-3</text><line x1=\"123.33333333333333\" y1=\"45\" x2=\"123.33333333333333\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"123.33333333333333\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-2</text><line x1=\"146.66666666666669\" y1=\"45\" x2=\"146.66666666666669\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"146.66666666666669\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-1</text><line x1=\"170.0\" y1=\"45\" x2=\"170.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">0</text><line x1=\"193.33333333333334\" y1=\"45\" x2=\"193.33333333333334\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"193.33333333333334\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">1</text><line x1=\"216.66666666666666\" y1=\"45\" x2=\"216.66666666666666\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"216.66666666666666\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">2</text><line x1=\"240.0\" y1=\"45\" x2=\"240.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"240.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">3</text><line x1=\"263.33333333333337\" y1=\"45\" x2=\"263.33333333333337\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"263.33333333333337\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">4</text><line x1=\"286.66666666666663\" y1=\"45\" x2=\"286.66666666666663\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"286.66666666666663\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">5</text><line x1=\"310.0\" y1=\"45\" x2=\"310.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"310.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">6</text><polygon points=\"320,45 330,50 320,55\" fill=\"#1f2937\"/><circle cx=\"100.0\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"100.0\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">-3</text><circle cx=\"240.0\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"240.0\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">3</text></svg>"}, {"title": "Zahlenmengen", "page": 23, "body": "Natürliche Zahlen (N): 0,1,2,3,4,5,6,7,...\nGanze Zahlen (Z): ...,-3,-2,-1,0,1,2,3,...\nRationale Zahlen (Q): auch Brüche/Dezimalzahlen wie -0,9; -0,6; -0,2; 1/2; 3/4 usw.\nDie rationalen Zahlen sind alle positiven und negativen Zahlen, die sich als Brüche notieren lassen. Auch die Zahl 0 ist eine rationale Zahl.", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r48", "diagram": "<svg viewBox=\"0 0 300 300\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><circle cx=\"150\" cy=\"150\" r=\"130\" fill=\"#e0e7ff\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"40\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">R</text><circle cx=\"150\" cy=\"150\" r=\"100\" fill=\"#c7d2fe\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"70\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">Q</text><circle cx=\"150\" cy=\"150\" r=\"68\" fill=\"#a5b4fc\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"102\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">Z</text><circle cx=\"150\" cy=\"150\" r=\"36\" fill=\"#818cf8\" fill-opacity=\"0.55\" stroke=\"#1f2937\" stroke-width=\"1.3\"/><text x=\"150\" y=\"134\" font-size=\"15\" fill=\"#1f2937\" font-weight=\"700\" text-anchor=\"middle\">N</text></svg>"}, {"title": "Der Betrag einer Zahl", "page": 23, "body": "Den Abstand einer Zahl von der Zahl 0 nennt man ihren Betrag. Der Betrag einer Zahl ist immer positiv oder null.\nMan schreibt: |-3,4| = 3,4; |3,4| = 3,4\nEine Zahl und ihre Gegenzahl haben denselben Betrag.", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r49", "diagram": null}, {"title": "Addieren und Subtrahieren von positiven Zahlen", "page": 23, "body": "Addieren einer pos. Zahl -> Gehe auf der Zahlengeraden nach rechts. Beispiel: -7+3=-4\nSubtrahieren einer pos. Zahl -> Gehe auf der Zahlengeraden nach links. Beispiel: 1-3=-2\nDabei gibt es vier mögliche Fälle:", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r50", "diagram": "<svg viewBox=\"0 0 340 90\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"20\" y1=\"50\" x2=\"320\" y2=\"50\" stroke=\"#1f2937\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"45\" x2=\"30.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"30.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-8</text><line x1=\"76.66666666666666\" y1=\"45\" x2=\"76.66666666666666\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"76.66666666666666\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-6</text><line x1=\"123.33333333333333\" y1=\"45\" x2=\"123.33333333333333\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"123.33333333333333\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-4</text><line x1=\"170.0\" y1=\"45\" x2=\"170.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">-2</text><line x1=\"216.66666666666666\" y1=\"45\" x2=\"216.66666666666666\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"216.66666666666666\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">0</text><line x1=\"263.33333333333337\" y1=\"45\" x2=\"263.33333333333337\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"263.33333333333337\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">2</text><line x1=\"310.0\" y1=\"45\" x2=\"310.0\" y2=\"55\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"310.0\" y=\"72\" font-size=\"12\" fill=\"#94a3b8\" text-anchor=\"middle\">4</text><polygon points=\"320,45 330,50 320,55\" fill=\"#1f2937\"/><circle cx=\"123.33333333333333\" cy=\"50\" r=\"5\" fill=\"#0d9488\"/><text x=\"123.33333333333333\" y=\"36\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"600\">-7+3=-4</text></svg>"}, {"title": "Geschickt rechnen - Plus- und Minusklammern", "page": 24, "body": "Steht vor einer Klammer ein \"+\", kann man die Klammer auch einfach weglassen.\nBeim Auflösen einer Minusklammer kehren sich alle Vorzeichen in der Klammer um. Ebenso müssen beim Setzen einer Minusklammer alle Vorzeichen geändert werden.\nBeispiele: 633+(-72-633) = 633-72-633 = -72\n633-(+633-72) = 633-633+72 = 72\n633-17-10-6 = 633-(17+10+6) = 633-33 = 600", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r51", "diagram": null}, {"title": "Multiplizieren und Dividieren rationaler Zahlen", "page": 24, "body": "Wenn man zwei Zahlen mit gleichem Vorzeichen multipliziert bzw. dividiert, dann ist das Ergebnis positiv.\nWenn man zwei Zahlen mit unterschiedlichen Vorzeichen multipliziert bzw. dividiert, dann ist das Ergebnis negativ.\nVorzeichenregeln: +·-=-; -·+=-; +·+=+; -·-=+ (ebenso für Division: +:-=-; -:+=-; +:+=+; -:-=+)", "category": "Dezimalzahlen & Rationale Zahlen", "id": "r52", "diagram": null}, {"title": "Zuordnung", "page": 25, "body": "Beispiel: Tagestemperaturverlauf - Tabelle mit Uhrzeit (0-14) und Temperatur.\nZuordnung: Uhrzeit -> Temperatur; x-Achse -> y-Achse\nMan kann die Wertpaare (x|y) als Punkte in einem Koordinatensystem eintragen. So ergibt sich der Graph der Zuordnung. Dabei muss man darauf achten, ob es sinnvoll ist, die eingetragenen Punkte zu verbinden.", "category": "Zuordnungen & Prozent-Grundlagen", "id": "r53", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"44.0\" y1=\"28\" x2=\"44.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"60.0\" y1=\"28\" x2=\"60.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"76.0\" y1=\"28\" x2=\"76.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"92.0\" y1=\"28\" x2=\"92.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"108.0\" y1=\"28\" x2=\"108.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"124.0\" y1=\"28\" x2=\"124.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"140.0\ "/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"188.0\" x2=\"252\" y2=\"188.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"124.0\" x2=\"252\" y2=\"124.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"60.0\" x2=\"252\" y2=\"60.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"28.0\" y1=\"252\" x2=\"28.0\" y2=\"28\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"258\" y=\"256.0\" font-size=\"12\" fill=\"#94a3b8\">x</text><text x=\"14.0\" y=\"24\" font-size=\"12\" fill=\"#94a3b8\">y</text><line x1=\"28.0\" y1=\"252.0\" x2=\"252.0\" y2=\"34.400000000000006\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/><text x=\"207.20000000000002\" y=\"69.91999999999999\" font-size=\"12.5\" fill=\"#4f46e5\" font-weight=\"600\" text-anchor=\"end\">y=q·x</text></svg>"}, {"title": "Der Graph einer proportionalen Zuordnung", "page": 26, "body": "Der Graph einer proportionalen Zuordnung ist eine Gerade, die durch den Ursprung geht (also durch (0|0)).\nWertetabelle Beispiel: Masse [kg] x: 0,1 0,3 0,5 0,7 0,9 1,2 1,9; Preis [€] y: 0,17 0,51 0,85 1,19 1,53 2,04 3,23", "category": "Zuordnungen & Prozent-Grundlagen", "id": "r55", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"140.0\" y1=\"28\" x2=\"140.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"188.0\" x2=\"252\" y2=\"188.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"124.0\" x2=\"252\" y2=\"124.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"60.0\" x2=\"252\" y2=\"60.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><line x1=\"28.0\" y1=\"252\" x2=\"28.0\" y2=\"28\" stroke=\"#1f2937\" stroke-width=\"1.5\"/><text x=\"258\" y=\"256.0\" font-size=\"12\" fill=\"#94a3b8\">x</text><text x=\"14.0\" y=\"24\" font-size=\"12\" fill=\"#94a3b8\">y</text><line x1=\"28.0\" y1=\"252.0\" x2=\"252.0\" y2=\"34.400000000000006\" stroke=\"#4f46e5\" stroke-width=\"2.3\"/></svg>"}, {"title": "Proportionalitätsfaktor / Zusammenfassung proportionale Zuordnung", "page": 27, "body": "Der Quotient y:x aller Wertepaare ist gleich. Man sagt: Proportionale Zuordnungen sind quotientengleich. Den Quotienten aus dem y-Wert und dem zugehörigen x-Wert nennt man Proportionalitätsfaktor q. q=y/x für jedes Wertepaar (x|y). Mithilfe des Proportionalitätsfaktors q lässt sich eine Gleichung (Formel) für die Zuordnung angeben: y=q·x.\n\nZusammenfassung - Für proportionale Zuordnungen gilt:\n- zum Doppelten von x gehört auch das Doppelte von y.\n- zum Berechnen fehlender Größen kann man den Dreisatz verwenden.\n- Alle Wertepaare sind quotientengleich (y/x), den Quotienten nennt man Proportionalitätsfaktor q=y/x.\n- Die Formel lautet y=q·x.\n- Der Graph ist eine Ursprungsgerade.", "category": "Zuordnungen & Prozent-Grundlagen", "id": "r56", "diagram": null}, {"title": "Antiproportionale Zuordnungen", "page": 28, "body": "Eine Zuordnung ist antiproportional, wenn zum Doppelten, Dreifachen,... der ersten Größe die Hälfte, das Drittel,... der zweiten Größe gehört.\nBeispiel: x: 1 2 3 4 5 6; y: 30 15 10 7,5 6 5\nAlle Wertepaare sind produktgleich. Das Ergebnis dieser Produkte nennt man Antiproportionalitätskonstante p. (p = x-Wert · y-Wert)\nDie Formel der Zuordnung lautet y = p/x\nDer Graph einer antiproportionalen Zuordnung heißt Hyperbel. Gleichung dieser Hyperbel: y = 30:x\nBei antiproportionalen Zuordnungen kann man fehlende Größen auch mit dem \"Je-mehr-desto-weniger\"-Dreisatz berechnen.\nBeispiel: Anzahl der gleichlangen Stücke aus einem 30cm-Papierstreifen / Länge eines Stücks [cm]: 2->15, 1->30, 7->30/7", "category": "Zuordnungen & Prozent-Grundlagen", "id": "r57", "diagram": "<svg viewBox=\"0 0 280 280\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><style>line,polyline,path,polygon{stroke-linecap:round;stroke-linejoin:round;} text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;}</style><line x1=\"28.0\" y1=\"28\" x2=\"28.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"60.0\" y1=\"28\" x2=\"60.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"92.0\" y1=\"28\" x2=\"92.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"124.0\" y1=\"28\" x2=\"124.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"156.0\" y1=\"28\" x2=\"156.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"188.0\" y1=\"28\" x2=\"188.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"220.0\" y1=\"28\" x2=\"220.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"252.0\" y1=\"28\" x2=\"252.0\" y2=\"252\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"252.0\" x2=\"252\" y2=\"252.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"245.0\" x2=\"252\" y2=\"245.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"238.0\" x2=\"252\" y2=\"238.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"231.0\" x2=\"252\" y2=\"231.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"224.0\" x2=\"252\" y2=\"224.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line x1=\"28\" y1=\"217.0\" x2=\"252\" y2=\"217.0\" stroke=\"#f1f0ea\" stroke-width=\"1\"/><line
