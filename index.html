<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Regelheft Mathematik</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Regelheft">
<meta name="author" content="Gölitzer Development">
<meta name="copyright" content="Copyright © Gölitzer Development">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/footer.css">
<link rel="stylesheet" href="assets/css/seiten.css">
</head>
<body>

<header class="top">
  <div class="toprow"><a class="brand" href="index.html"><h1>Regelheft Mathematik</h1></a><div data-account></div></div>
  <p class="sub">Alle Regeln, Formeln &amp; Grafiken auf einen Blick</p>
  <div class="searchwrap">
    <span class="icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <input id="searchInput" type="text" placeholder="Regel suchen … z. B. „kürzen“, „Pythagoras“, „pq-Formel“" autocomplete="off">
    <button class="clear-btn" id="clearBtn" aria-label="Suche löschen">✕</button>
  </div>
  <a class="ai-open" id="aiOpen" href="ki.html"><span id="aiOpenIcon" style="display:flex"></span><div>KI-Aufgabenhilfe<span id="aiOpenSub">Foto deiner Aufgabe hochladen, passende Regeln finden</span></div></a>
</header>

<main>
<div class="chips" id="chips"></div>
<div class="meta-row">
  <span><span class="count" id="resultCount"></span> Regeln</span>
  <span id="activeCatLabel"></span>
</div>

<div class="list" id="list"></div>
<div class="empty-state" id="emptyState" style="display:none;">
  <div class="big">Keine Treffer</div>
  <div>Versuch es mit einem anderen Suchbegriff.</div>
</div>
</main>

<div class="news-overlay" id="newsOverlay" role="dialog" aria-modal="true" aria-labelledby="newsTitle">
  <div class="news-card">
    <span class="news-badge">Aktuelles</span>
    <h2 id="newsTitle"></h2>
    <div class="news-date" id="newsDate"></div>
    <ul id="newsList"></ul>
    <button id="newsClose">Alles klar</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-head">
    <button class="back" id="backBtn" aria-label="Zurück zur Liste">←</button>
    <span class="headcat" id="overlayCat"></span>
  </div>
  <div class="overlay-body">
    <h2 id="overlayTitle"></h2>
    <div id="overlayText"></div>
    <div class="diagram-section" id="diagramSection" style="display:none;">
      <div class="label">Skizze</div>
      <div class="diagram-frame" id="diagramFrame"></div>
    </div>
    <div class="source-tag" id="overlaySource"></div>
    <div class="nav-buttons">
      <button id="prevBtn">← Vorherige</button>
      <button id="nextBtn">Nächste →</button>
    </div>
    <div class="overlay-copy">Copyright © Gölitzer Development</div>
  </div>
</div>

<footer id="siteFooter"></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/regeln.js"></script>
<script src="assets/js/index.js"></script>
</body>
</html>
