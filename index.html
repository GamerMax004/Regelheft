8, "category": "Quadratische Funktionen", "body": "## Vereinfachte Form\n$ f(x) = (x - d)² + e ⇒ SP(d|e)\nAn der Scheitelpunktsform kann man den Scheitelpunkt direkt ablesen.\n$ f(x) = (x - 7)² + 4 ⇒ SP(7|4)\n$ g(x) = (x + 2)² - 1 ⇒ SP(-2|-1)\n$ h(x) = x² - 2 ⇒ SP(0|-2)\n## Allgemeine Form\n$ f(x) = a·(x - d)² + e\n- e: Verschiebung in y-Richtung\n- d: Verschiebung in x-Richtung\n- a: Streckung / Stauchung: |a| > 1 gestreckt, |a| < 1 gestaucht, a < 0 an der x-Achse gespiegelt", "plain": "Vereinfachte Form\nf(x) = (x - d)² + e ⇒ SP(d|e)\nAn der Scheitelpunktsform kann man den Scheitelpunkt direkt ablesen.\nf(x) = (x - 7)² + 4 ⇒ SP(7|4)\ng(x) = (x + 2)² - 1 ⇒ SP(-2|-1)\nh(x) = x² - 2 ⇒ SP(0|-2)\nAllgemeine Form\nf(x) = a·(x - d)² + e\ne: Verschiebung in y-Richtung\nd: Verschiebung in x-Richtung\na: Streckung / Stauchung: |a| > 1 gestreckt, |a| < 1 gestaucht, a < 0 an der x-Achse gespiegelt", "excerpt": "Vereinfachte Form f(x) = (x - d)² + e ⇒ SP(d|e) An der Scheitelpunktsform kann man den Scheitelpunkt direkt ablesen.", "diagram": null}, {"id": "r118", "title": "Punktprobe", "page": 59, "category": "Quadratische Funktionen", "body": "Prüfen, ob ein Punkt auf dem Graphen liegt: x einsetzen und mit dem y-Wert vergleichen.\n## Beispiel: f(x) = 6(x - 3)² + 4, liegt P(7|2) auf f?\n$ f(7) = 6·(7 - 3)² + 4 = 6·16 + 4 = 100\n$ 100 ≠ 2 ⇒ P liegt nicht auf f", "plain": "Prüfen, ob ein Punkt auf dem Graphen liegt: x einsetzen und mit dem y-Wert vergleichen.\nBeispiel: f(x) = 6(x - 3)² + 4, liegt P(7|2) auf f?\nf(7) = 6·(7 - 3)² + 4 = 6·16 + 4 = 100\n100 ≠ 2 ⇒ P liegt nicht auf f", "excerpt": "Prüfen, ob ein Punkt auf dem Graphen liegt: x einsetzen und mit dem y-Wert vergleichen. Beispiel: f(x) = 6(x - 3)² + 4, liegt P(7|2) auf f? f(7) = 6·(7 - 3)² + 4 = 6·16 + 4 = 100", "diagram": null}, {"id": "r119", "title": "Funktion aus dem Scheitelpunkt bestimmen", "page": 59, "category": "Quadratische Funktionen", "body": "Ist ein Scheitelpunkt SP(d|e) gegeben, setzt man ihn in die Scheitelpunktsform ein. Der Faktor a ist frei wählbar.\n$ SP(5|-{1/2}) ⇒ f(x) = 3·(x - 5)² - {1/2}\n$ g(x) = 17·(x - 5)² - {1/2}", "plain": "Ist ein Scheitelpunkt SP(d|e) gegeben, setzt man ihn in die Scheitelpunktsform ein. Der Faktor a ist frei wählbar.\nSP(5|-1/2) ⇒ f(x) = 3·(x - 5)² - 1/2\ng(x) = 17·(x - 5)² - 1/2", "excerpt": "Ist ein Scheitelpunkt SP(d|e) gegeben, setzt man ihn in die Scheitelpunktsform ein. Der Faktor a ist frei wählbar. SP(5|-1/2) ⇒ f(x) = 3·(x - 5)² - 1/2 g(x) = 17·(x - 5)² - 1/2", "diagram": null}, {"id": "r120", "title": "Scheitelpunktsform und Normalform", "page": 59, "category": "Quadratische Funktionen", "body": "T: Form§Gleichung§praktisch zum ;; Scheitelpunktsform§f(x) = a·(x - d)² + e§Ablesen des Scheitelpunkts ;; Normalform§f(x) = a·x² + b·x + c§Berechnen der Nullstellen\n- Scheitelpunktsform → Normalform: **ausmultiplizieren**\n- Normalform → Scheitelpunktsform: **quadratische Ergänzung**\n## Beispiel\n$ f(x) = 6·(x - 3)² + 5 ⇒ SP(3|5)\n$ = 6·(x² - 6x + 9) + 5\n$ = 6x² - 36x + 54 + 5\n$ = 6x² - 36x + 59", "plain": "Form, Gleichung, praktisch zum; Scheitelpunktsform, f(x) = a·(x - d)² + e, Ablesen des Scheitelpunkts; Normalform, f(x) = a·x² + b·x + c, Berechnen der Nullstellen\nScheitelpunktsform → Normalform: ausmultiplizieren\nNormalform → Scheitelpunktsform: quadratische Ergänzung\nBeispiel\nf(x) = 6·(x - 3)² + 5 ⇒ SP(3|5)\n= 6·(x² - 6x + 9) + 5\n= 6x² - 36x + 54 + 5\n= 6x² - 36x + 59", "excerpt": "Form, Gleichung, praktisch zum; Scheitelpunktsform, f(x) = a·(x - d)² + e, Ablesen des Scheitelpunkts; Normalform, f(x) = a·x² + b·x + c, Berechnen der Nullstellen Scheitelpunktsform → Normalform: ausmultiplizieren Normalform → Scheitelpunktsform: quadratische Ergänzung", "diagram": null}, {"id": "r121", "title": "Quadratische Ergänzung", "page": 60, "category": "Quadratische Funktionen", "body": "Man halbiert die Zahl vor x, quadriert sie und passt so an, dass eine binomische Formel entsteht.\n## Beispiel 1\n$ f(x) = x² + 4x + 4 = (x + 2)² ⇒ SP(-2|0) ‖ 4 : 2 = 2, 2² = 4\n## Beispiel 2\n$ f(x) = x² + 4x + 6 ‖ 4 : 2 = 2, 2² = 4\n$ = x² + 4x + 4 - 4 + 6 ‖ 4 addiert und wieder subtrahiert\n$ = (x + 2)² + 2 ⇒ SP(-2|2)\n## Beispiel 3\n$ f(x) = x² - 22x + 5 ‖ 22 : 2 = 11, 11² = 121\n$ = (x² - 22x + 121) - 121 + 5\n$ = (x - 11)² - 116 ⇒ SP(11|-116)", "plain": "Man halbiert die Zahl vor x, quadriert sie und passt so an, dass eine binomische Formel entsteht.\nBeispiel 1\nf(x) = x² + 4x + 4 = (x + 2)² ⇒ SP(-2|0) – 4 : 2 = 2, 2² = 4\nBeispiel 2\nf(x) = x² + 4x + 6 – 4 : 2 = 2, 2² = 4\n= x² + 4x + 4 - 4 + 6 – 4 addiert und wieder subtrahiert\n= (x + 2)² + 2 ⇒ SP(-2|2)\nBeispiel 3\nf(x) = x² - 22x + 5 – 22 : 2 = 11, 11² = 121\n= (x² - 22x + 121) - 121 + 5\n= (x - 11)² - 116 ⇒ SP(11|-116)", "excerpt": "Man halbiert die Zahl vor x, quadriert sie und passt so an, dass eine binomische Formel entsteht. Beispiel 1 f(x) = x² + 4x + 4 = (x + 2)² ⇒ SP(-2|0) – 4 : 2 = 2, 2² = 4", "diagram": null}, {"id": "r122", "title": "Die Zahl π", "page": 60, "category": "Quadratische Funktionen", "body": "$ π ≈ 3,14159…\nPi ist keine Variable, sondern eine feste Zahl mit immer demselben Wert.", "plain": "π ≈ 3,14159…\nPi ist keine Variable, sondern eine feste Zahl mit immer demselben Wert.", "excerpt": "π ≈ 3,14159… Pi ist keine Variable, sondern eine feste Zahl mit immer demselben Wert.", "diagram": null}, {"id": "r123", "title": "Umfang und Flächeninhalt eines Kreises", "page": 61, "category": "Kreis, Prisma & Pythagoras", "body": "Für einen Kreis mit Radius r, Durchmesser d, Umfang U und Flächeninhalt A gilt:\n$ U = 2πr = πd\n$ A = πr²", "plain": "Für einen Kreis mit Radius r, Durchmesser d, Umfang U und Flächeninhalt A gilt:\nU = 2πr = πd\nA = πr²", "excerpt": "Für einen Kreis mit Radius r, Durchmesser d, Umfang U und Flächeninhalt A gilt: U = 2πr = πd A = πr²", "diagram": "<svg viewBox=\"0 0 240 232\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"120\" cy=\"115\" r=\"92\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"2.8\"/><line x1=\"28\" y1=\"115\" x2=\"212\" y2=\"115\" stroke=\"#4338ca\" stroke-width=\"2.2\"/><line x1=\"120\" y1=\"115\" x2=\"212\" y2=\"115\" stroke=\"#0d9488\" stroke-width=\"4\"/><text x=\"166\" y=\"103\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">r</text><text x=\"74\" y=\"137\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\">d = 2r</text><circle cx=\"120\" cy=\"115\" r=\"4.5\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"115\" y=\"132\" font-size=\"13\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">M</text></svg>"}, {"id": "r124", "title": "Kreisausschnitt: Fläche und Umfang", "page": 61, "category": "Kreis, Prisma & Pythagoras", "body": "Ein voller Kreis hat 360°. Ein Kreisausschnitt mit dem Winkel α ist der Anteil {α/360°} des Kreises.\n$ A_(KA) = {α/360°} · π · r²\n$ U_(KA) = {α/360°} · 2 · π · r + 2r ‖ Bogen plus zwei Radien", "plain": "Ein voller Kreis hat 360°. Ein Kreisausschnitt mit dem Winkel α ist der Anteil α/360° des Kreises.\nAKA = α/360° · π · r²\nUKA = α/360° · 2 · π · r + 2r – Bogen plus zwei Radien", "excerpt": "Ein voller Kreis hat 360°. Ein Kreisausschnitt mit dem Winkel α ist der Anteil α/360° des Kreises. AKA = α/360° · π · r² UKA = α/360° · 2 · π · r + 2r – Bogen plus zwei Radien", "diagram": "<svg viewBox=\"0 0 240 232\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"120\" cy=\"115\" r=\"92\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"2.8\"/><path d=\"M 120 115 L 212 115 A 92 92 0 0 0 104 24.4 Z\" fill=\"#e0e7ff\" stroke=\"#4338ca\" stroke-width=\"2.2\"/><path d=\"M 150 115 A 30 30 0 0 0 114.8 85.5\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.4\"/><text x=\"149.6\" y=\"84.8\" font-size=\"16\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">α</text><text x=\"166\" y=\"132\" font-size=\"13\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">r</text><circle cx=\"120\" cy=\"115\" r=\"4.5\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"108\" y=\"131\" font-size=\"13\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">M</text></svg>"}, {"id": "r125", "title": "Das Prisma", "page": 61, "category": "Kreis, Prisma & Pythagoras", "body": "Ein **Prisma** entsteht, wenn man eine beliebige Grundfläche „stapelt“.\n$ V_(P) = A_(G) · h ‖ allgemein\n$ V_(Dreiecksprisma) = {1/2} · g · h_(d) · h_(p)\n$ V_(Zylinder) = π · r² · h", "plain": "Ein Prisma entsteht, wenn man eine beliebige Grundfläche „stapelt“.\nVP = AG · h – allgemein\nVDreiecksprisma = 1/2 · g · hd · hp\nVZylinder = π · r² · h", "excerpt": "Ein Prisma entsteht, wenn man eine beliebige Grundfläche „stapelt“. VP = AG · h – allgemein VDreiecksprisma = 1/2 · g · hd · hp", "diagram": "<svg viewBox=\"0 0 330 200\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"64,132 144,132 104,64\" fill=\"#fff\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><line x1=\"24\" y1=\"160\" x2=\"64\" y2=\"132\" stroke=\"#8b97a8\" stroke-width=\"1.4\" stroke-dasharray=\"3,3\"/><line x1=\"104\" y1=\"160\" x2=\"144\" y2=\"132\" stroke=\"#8b97a8\" stroke-width=\"1.4\" stroke-dasharray=\"3,3\"/><line x1=\"64\" y1=\"92\" x2=\"104\" y2=\"64\" stroke=\"#8b97a8\" stroke-width=\"1.4\" stroke-dasharray=\"3,3\"/><polygon points=\"24,160 104,160 64,92\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><text x=\"64\" y=\"146\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\" stroke=\"none\">A<tspan font-size=\"9\" dy=\"3\">G</tspan></text><line x1=\"104\" y1=\"160\" x2=\"144\" y2=\"132\" stroke=\"#0d9488\" stroke-width=\"4\"/><text x=\"152\" y=\"154\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"start\" font-weight=\"800\">h</text><text x=\"80\" y=\"186\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">Prisma</text><path d=\"M 202 80 L 202 160 A 48 15 0 0 0 298 160 L 298 80\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><ellipse cx=\"250\" cy=\"80\" rx=\"48\" ry=\"15\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><line x1=\"250\" y1=\"80\" x2=\"298\" y2=\"80\" stroke=\"#0d9488\" stroke-width=\"3\"/><text x=\"274\" y=\"72\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">r</text><circle cx=\"250\" cy=\"80\" r=\"3\" fill=\"#1f2937\" stroke=\"none\"/><line x1=\"312\" y1=\"80\" x2=\"312\" y2=\"160\" stroke=\"#4338ca\" stroke-width=\"2.4\"/><text x=\"320\" y=\"124\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"800\">h</text><text x=\"250\" y=\"186\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">Zylinder</text></svg>"}, {"id": "r126", "title": "Volumen eines Trapezprismas", "page": 62, "category": "Kreis, Prisma & Pythagoras", "body": "$ V_(T) = {a + c/2} · h_(T) · h_(p)", "plain": "VT = a + c/2 · hT · hp", "excerpt": "VT = a + c/2 · hT · hp", "diagram": null}, {"id": "r127", "title": "Oberfläche und Mantelfläche", "page": 62, "category": "Kreis, Prisma & Pythagoras", "body": "- **Oberfläche:** alle Begrenzungsflächen, die den Körper vollständig umschließen. Ihre Flächeninhalte addiert ergeben den **Oberflächeninhalt**.\n- **Mantelfläche:** alle Flächen der Oberfläche außer Grund- und Deckfläche.", "plain": "Oberfläche: alle Begrenzungsflächen, die den Körper vollständig umschließen. Ihre Flächeninhalte addiert ergeben den Oberflächeninhalt.\nMantelfläche: alle Flächen der Oberfläche außer Grund- und Deckfläche.", "excerpt": "Oberfläche: alle Begrenzungsflächen, die den Körper vollständig umschließen. Ihre Flächeninhalte addiert ergeben den Oberflächeninhalt. Mantelfläche: alle Flächen der Oberfläche außer Grund- und Deckfläche.", "diagram": null}, {"id": "r128", "title": "Volumen eines Prismas", "page": 62, "category": "Kreis, Prisma & Pythagoras", "body": "$ V_(P) = A_(G) · h\n- V_(P): Volumen des Prismas\n- A_(G): Flächeninhalt der Grundfigur\n- h: Höhe des Prismas\nTypische Probleme: die richtigen Höhen erkennen (Höhe der Grundfläche ≠ Höhe des Prismas) und die passende Flächenformel für die Grundfläche wählen.", "plain": "VP = AG · h\nVP: Volumen des Prismas\nAG: Flächeninhalt der Grundfigur\nh: Höhe des Prismas\nTypische Probleme: die richtigen Höhen erkennen (Höhe der Grundfläche ≠ Höhe des Prismas) und die passende Flächenformel für die Grundfläche wählen.", "excerpt": "VP = AG · h VP: Volumen des Prismas AG: Flächeninhalt der Grundfigur", "diagram": null}, {"id": "r129", "title": "Satz des Pythagoras", "page": 63, "category": "Kreis, Prisma & Pythagoras", "body": "Im rechtwinkligen Dreieck ist die Summe der Quadrate über den Katheten gleich dem Quadrat über der Hypotenuse.\n$ a² + b² = c²\n$ c = √(a² + b²)\n$ a = √(c² - b²)\n$ b = √(c² - a²)", "plain": "Im rechtwinkligen Dreieck ist die Summe der Quadrate über den Katheten gleich dem Quadrat über der Hypotenuse.\na² + b² = c²\nc = √(a² + b²)\na = √(c² - b²)\nb = √(c² - a²)", "excerpt": "Im rechtwinkligen Dreieck ist die Summe der Quadrate über den Katheten gleich dem Quadrat über der Hypotenuse. a² + b² = c² c = √(a² + b²)", "diagram": "<svg viewBox=\"40 -8 300 242\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"150,150 210,150 210,210 150,210\" fill=\"#d5f0ec\" stroke=\"#0d9488\" stroke-width=\"1.8\"/><polygon points=\"150,70 150,150 70,150 70,70\" fill=\"#d5f0ec\" stroke=\"#0d9488\" stroke-width=\"1.8\"/><polygon points=\"150,70 210,150 290,90 230,10\" fill=\"#e0e7ff\" stroke=\"#4338ca\" stroke-width=\"1.8\"/><polygon points=\"150,70 210,150 150,150\" fill=\"#fff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><polyline points=\"162,150 162,138 150,138\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><text x=\"180\" y=\"187\" font-size=\"20\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">a²</text><text x=\"110\" y=\"117\" font-size=\"20\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">b²</text><text x=\"220\" y=\"87\" font-size=\"20\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">c²</text><text x=\"180\" y=\"226\" font-size=\"15\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">a² + b² = c²</text></svg>"}, {"id": "r130", "title": "Der Höhensatz", "page": 63, "category": "Kreis, Prisma & Pythagoras", "body": "Teilt die Höhe h die Hypotenuse in die Abschnitte p und q, gilt: Das Quadrat über der Höhe ist so groß wie das Rechteck aus den Hypotenusenabschnitten.\n$ h² = p · q", "plain": "Teilt die Höhe h die Hypotenuse in die Abschnitte p und q, gilt: Das Quadrat über der Höhe ist so groß wie das Rechteck aus den Hypotenusenabschnitten.\nh² = p · q", "excerpt": "Teilt die Höhe h die Hypotenuse in die Abschnitte p und q, gilt: Das Quadrat über der Höhe ist so groß wie das Rechteck aus den Hypotenusenabschnitten. h² = p · q", "diagram": "<svg viewBox=\"0 0 330 246\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"40,190 280,190 116.8,78\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><line x1=\"116.8\" y1=\"78\" x2=\"116.8\" y2=\"190\" stroke=\"#4338ca\" stroke-width=\"2.6\" stroke-dasharray=\"5,3\"/><polyline points=\"109.4,88.8 120.2,96.1 127.5,85.4\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.6\"/><polyline points=\"106.8,190 106.8,180 116.8,180\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><text x=\"28\" y=\"196\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"293\" y=\"196\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"116.8\" y=\"68\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"64.4\" y=\"134\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"end\" font-weight=\"700\">a</text><text x=\"212.4\" y=\"134\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"700\">b</text><text x=\"78.4\" y=\"210\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">p</text><text x=\"198.4\" y=\"210\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">q</text><text x=\"160\" y=\"230\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">c = p + q</text><text x=\"126.8\" y=\"138\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"800\">h</text></svg>"}, {"id": "r131", "title": "Der Kathetensatz", "page": 64, "category": "Kreis, Prisma & Pythagoras", "body": "Das Quadrat über einer Kathete ist so groß wie das Rechteck aus der Hypotenuse und dem anliegenden Hypotenusenabschnitt.\n$ a² = p · c\n$ b² = q · c", "plain": "Das Quadrat über einer Kathete ist so groß wie das Rechteck aus der Hypotenuse und dem anliegenden Hypotenusenabschnitt.\na² = p · c\nb² = q · c", "excerpt": "Das Quadrat über einer Kathete ist so groß wie das Rechteck aus der Hypotenuse und dem anliegenden Hypotenusenabschnitt. a² = p · c b² = q · c", "diagram": "<svg viewBox=\"0 0 330 246\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"40,190 280,190 116.8,78\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><line x1=\"116.8\" y1=\"78\" x2=\"116.8\" y2=\"190\" stroke=\"#8b97a8\" stroke-width=\"2.6\" stroke-dasharray=\"5,3\"/><line x1=\"40\" y1=\"190\" x2=\"116.8\" y2=\"190\" stroke=\"#0d9488\" stroke-width=\"5\"/><line x1=\"40\" y1=\"190\" x2=\"116.8\" y2=\"78\" stroke=\"#4338ca\" stroke-width=\"3.6\"/><polyline points=\"109.4,88.8 120.2,96.1 127.5,85.4\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.6\"/><polyline points=\"106.8,190 106.8,180 116.8,180\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><text x=\"28\" y=\"196\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"293\" y=\"196\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"116.8\" y=\"68\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"64.4\" y=\"134\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"end\" font-weight=\"700\">a</text><text x=\"212.4\" y=\"134\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"700\">b</text><text x=\"78.4\" y=\"210\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">p</text><text x=\"198.4\" y=\"210\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">q</text><text x=\"160\" y=\"230\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">c = p + q</text><text x=\"126.8\" y=\"138\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"800\">h</text></svg>"}, {"id": "r132", "title": "Herleitung des Kathetensatzes", "page": 64, "category": "Kreis, Prisma & Pythagoras", "body": "$ a² + b² = c²\n$ a² + b² = (p + q)²\n$ a² + b² = p² + 2pq + q²\n$ a² + q² + h² = p² + 2pq + q² ‖ b² = q² + h²\n$ a² + h² = p² + 2pq ‖ − q²\n$ a² + pq = p² + 2pq ‖ h² = pq\n$ a² = p² + pq ‖ − pq\n$ a² = p·(p + q) ‖ ausklammern\n$ a² = p · c ‖ p + q = c", "plain": "a² + b² = c²\na² + b² = (p + q)²\na² + b² = p² + 2pq + q²\na² + q² + h² = p² + 2pq + q² – b² = q² + h²\na² + h² = p² + 2pq – − q²\na² + pq = p² + 2pq – h² = pq\na² = p² + pq – − pq\na² = p·(p + q) – ausklammern\na² = p · c – p + q = c", "excerpt": "a² + b² = c² a² + b² = (p + q)² a² + b² = p² + 2pq + q²", "diagram": "<svg viewBox=\"0 0 330 246\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"40,190 280,190 116.8,78\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><line x1=\"116.8\" y1=\"78\" x2=\"116.8\" y2=\"190\" stroke=\"#8b97a8\" stroke-width=\"2.6\" stroke-dasharray=\"5,3\"/><line x1=\"40\" y1=\"190\" x2=\"116.8\" y2=\"190\" stroke=\"#0d9488\" stroke-width=\"5\"/><line x1=\"40\" y1=\"190\" x2=\"116.8\" y2=\"78\" stroke=\"#4338ca\" stroke-width=\"3.6\"/><polyline points=\"109.4,88.8 120.2,96.1 127.5,85.4\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.6\"/><polyline points=\"106.8,190 106.8,180 116.8,180\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><text x=\"28\" y=\"196\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"293\" y=\"196\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"116.8\" y=\"68\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"64.4\" y=\"134\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"end\" font-weight=\"700\">a</text><text x=\"212.4\" y=\"134\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"700\">b</text><text x=\"78.4\" y=\"210\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">p</text><text x=\"198.4\" y=\"210\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">q</text><text x=\"160\" y=\"230\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">c = p + q</text><text x=\"126.8\" y=\"138\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"800\">h</text></svg>"}, {"id": "r133", "title": "Potenzgesetze (1)", "page": 65, "category": "Potenzgesetze", "body": "$ 2³ = 2·2·2 = 8 ‖ 2 ist die Basis, 3 der Exponent\n## 1. Regel (a reell, n natürlich)\n$ a^(n) = a·a·…·a ‖ n Faktoren\n## 2. Regel (a ≠ 0, n natürlich)\n$ a^(-n) = {1/a^(n)}\n## 3. Regel (a ≠ 0, n, m ganz)\n$ a^(n) · a^(m) = a^(n+m)\n## 4. Regel (a ≠ 0, n, m ganz)\n$ {a^(n)/a^(m)} = a^(n-m)", "plain": "2³ = 2·2·2 = 8 – 2 ist die Basis, 3 der Exponent\n1. Regel (a reell, n natürlich)\nan = a·a·…·a – n Faktoren\n2. Regel (a ≠ 0, n natürlich)\na-n = 1/an\n3. Regel (a ≠ 0, n, m ganz)\nan · am = an+m\n4. Regel (a ≠ 0, n, m ganz)\nan/am = an-m", "excerpt": "2³ = 2·2·2 = 8 – 2 ist die Basis, 3 der Exponent 1. Regel (a reell, n natürlich) an = a·a·…·a – n Faktoren", "diagram": null}, {"id": "r134", "title": "Potenzgesetze (2)", "page": 66, "category": "Potenzgesetze", "body": "## 5. Regel\n$ (a^(m))^(n) = a^(m·n)\n## 6. Regel\n$ a^({m/n}) = √[n](a^(m))\n! Wichtig: a⁰ = 1 (z. B. 5⁰ = 1).\n## 7. Regel\n$ √[n](a) · √[n](b) = √[n](a·b)\n## 8. Regel\n$ {√[n](a)/√[n](b)} = √[n]({a/b})\n## 9. Regel\n$ √[n](√[m](a)) = √[m](√[n](a)) = √[n·m](a)", "plain": "5. Regel\n(am)n = am·n\n6. Regel\nam/n = √[n](am)\nWichtig: a⁰ = 1 (z. B. 5⁰ = 1).\n7. Regel\n√a · √b = √a·b\n8. Regel\n√a/√b = √a/b\n9. Regel\n√[n](√a) = √[m](√a) = √[n·m](a)", "excerpt": "5. Regel (am)n = am·n 6. Regel", "diagram": null}, {"id": "r135", "title": "Absolute und relative Häufigkeiten (Beispiel)", "page": 67, "category": "Stochastik & Wahrscheinlichkeit", "body": "## Strichliste: Jungen und Mädchen in einer Klasse\nT: ‎§absolute Häufigkeit§relative Häufigkeit§in Prozent ;; Jungen§15§{15/28}§≈ 53,6 % ;; Mädchen§13§{13/28}§≈ 46,4 % ;; Summe§28§{28/28} = 1§100 %", "plain": "Strichliste: Jungen und Mädchen in einer Klasse\n‎, absolute Häufigkeit, relative Häufigkeit, in Prozent; Jungen, 15, 15/28, ≈ 53,6 %; Mädchen, 13, 13/28, ≈ 46,4 %; Summe, 28, 28/28 = 1, 100 %", "excerpt": "Strichliste: Jungen und Mädchen in einer Klasse ‎, absolute Häufigkeit, relative Häufigkeit, in Prozent; Jungen, 15, 15/28, ≈ 53,6 %; Mädchen, 13, 13/28, ≈ 46,4 %; Summe, 28, 28/28 = 1, 100 %", "diagram": null}, {"id": "r136", "title": "Zufallsexperiment", "page": 68, "category": "Stochastik & Wahrscheinlichkeit", "body": "Ein **Zufallsexperiment** ist ein Vorgang, der\n- unter gleichen Bedingungen beliebig oft wiederholbar ist,\n- dessen Ausgang nicht vorhersehbar ist und\n- bei dem alle möglichen Ausgänge bekannt sind.\nT: Zufallsexperiment§kein Zufallsexperiment ;; Würfeln§Wasser kochen (vorhersagbar) ;; Münze werfen§Fußballspiel (nicht wiederholbar) ;; Karten ziehen§Klausurnote (beeinflussbar) ;; Lose ziehen§", "plain": "Ein Zufallsexperiment ist ein Vorgang, der\nunter gleichen Bedingungen beliebig oft wiederholbar ist,\ndessen Ausgang nicht vorhersehbar ist und\nbei dem alle möglichen Ausgänge bekannt sind.\nZufallsexperiment, kein Zufallsexperiment; Würfeln, Wasser kochen (vorhersagbar); Münze werfen, Fußballspiel (nicht wiederholbar); Karten ziehen, Klausurnote (beeinflussbar); Lose ziehen, ", "excerpt": "Ein Zufallsexperiment ist ein Vorgang, der unter gleichen Bedingungen beliebig oft wiederholbar ist, dessen Ausgang nicht vorhersehbar ist und", "diagram": null}, {"id": "r137", "title": "Ergebnisraum", "page": 68, "category": "Stochastik & Wahrscheinlichkeit", "body": "Die Menge aller möglichen Ergebnisse eines Zufallsexperiments heißt **Ergebnisraum** Ω (Omega).\n$ Würfeln: Ω = {1, 2, 3, 4, 5, 6}\n$ Münze: Ω = {Kopf, Zahl}\n$ Ampel: Ω = {rot, gelb, grün}", "plain": "Die Menge aller möglichen Ergebnisse eines Zufallsexperiments heißt Ergebnisraum Ω (Omega).\nWürfeln: Ω = {1, 2, 3, 4, 5, 6}\nMünze: Ω = {Kopf, Zahl}\nAmpel: Ω = {rot, gelb, grün}", "excerpt": "Die Menge aller möglichen Ergebnisse eines Zufallsexperiments heißt Ergebnisraum Ω (Omega). Würfeln: Ω = {1, 2, 3, 4, 5, 6} Münze: Ω = {Kopf, Zahl}", "diagram": null}, {"id": "r138", "title": "Ereignis", "page": 68, "category": "Stochastik & Wahrscheinlichkeit", "body": "Ein **Ereignis** E ist eine Teilmenge des Ergebnisraums Ω. Es tritt ein, wenn das Ergebnis des Experiments in E liegt.\n## Beispiele beim Würfeln\n$ E_1 = {6} ‖ „eine Sechs würfeln“\n$ E_2 = {2, 4, 6} ‖ „eine gerade Zahl würfeln“\n$ E_3 = {1, 2} ‖ „höchstens eine 2 würfeln“", "plain": "Ein Ereignis E ist eine Teilmenge des Ergebnisraums Ω. Es tritt ein, wenn das Ergebnis des Experiments in E liegt.\nBeispiele beim Würfeln\nE1 = {6} – „eine Sechs würfeln“\nE2 = {2, 4, 6} – „eine gerade Zahl würfeln“\nE3 = {1, 2} – „höchstens eine 2 würfeln“", "excerpt": "Ein Ereignis E ist eine Teilmenge des Ergebnisraums Ω. Es tritt ein, wenn das Ergebnis des Experiments in E liegt. Beispiele beim Würfeln E1 = {6} – „eine Sechs würfeln“", "diagram": null}, {"id": "r139", "title": "Laplace-Experiment", "page": 69, "category": "Stochastik & Wahrscheinlichkeit", "body": "Ein Zufallsexperiment heißt **Laplace-Experiment**, wenn alle Ergebnisse gleich wahrscheinlich sind.\nT: Laplace-Experiment§kein Laplace-Experiment ;; fairer Würfel§gezinkter Würfel ;; faire Münze§Lose ziehen ;; Kugel aus einer Urne ziehen§Glücksrad mit unterschiedlich großen Feldern", "plain": "Ein Zufallsexperiment heißt Laplace-Experiment, wenn alle Ergebnisse gleich wahrscheinlich sind.\nLaplace-Experiment, kein Laplace-Experiment; fairer Würfel, gezinkter Würfel; faire Münze, Lose ziehen; Kugel aus einer Urne ziehen, Glücksrad mit unterschiedlich großen Feldern", "excerpt": "Ein Zufallsexperiment heißt Laplace-Experiment, wenn alle Ergebnisse gleich wahrscheinlich sind. Laplace-Experiment, kein Laplace-Experiment; fairer Würfel, gezinkter Würfel; faire Münze, Lose ziehen; Kugel aus einer Urne ziehen, Glücksrad mit unterschiedlich großen Feldern", "diagram": null}, {"id": "r140", "title": "Wahrscheinlichkeit beim Laplace-Experiment", "page": 69, "category": "Stochastik & Wahrscheinlichkeit", "body": "$ P(E) = {|E|/|Ω|} = {Anzahl der günstigen Ergebnisse/Anzahl aller möglichen Ergebnisse}\nDie senkrechten Striche |E| stehen für die Anzahl der Elemente der Menge.\n## Beispiel: Würfeln, Ω = {1, 2, 3, 4, 5, 6}, |Ω| = 6\n$ P(„eine Sechs“) = {|{6}|/|Ω|} = {1/6}\n$ P(„eine gerade Zahl“) = {|{2, 4, 6}|/|Ω|} = {3/6} = {1/2}\n$ P(„eine Zahl kleiner als 7“) = {|Ω|/|Ω|} = 1 ‖ sicheres Ereignis\n$ P(„eine 7“) = {0/6} = 0 ‖ unmögliches Ereignis", "plain": "P(E) = |E|/|Ω| = Anzahl der günstigen Ergebnisse/Anzahl aller möglichen Ergebnisse\nDie senkrechten Striche |E| stehen für die Anzahl der Elemente der Menge.\nBeispiel: Würfeln, Ω = {1, 2, 3, 4, 5, 6}, |Ω| = 6\nP(„eine Sechs“) = {|{6}|/|Ω|} = 1/6\nP(„eine gerade Zahl“) = {|{2, 4, 6}|/|Ω|} = 3/6 = 1/2\nP(„eine Zahl kleiner als 7“) = |Ω|/|Ω| = 1 – sicheres Ereignis\nP(„eine 7“) = 0/6 = 0 – unmögliches Ereignis", "excerpt": "P(E) = |E|/|Ω| = Anzahl der günstigen Ergebnisse/Anzahl aller möglichen Ergebnisse Die senkrechten Striche |E| stehen für die Anzahl der Elemente der Menge. Beispiel: Würfeln, Ω = {1, 2, 3, 4, 5, 6}, |Ω| = 6", "diagram": null}, {"id": "r141", "title": "Mehrstufige Zufallsexperimente", "page": 70, "category": "Stochastik & Wahrscheinlichkeit", "body": "## Beispiel: zweimaliges Werfen einer Münze\n$ Ω_1 = {Kopf, Zahl} ‖ 1. Wurf\n$ Ω_2 = {Kopf, Zahl} ‖ 2. Wurf\n$ Ω = Ω_1 × Ω_2 = {Kopf, Zahl}²\nErgebnisse schreibt man als **Tupel** in runden Klammern: (Ergebnis 1. Wurf, Ergebnis 2. Wurf).\n$ Ω = {(Kopf, Kopf), (Kopf, Zahl), (Zahl, Kopf), (Zahl, Zahl)}\n## Beispiel: erst Münzwurf, dann Würfelwurf\n$ Ω = {Kopf, Zahl} × {1, 2, 3, 4, 5, 6} ‖ kartesisches Produkt\n$ |Ω| = |Ω_1| · |Ω_2| = 2 · 6 = 12", "plain": "Beispiel: zweimaliges Werfen einer Münze\nΩ1 = {Kopf, Zahl} – 1. Wurf\nΩ2 = {Kopf, Zahl} – 2. Wurf\nΩ = Ω1 × Ω2 = {Kopf, Zahl}²\nErgebnisse schreibt man als Tupel in runden Klammern: (Ergebnis 1. Wurf, Ergebnis 2. Wurf).\nΩ = {(Kopf, Kopf), (Kopf, Zahl), (Zahl, Kopf), (Zahl, Zahl)}\nBeispiel: erst Münzwurf, dann Würfelwurf\nΩ = {Kopf, Zahl} × {1, 2, 3, 4, 5, 6} – kartesisches Produkt\n|Ω| = |Ω1| · |Ω2| = 2 · 6 = 12", "excerpt": "Beispiel: zweimaliges Werfen einer Münze Ω1 = {Kopf, Zahl} – 1. Wurf Ω2 = {Kopf, Zahl} – 2. Wurf", "diagram": null}, {"id": "r142", "title": "Zweimaliger Münzwurf: Wahrscheinlichkeiten", "page": 71, "category": "Stochastik & Wahrscheinlichkeit", "body": "$ Ω = {Kopf, Zahl}²\n$ E_1 = {(Kopf, Kopf)} ⇒ P(E_1) = {1/2}·{1/2} = {1/4}\n$ E_2 = „genau einmal Kopf“ = {(Kopf, Zahl), (Zahl, Kopf)}\n$ P(E_2) = {1/2}·{1/2} + {1/2}·{1/2} = {2/4} = {1/2}", "plain": "Ω = {Kopf, Zahl}²\nE1 = {(Kopf, Kopf)} ⇒ P(E1) = 1/2·1/2 = 1/4\nE2 = „genau einmal Kopf“ = {(Kopf, Zahl), (Zahl, Kopf)}\nP(E2) = 1/2·1/2 + 1/2·1/2 = 2/4 = 1/2", "excerpt": "Ω = {Kopf, Zahl}² E1 = {(Kopf, Kopf)} ⇒ P(E1) = 1/2·1/2 = 1/4 E2 = „genau einmal Kopf“ = {(Kopf, Zahl), (Zahl, Kopf)}", "diagram": null}, {"id": "r143", "title": "Baumdiagramm und Pfadregeln", "page": 72, "category": "Stochastik & Wahrscheinlichkeit", "body": "Ein **Baumdiagramm** stellt mehrstufige Zufallsexperimente grafisch dar.\n- Jede Stufe wird durch eine Verzweigung dargestellt.\n- An den Ästen stehen die Wahrscheinlichkeiten.\n- Die Pfade führen zu den Ergebnissen.\n## Pfadregeln\n1) **Produktregel:** Die Wahrscheinlichkeit eines Pfades ist das Produkt der Wahrscheinlichkeiten entlang des Pfades.\n2) **Summenregel:** Die Wahrscheinlichkeit eines Ereignisses ist die Summe der Wahrscheinlichkeiten aller Pfade, die zu diesem Ereignis führen.", "plain": "Ein Baumdiagramm stellt mehrstufige Zufallsexperimente grafisch dar.\nJede Stufe wird durch eine Verzweigung dargestellt.\nAn den Ästen stehen die Wahrscheinlichkeiten.\nDie Pfade führen zu den Ergebnissen.\nPfadregeln\n1) Produktregel: Die Wahrscheinlichkeit eines Pfades ist das Produkt der Wahrscheinlichkeiten entlang des Pfades.\n2) Summenregel: Die Wahrscheinlichkeit eines Ereignisses ist die Summe der Wahrscheinlichkeiten aller Pfade, die zu diesem Ereignis führen.", "excerpt": "Ein Baumdiagramm stellt mehrstufige Zufallsexperimente grafisch dar. Jede Stufe wird durch eine Verzweigung dargestellt. An den Ästen stehen die Wahrscheinlichkeiten.", "diagram": "<svg viewBox=\"0 0 330 196\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"22\" cy=\"107\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><line x1=\"22\" y1=\"107\" x2=\"150\" y2=\"62\" stroke=\"#1f2937\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"62\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"74\" y=\"77.5\" font-size=\"12\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">1/2</text><text x=\"158\" y=\"52\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"800\">Kopf</text><line x1=\"150\" y1=\"62\" x2=\"262\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"45\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">1/2</text><text x=\"270\" y=\"44\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">Kopf</text><line x1=\"150\" y1=\"62\" x2=\"262\" y2=\"84\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"88\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">1/2</text><text x=\"270\" y=\"88\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">Zahl</text><line x1=\"22\" y1=\"107\" x2=\"150\" y2=\"152\" stroke=\"#1f2937\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"152\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"74\" y=\"144.5\" font-size=\"12\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">1/2</text><text x=\"158\" y=\"142\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"800\">Zahl</text><line x1=\"150\" y1=\"152\" x2=\"262\" y2=\"130\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"135\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">1/2</text><text x=\"270\" y=\"134\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">Kopf</text><line x1=\"150\" y1=\"152\" x2=\"262\" y2=\"174\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"178\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">1/2</text><text x=\"270\" y=\"178\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">Zahl</text></svg>"}, {"id": "r144", "title": "Gegenereignis", "page": 73, "category": "Stochastik & Wahrscheinlichkeit", "body": "Sei E ein Ereignis und Ē sein Gegenereignis (|E| + |Ē| = |Ω|). Dann gilt:\n$ P(E) = 1 - P(Ē)", "plain": "Sei E ein Ereignis und Ē sein Gegenereignis (|E| + |Ē| = |Ω|). Dann gilt:\nP(E) = 1 - P(Ē)", "excerpt": "Sei E ein Ereignis und Ē sein Gegenereignis (|E| + |Ē| = |Ω|). Dann gilt: P(E) = 1 - P(Ē)", "diagram": null}, {"id": "r145", "title": "Ereignisse als Mengen", "page": 73, "category": "Stochastik & Wahrscheinlichkeit", "body": "Ereignisse kann man mit Mengenoperationen verknüpfen:\n- **Schnittmenge** A ∩ B: „A und B treten ein“ – alle Ergebnisse, die in A **und** B liegen.\n- **Vereinigungsmenge** A ∪ B: „A oder B tritt ein“ – alle Ergebnisse, die in A oder B (oder beiden) liegen.\n## Beispiel beim Würfeln\n$ A = „gerade Zahl“ = {2, 4, 6}\n$ B = „größer als 3“ = {4, 5, 6}\n$ A ∩ B = {4, 6} ⇒ P(A ∩ B) = {2/6} = {1/3}\n$ A ∪ B = {2, 4, 5, 6} ⇒ P(A ∪ B) = {4/6} = {2/3}", "plain": "Ereignisse kann man mit Mengenoperationen verknüpfen:\nSchnittmenge A ∩ B: „A und B treten ein“ – alle Ergebnisse, die in A und B liegen.\nVereinigungsmenge A ∪ B: „A oder B tritt ein“ – alle Ergebnisse, die in A oder B (oder beiden) liegen.\nBeispiel beim Würfeln\nA = „gerade Zahl“ = {2, 4, 6}\nB = „größer als 3“ = {4, 5, 6}\nA ∩ B = {4, 6} ⇒ P(A ∩ B) = 2/6 = 1/3\nA ∪ B = {2, 4, 5, 6} ⇒ P(A ∪ B) = 4/6 = 2/3", "excerpt": "Ereignisse kann man mit Mengenoperationen verknüpfen: Schnittmenge A ∩ B: „A und B treten ein“ – alle Ergebnisse, die in A und B liegen. Vereinigungsmenge A ∪ B: „A oder B tritt ein“ – alle Ergebnisse, die in A oder B (oder beiden) liegen.", "diagram": "<svg viewBox=\"0 0 330 200\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"125\" cy=\"100\" r=\"68\" fill=\"#4338ca\" fill-opacity=\"0.16\" stroke=\"#4338ca\" stroke-width=\"2.2\"/><circle cx=\"205\" cy=\"100\" r=\"68\" fill=\"#0d9488\" fill-opacity=\"0.16\" stroke=\"#0d9488\" stroke-width=\"2.2\"/><text x=\"90\" y=\"105\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">2</text><text x=\"165\" y=\"92\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">4</text><text x=\"165\" y=\"122\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">6</text><text x=\"240\" y=\"105\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">5</text><text x=\"80\" y=\"26\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\">A (gerade)</text><text x=\"250\" y=\"26\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\">B (größer als 3)</text><text x=\"30\" y=\"190\" font-size=\"11.5\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"500\">1, 3 liegen außerhalb</text><text x=\"300\" y=\"190\" font-size=\"11.5\" fill=\"#1f2937\" text-anchor=\"end\" font-weight=\"700\">Mitte: A ∩ B = {4, 6}</text></svg>"}, {"id": "r146", "title": "Ziehen ohne Zurücklegen", "page": 73, "category": "Stochastik & Wahrscheinlichkeit", "body": "## Urne mit 3 roten und 2 blauen Kugeln\n$ 1. Zug: P(rot) = {3/5}\n$ War die erste Kugel rot: P(rot im 2. Zug) = {2/4}\n$ War die erste Kugel blau: P(rot im 2. Zug) = {3/4}\nDie Wahrscheinlichkeit im 2. Zug hängt vom 1. Zug ab.", "plain": "Urne mit 3 roten und 2 blauen Kugeln\n1. Zug: P(rot) = 3/5\nWar die erste Kugel rot: P(rot im 2. Zug) = 2/4\nWar die erste Kugel blau: P(rot im 2. Zug) = 3/4\nDie Wahrscheinlichkeit im 2. Zug hängt vom 1. Zug ab.", "excerpt": "Urne mit 3 roten und 2 blauen Kugeln 1. Zug: P(rot) = 3/5 War die erste Kugel rot: P(rot im 2. Zug) = 2/4", "diagram": null}, {"id": "r147", "title": "Bedingte Wahrscheinlichkeit", "page": 74, "category": "Stochastik & Wahrscheinlichkeit", "body": "Die Wahrscheinlichkeit, dass A eintritt, **unter der Bedingung**, dass B bereits eingetreten ist:\n$ P(A|B) = {P(A ∩ B)/P(B)}\n## Beispiel: Würfeln, eine 6 unter der Bedingung „gerade Zahl“\n$ A = {6}, B = {2, 4, 6}, A ∩ B = {6}\n$ P(A|B) = {P(A ∩ B)/P(B)} = {1/6} : {1/2} = {1/3}", "plain": "Die Wahrscheinlichkeit, dass A eintritt, unter der Bedingung, dass B bereits eingetreten ist:\nP(A|B) = P(A ∩ B)/P(B)\nBeispiel: Würfeln, eine 6 unter der Bedingung „gerade Zahl“\nA = {6}, B = {2, 4, 6}, A ∩ B = {6}\nP(A|B) = P(A ∩ B)/P(B) = 1/6 : 1/2 = 1/3", "excerpt": "Die Wahrscheinlichkeit, dass A eintritt, unter der Bedingung, dass B bereits eingetreten ist: P(A|B) = P(A ∩ B)/P(B) Beispiel: Würfeln, eine 6 unter der Bedingung „gerade Zahl“", "diagram": null}, {"id": "r148", "title": "Vierfeldertafel", "page": 75, "category": "Stochastik & Wahrscheinlichkeit", "body": "Eine **Vierfeldertafel** stellt zwei Ereignisse A und B übersichtlich dar.\nT: ‎§B§B̄§Summe ;; A§P(A ∩ B)§P(A ∩ B̄)§P(A) ;; Ā§P(Ā ∩ B)§P(Ā ∩ B̄)§P(Ā) ;; Summe§P(B)§P(B̄)§1\n## Zusammenhang mit dem Baumdiagramm\n$ P(A ∩ B) = P(A) · P(B|A)\n$ P(A ∩ B̄) = P(A) · P(B̄|A)\n$ P(Ā ∩ B) = P(Ā) · P(B|Ā)\n$ P(Ā ∩ B̄) = P(Ā) · P(B̄|Ā)", "plain": "Eine Vierfeldertafel stellt zwei Ereignisse A und B übersichtlich dar.\n‎, B, B̄, Summe; A, P(A ∩ B), P(A ∩ B̄), P(A); Ā, P(Ā ∩ B), P(Ā ∩ B̄), P(Ā); Summe, P(B), P(B̄), 1\nZusammenhang mit dem Baumdiagramm\nP(A ∩ B) = P(A) · P(B|A)\nP(A ∩ B̄) = P(A) · P(B̄|A)\nP(Ā ∩ B) = P(Ā) · P(B|Ā)\nP(Ā ∩ B̄) = P(Ā) · P(B̄|Ā)", "excerpt": "Eine Vierfeldertafel stellt zwei Ereignisse A und B übersichtlich dar. ‎, B, B̄, Summe; A, P(A ∩ B), P(A ∩ B̄), P(A); Ā, P(Ā ∩ B), P(Ā ∩ B̄), P(Ā); Summe, P(B), P(B̄), 1 Zusammenhang mit dem Baumdiagramm", "diagram": "<svg viewBox=\"0 0 330 196\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"22\" cy=\"107\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><line x1=\"22\" y1=\"107\" x2=\"150\" y2=\"62\" stroke=\"#1f2937\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"62\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"74\" y=\"77.5\" font-size=\"12\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">P(A)</text><text x=\"158\" y=\"52\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"800\">A</text><line x1=\"150\" y1=\"62\" x2=\"262\" y2=\"40\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"45\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">P(B|A)</text><text x=\"270\" y=\"44\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">B</text><line x1=\"150\" y1=\"62\" x2=\"262\" y2=\"84\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"88\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">P(B̄|A)</text><text x=\"270\" y=\"88\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">B̄</text><line x1=\"22\" y1=\"107\" x2=\"150\" y2=\"152\" stroke=\"#1f2937\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"152\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"74\" y=\"144.5\" font-size=\"12\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">P(Ā)</text><text x=\"158\" y=\"142\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"800\">Ā</text><line x1=\"150\" y1=\"152\" x2=\"262\" y2=\"130\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"135\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">P(B|Ā)</text><text x=\"270\" y=\"134\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">B</text><line x1=\"150\" y1=\"152\" x2=\"262\" y2=\"174\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><text x=\"202\" y=\"178\" font-size=\"11.5\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">P(B̄|Ā)</text><text x=\"270\" y=\"178\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"start\" font-weight=\"600\">B̄</text></svg>"}, {"id": "r149", "title": "Multiplikationssatz für bedingte Wahrscheinlichkeiten", "page": 75, "category": "Stochastik & Wahrscheinlichkeit", "body": "$ P(A ∩ B) = P(B) · P(A|B) = P(A) · P(B|A)\n## Beispiel\n$ P(3 | ungerade) = {P(„3 und ungerade“)/P(ungerade)} = {1/6} : {1/2} = {1/3}", "plain": "P(A ∩ B) = P(B) · P(A|B) = P(A) · P(B|A)\nBeispiel\nP(3 | ungerade) = P(„3 und ungerade“)/P(ungerade) = 1/6 : 1/2 = 1/3", "excerpt": "P(A ∩ B) = P(B) · P(A|B) = P(A) · P(B|A) Beispiel P(3 | ungerade) = P(„3 und ungerade“)/P(ungerade) = 1/6 : 1/2 = 1/3", "diagram": null}, {"id": "r150", "title": "Quadratische Gleichungen", "page": 76, "category": "Quadratische Gleichungen", "body": "**Lineare** Gleichungen kennt man schon:\n$ 22x + 3 = 17x - 4 ‖ − 3\n$ 22x = 17x - 7 ‖ − 17x\n$ 5x = -7 ‖ : 5\n$ x = -{7/5}\nBei **quadratischen** Gleichungen kommt x² vor.\n$ x² - 4 = 0 ‖ + 4\n$ x² = 4 ‖ ±√\n$ x = ±2\n$ x_(1) = 2, x_(2) = -2\n! Eine quadratische Gleichung hat bis zu zwei Lösungen. Sie müssen nicht in ℝ liegen!\n## Mit quadratischer Ergänzung\n$ x² + 2x + 1 = 0 ‖ binomische Formel\n$ (x + 1)² = 0 ‖ √\n$ x + 1 = 0 ‖ − 1\n$ x = -1", "plain": "Lineare Gleichungen kennt man schon:\n22x + 3 = 17x - 4 – − 3\n22x = 17x - 7 – − 17x\n5x = -7 – : 5\nx = -7/5\nBei quadratischen Gleichungen kommt x² vor.\nx² - 4 = 0 – + 4\nx² = 4 – ±√\nx = ±2\nx1 = 2, x2 = -2\nEine quadratische Gleichung hat bis zu zwei Lösungen. Sie müssen nicht in ℝ liegen!\nMit quadratischer Ergänzung\nx² + 2x + 1 = 0 – binomische Formel\n(x + 1)² = 0 – √\nx + 1 = 0 – − 1\nx = -1", "excerpt": "Lineare Gleichungen kennt man schon: 22x + 3 = 17x - 4 – − 3 22x = 17x - 7 – − 17x", "diagram": null}, {"id": "r151", "title": "Ausklammern und Satz vom Nullprodukt", "page": 76, "category": "Quadratische Gleichungen", "body": "Kommt x in **jedem** Summanden vor, lohnt sich das Ausklammern.\n$ x² + 2x = 0\n$ x·(x + 2) = 0 ‖ ausklammern\n! **Satz vom Nullprodukt:** Ein Produkt ist genau dann null, wenn einer der Faktoren null ist.\n$ x = 0 oder x + 2 = 0\n$ x = 0 oder x = -2\n$ L = {0; -2}", "plain": "Kommt x in jedem Summanden vor, lohnt sich das Ausklammern.\nx² + 2x = 0\nx·(x + 2) = 0 – ausklammern\nSatz vom Nullprodukt: Ein Produkt ist genau dann null, wenn einer der Faktoren null ist.\nx = 0 oder x + 2 = 0\nx = 0 oder x = -2\nL = {0; -2}", "excerpt": "Kommt x in jedem Summanden vor, lohnt sich das Ausklammern. x² + 2x = 0 x·(x + 2) = 0 – ausklammern", "diagram": null}, {"id": "r152", "title": "Normalform und pq-Formel", "page": 77, "category": "Quadratische Gleichungen", "body": "Die allgemeine Form ax² + bx + c bringt man auf **Normalform**, indem man a = 1 setzt (b → p, c → q):\n$ x² + px + q = 0\nBeispiele: x² + 7x - 3; x² - 8x + 5\n## pq-Formel\nDie pq-Formel gilt nur für die Normalform x² + px + q = 0.\n$ x_(1,2) = -{p/2} ± √({p²/4} - q)\n## Beispiel: x² + 6x + 1 = 0, also p = 6 und q = 1\n$ x_(1,2) = -{6/2} ± √({6²/4} - 1)\n$ x_(1,2) = -3 ± √(8)\n$ x_(1) = -3 - √(8) ≈ -5,83\n$ x_(2) = -3 + √(8) ≈ -0,17", "plain": "Die allgemeine Form ax² + bx + c bringt man auf Normalform, indem man a = 1 setzt (b → p, c → q):\nx² + px + q = 0\nBeispiele: x² + 7x - 3; x² - 8x + 5\npq-Formel\nDie pq-Formel gilt nur für die Normalform x² + px + q = 0.\nx1,2 = -p/2 ± √(p²/4 - q)\nBeispiel: x² + 6x + 1 = 0, also p = 6 und q = 1\nx1,2 = -6/2 ± √(6²/4 - 1)\nx1,2 = -3 ± √(8)\nx1 = -3 - √(8) ≈ -5,83\nx2 = -3 + √(8) ≈ -0,17", "excerpt": "Die allgemeine Form ax² + bx + c bringt man auf Normalform, indem man a = 1 setzt (b → p, c → q): x² + px + q = 0 Beispiele: x² + 7x - 3; x² - 8x + 5", "diagram": null}, {"id": "r153", "title": "Quadratische Gleichungen: allgemeines Vorgehen", "page": 78, "category": "Quadratische Gleichungen", "body": "## 1) Der universelle Weg (geht immer, ist aber nicht immer am schnellsten)\nAlles auf eine Seite bringen, sodass auf der anderen Seite 0 steht.\n$ 3x² + 6x - 7 = 5x² + 2x - 1 ‖ − 5x², − 2x, + 1\n$ -2x² + 4x - 6 = 0 ‖ : (-2)\n$ x² - 2x + 3 = 0\n$ x_(1,2) = {2/2} ± √({(-2)²/4} - 3) = 1 ± √(-2)\nDie Wurzel aus -2 gibt es in ℝ nicht ⇒ keine Lösung.\n## 2) Sonderfall: Ausklammern und Nullprodukt\n$ 4x² = -8x ‖ + 8x\n$ 4x² + 8x = 0\n$ 4x·(x + 2) = 0\n$ x = 0 oder x = -2, L = {0; -2}", "plain": "1) Der universelle Weg (geht immer, ist aber nicht immer am schnellsten)\nAlles auf eine Seite bringen, sodass auf der anderen Seite 0 steht.\n3x² + 6x - 7 = 5x² + 2x - 1 – − 5x², − 2x, + 1\n-2x² + 4x - 6 = 0 – : (-2)\nx² - 2x + 3 = 0\nx1,2 = 2/2 ± √((-2)²/4 - 3) = 1 ± √(-2)\nDie Wurzel aus -2 gibt es in ℝ nicht ⇒ keine Lösung.\n2) Sonderfall: Ausklammern und Nullprodukt\n4x² = -8x – + 8x\n4x² + 8x = 0\n4x·(x + 2) = 0\nx = 0 oder x = -2, L = {0; -2}", "excerpt": "1) Der universelle Weg (geht immer, ist aber nicht immer am schnellsten) Alles auf eine Seite bringen, sodass auf der anderen Seite 0 steht. 3x² + 6x - 7 = 5x² + 2x - 1 – − 5x², − 2x, + 1", "diagram": null}, {"id": "r154", "title": "Exponentielles Wachstum", "page": 79, "category": "Exponentielles Wachstum & Logarithmus", "body": "Ändert sich ein Bestand in jeder Zeiteinheit um denselben **Wachstumsfaktor** q, spricht man von **exponentiellem Wachstum**. B(0) ist der Anfangsbestand.\n$ B(t) = B(0) · q^(t)", "plain": "Ändert sich ein Bestand in jeder Zeiteinheit um denselben Wachstumsfaktor q, spricht man von exponentiellem Wachstum. B(0) ist der Anfangsbestand.\nB(t) = B(0) · qt", "excerpt": "Ändert sich ein Bestand in jeder Zeiteinheit um denselben Wachstumsfaktor q, spricht man von exponentiellem Wachstum. B(0) ist der Anfangsbestand. B(t) = B(0) · qt", "diagram": null}, {"id": "r155", "title": "Exponentialfunktionen", "page": 79, "category": "Exponentielles Wachstum & Logarithmus", "body": "$ f(t) = a · q^(t) ‖ a: Ausgangswert, q: Wachstumsfaktor\nVoraussetzungen: a ≠ 0, q > 0, q ≠ 1, t ∈ ℝ. Bei Wachstum gilt q > 1.\nEs gilt a = f(0) und f(1) = a · q.\n$ f(t + 1) = a·q^(t+1) = a·q^(t)·q = f(t)·q\n$ q = {f(t+1)/f(t)}\nMit dieser Formel berechnet man q, wenn zwei aufeinanderfolgende Funktionswerte gegeben sind.\n## Beispiel\nT: t§0§1 ;; f(t)§1§2\n$ q = {f(1)/f(0)} = {2/1} = 2\n## Weitere Formeln\n$ q = √[x]({f(x)/f(0)}) = √[x]({f(x)/a})\n$ f(t) = f(0) · ({f(1)/f(0)})^(t)", "plain": "f(t) = a · qt – a: Ausgangswert, q: Wachstumsfaktor\nVoraussetzungen: a ≠ 0, q > 0, q ≠ 1, t ∈ ℝ. Bei Wachstum gilt q > 1.\nEs gilt a = f(0) und f(1) = a · q.\nf(t + 1) = a·qt+1 = a·qt·q = f(t)·q\nq = f(t+1)/f(t)\nMit dieser Formel berechnet man q, wenn zwei aufeinanderfolgende Funktionswerte gegeben sind.\nBeispiel\nt, 0, 1; f(t), 1, 2\nq = f(1)/f(0) = 2/1 = 2\nWeitere Formeln\nq = √[x](f(x)/f(0)) = √[x](f(x)/a)\nf(t) = f(0) · (f(1)/f(0))t", "excerpt": "f(t) = a · qt – a: Ausgangswert, q: Wachstumsfaktor Voraussetzungen: a ≠ 0, q > 0, q ≠ 1, t ∈ ℝ. Bei Wachstum gilt q > 1. Es gilt a = f(0) und f(1) = a · q.", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"224\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"88\" y1=\"224\" x2=\"88\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"144\" y1=\"224\" x2=\"144\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"200\" y1=\"224\" x2=\"200\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"256\" y1=\"224\" x2=\"256\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"312\" y1=\"224\" x2=\"312\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"224\" x2=\"312\" y2=\"224\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"203.2\" x2=\"312\" y2=\"203.2\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"182.4\" x2=\"312\" y2=\"182.4\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"161.6\" x2=\"312\" y2=\"161.6\" stroke=\"#e3e6ec\" str hmus zur Basis der Potenz.\n10x = 10000 – log10( )\nx = log10(10000) = 4\nL = {4}\nlog( ) ohne Basis bedeutet Basis 10. Bei ln( ) ist die Basis die Eulersche Zahl e (kommt erst in Q1).", "excerpt": "Steht die unbekannte Zahl im Exponenten, braucht man als Äquivalenzumformung den Logarithmus zur Basis der Potenz. 10x = 10000 – log10( ) x = log10(10000) = 4", "diagram": null}, {"id": "r158", "title": "Der Logarithmus als Umkehrung der Exponentialfunktion", "page": 81, "category": "Trigonometrie", "body": "Man sucht die Zahl x, für die „Basis hoch x“ das Argument des Logarithmus ergibt.\n$ 2^(x) = 8 ‖ log_(2)( )\n$ x = log_(2)(8) = 3 ‖ denn 2³ = 8", "plain": "Man sucht die Zahl x, für die „Basis hoch x“ das Argument des Logarithmus ergibt.\n2x = 8 – log2( )\nx = log2(8) = 3 – denn 2³ = 8", "excerpt": "Man sucht die Zahl x, für die „Basis hoch x“ das Argument des Logarithmus ergibt. 2x = 8 – log2( ) x = log2(8) = 3 – denn 2³ = 8", "diagram": null}, {"id": "r159", "title": "Einführung in die Trigonometrie", "page": 81, "category": "Trigonometrie", "body": "Im rechtwinkligen Dreieck gilt für den Winkel α:\n$ sin(α) = {Gegenkathete/Hypotenuse}\n$ cos(α) = {Ankathete/Hypotenuse}\n## Beispiel: Dreieck mit den Seiten 3, 4, 5 (Gegenkathete 3, Hypotenuse 5)\n$ sin(α) = {3/5} ‖ arcsin\n$ α = arcsin({3/5}) ≈ 36,87°\nDie Umkehrfunktion des Sinus ist der **Arkussinus** (arcsin).", "plain": "Im rechtwinkligen Dreieck gilt für den Winkel α:\nsin(α) = Gegenkathete/Hypotenuse\ncos(α) = Ankathete/Hypotenuse\nBeispiel: Dreieck mit den Seiten 3, 4, 5 (Gegenkathete 3, Hypotenuse 5)\nsin(α) = 3/5 – arcsin\nα = arcsin(3/5) ≈ 36,87°\nDie Umkehrfunktion des Sinus ist der Arkussinus (arcsin).", "excerpt": "Im rechtwinkligen Dreieck gilt für den Winkel α: sin(α) = Gegenkathete/Hypotenuse cos(α) = Ankathete/Hypotenuse", "diagram": "<svg viewBox=\"0 0 330 208\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"150,170 280,170 150,50\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><polyline points=\"162,170 162,158 150,158\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><path d=\"M 255 146.9 A 34 34 0 0 0 246 170\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.6\"/><text x=\"233.4\" y=\"156.8\" font-size=\"16\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">α</text><text x=\"215\" y=\"194\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">Ankathete</text><text x=\"134\" y=\"115\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"end\" font-weight=\"700\">Gegenkathete</text><text x=\"228\" y=\"102\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"700\">Hypotenuse</text></svg>"}, {"id": "r160", "title": "Der Tangens", "page": 82, "category": "Trigonometrie", "body": "Im rechtwinkligen Dreieck gilt:\n$ tan(α) = {Gegenkathete/Ankathete}\n$ tan(α) = {3/3} = 1 ‖ arctan\n$ α = arctan(1) = 45°", "plain": "Im rechtwinkligen Dreieck gilt:\ntan(α) = Gegenkathete/Ankathete\ntan(α) = 3/3 = 1 – arctan\nα = arctan(1) = 45°", "excerpt": "Im rechtwinkligen Dreieck gilt: tan(α) = Gegenkathete/Ankathete tan(α) = 3/3 = 1 – arctan", "diagram": null}, {"id": "r161", "title": "Steigungswinkel einer linearen Funktion", "page": 82, "category": "Trigonometrie", "body": "Typische Aufgabe: Gegeben ist eine lineare Funktion f(x), berechne ihren Steigungswinkel.\n$ α = arctan(m) ‖ m: Steigung\n## Beispiel: f(x) = 1,5x - 1\n$ α = arctan(1,5) ≈ 56,3°", "plain": "Typische Aufgabe: Gegeben ist eine lineare Funktion f(x), berechne ihren Steigungswinkel.\nα = arctan(m) – m: Steigung\nBeispiel: f(x) = 1,5x - 1\nα = arctan(1,5) ≈ 56,3°", "excerpt": "Typische Aufgabe: Gegeben ist eine lineare Funktion f(x), berechne ihren Steigungswinkel. α = arctan(m) – m: Steigung Beispiel: f(x) = 1,5x - 1", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"224\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"102.5\" y1=\"224\" x2=\"102.5\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"173\" y1=\"224\" x2=\"173\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"243.5\" y1=\"224\" x2=\"243.5\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"314\" y1=\"224\" x2=\"314\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"224\" x2=\"314\" y2=\"224\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"182.4\" x2=\"314\" y2=\"182.4\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"140.8\" x2=\"314\" y2=\"140.8\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"99.2\" x2=\"314\" y2=\"99.2\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"57.6\" x2=\"314\" y2=\"57.6\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"16\" x2=\"314\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"140.8\" x2=\"318\" y2=\"140.8\" stroke=\"#1f2937\" stroke-width=\"1.8\"/><polygon points=\"323,140.8 316.6,138.1 316.6,143.5\" fill=\"#1f2937\" stroke=\"#1f2937\" stroke-width=\"1\"/><line x1=\"102.5\" y1=\"224\" x2=\"102.5\" y2=\"12\" stroke=\"#1f2937\" stroke-width=\"1.8\"/><polygon points=\"102.5,7 99.8,13.4 105.2,13.4\" fill=\"#1f2937\" stroke=\"#1f2937\" stroke-width=\"1\"/><line x1=\"32\" y1=\"137.8\" x2=\"32\" y2=\"143.8\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"32\" y=\"155.8\" font-size=\"11\" fill=\"#8b97a8\" text-anchor=\"middle\" font \" stroke=\"#4338ca\" stroke-width=\"2.6\"/><circle cx=\"149.5\" cy=\"140.8\" r=\"4.4\" fill=\"#0d9488\" stroke=\"none\"/><path d=\"M 181.5 140.8 A 32 32 0 0 0 167.3 114.2\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2.4\"/><text x=\"195.5\" y=\"124.8\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">α</text><text x=\"95.5\" y=\"32.6\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">f(x) = 1,5x − 1</text><text x=\"225.9\" y=\"201.1\" font-size=\"12\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">α = arctan(1,5) ≈ 56,3°</text></svg>"}, {"id": "r162", "title": "Gradmaß, Bogenmaß und Einheitskreis", "page": 83, "category": "Trigonometrie", "body": "$ α = 360° ≙ 2π ‖ voller Winkel\n$ α_(Bogenmaß) = α_(Gradmaß) · {π/180}\n$ α_(Gradmaß) = α_(Bogenmaß) · {180/π}\n$ cos²(α) + sin²(α) = 1 ‖ trigonometrischer Pythagoras", "plain": "α = 360° ≙ 2π – voller Winkel\nαBogenmaß = αGradmaß · π/180\nαGradmaß = αBogenmaß · 180/π\ncos²(α) + sin²(α) = 1 – trigonometrischer Pythagoras", "excerpt": "α = 360° ≙ 2π – voller Winkel αBogenmaß = αGradmaß · π/180 αGradmaß = αBogenmaß · 180/π", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"52\" y1=\"125\" x2=\"282\" y2=\"125\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><line x1=\"165\" y1=\"236\" x2=\"165\" y2=\"10\" stroke=\"#1f2937\" stroke-width=\"1.6\"/><circle cx=\"165\" cy=\"125\" r=\"95\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.8\"/><line x1=\"165\" y1=\"125\" x2=\"228.6\" y2=\"54.4\" stroke=\"#4338ca\" stroke-width=\"2.8\"/><line x1=\"228.6\" y1=\"54.4\" x2=\"228.6\" y2=\"125\" stroke=\"#0d9488\" stroke-width=\"2.2\" stroke-dasharray=\"4,3\"/><line x1=\"165\" y1=\"125\" x2=\"228.6\" y2=\"125\" stroke=\"#0d9488\" stroke-width=\"3\"/><path d=\"M 191 125 A 26 26 0 0 0 182.4 105.7\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.4\"/><text x=\"203.5\" y=\"113.7\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">α</text><circle cx=\"228.6\" cy=\"54.4\" r=\"5\" fill=\"#4338ca\" stroke=\"none\"/><text x=\"236.6\" y=\"46.4\" font-size=\"12.5\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"700\">P(cos α | sin α)</text><text x=\"196.8\" y=\"142\" font-size=\"12\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">cos α</text><text x=\"235.6\" y=\"93.7\" font-size=\"12\" fill=\"#0d9488\" text-anchor=\"start\" font-weight=\"700\">sin α</text><text x=\"206.5\" y=\"161\" font-size=\"12\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\"></text><text x=\"264\" y=\"141\" font-size=\"11.5\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"500\">1</text><text x=\"173\" y=\"26\" font-size=\"11.5\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"500\">1</text><text x=\"224.5\" y=\"117\" font-size=\"1\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\"></text></svg>"}, {"id": "r163", "title": "Transformation von Funktionen", "page": 83, "category": "Trigonometrie", "body": "## Beispiel: f(x) = 2x + 1\n- **Verschiebung in y-Richtung** um d (z. B. 5 nach oben): f_(T)(x) = f(x) + d\n$ f_(T)(x) = f(x) + 5 = 2x + 1 + 5 = 2x + 6\n- **Verschiebung in x-Richtung** um c: f_(T)(x) = f(x - c)", "plain": "Beispiel: f(x) = 2x + 1\nVerschiebung in y-Richtung um d (z. B. 5 nach oben): fT(x) = f(x) + d\nfT(x) = f(x) + 5 = 2x + 1 + 5 = 2x + 6\nVerschiebung in x-Richtung um c: fT(x) = f(x - c)", "excerpt": "Beispiel: f(x) = 2x + 1 Verschiebung in y-Richtung um d (z. B. 5 nach oben): fT(x) = f(x) + d fT(x) = f(x) + 5 = 2x + 1 + 5 = 2x + 6", "diagram": null}, {"id": "r164", "title": "Transformation: kombiniertes Beispiel", "page": 84, "category": "Trigonometrie", "body": "## f(x) = 3x² + 6x - 2, verschoben um 3 nach rechts und 6 nach unten\n$ f_(T)(x) = f(x - c) + d = f(x - 3) - 6\n$ = 3·(x - 3)² + 6·(x - 3) - 2 - 6\n$ = 3·(x² - 6x + 9) + 6x - 18 - 8\n$ = 3x² - 18x + 27 + 6x - 18 - 8\n$ = 3x² - 12x + 1", "plain": "f(x) = 3x² + 6x - 2, verschoben um 3 nach rechts und 6 nach unten\nfT(x) = f(x - c) + d = f(x - 3) - 6\n= 3·(x - 3)² + 6·(x - 3) - 2 - 6\n= 3·(x² - 6x + 9) + 6x - 18 - 8\n= 3x² - 18x + 27 + 6x - 18 - 8\n= 3x² - 12x + 1", "excerpt": "f(x) = 3x² + 6x - 2, verschoben um 3 nach rechts und 6 nach unten fT(x) = f(x - c) + d = f(x - 3) - 6 = 3·(x - 3)² + 6·(x - 3) - 2 - 6", "diagram": null}, {"id": "r165", "title": "Funktion", "page": 85, "category": "Funktionen & Lineare Funktionen", "body": "Eine **Funktion** ist eine eindeutige Zuordnung, die jedem x-Wert genau einen y-Wert zuordnet.\n## Beispiel: f(x) = -x² + 4\nDie Funktion hat den Namen f. Jeder Punkt P(x|y) mit y = -x² + 4 liegt auf dem Graphen von f.", "plain": "Eine Funktion ist eine eindeutige Zuordnung, die jedem x-Wert genau einen y-Wert zuordnet.\nBeispiel: f(x) = -x² + 4\nDie Funktion hat den Namen f. Jeder Punkt P(x|y) mit y = -x² + 4 liegt auf dem Graphen von f.", "excerpt": "Eine Funktion ist eine eindeutige Zuordnung, die jedem x-Wert genau einen y-Wert zuordnet. Beispiel: f(x) = -x² + 4 Die Funktion hat den Namen f. Jeder Punkt P(x|y) mit y = -x² + 4 liegt auf dem Graphen von f.", "diagram": "<svg viewBox=\"0 0 330 260\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"234\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"67.2\" y1=\"234\" x2=\"67.2\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"102.5\" y1=\"234\" x2=\"10 <script>
const RULES = JSON.parse(document.getElementById('rules-data').textContent);

const categories = [];
RULES.forEach(r => { if(!categories.includes(r.category)) categories.push(r.category); });

let activeCat = "Alle";
let query = "";
let filtered = RULES.slice();
let currentIndex = -1;

const chipsEl = document.getElementById('chips');
function renderChips(){
  let html = `<div class="chip ${activeCat==='Alle'?'active':''}" data-cat="Alle">Alle</div>`;
  categories.forEach(c=>{
    html += `<div class="chip ${activeCat===c?'active':''}" data-cat="${escapeAttr(c)}">${escapeHtml(c)}</div>`;
  });
  chipsEl.innerHTML = html;
  chipsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCat = el.getAttribute('data-cat');
      applyFilter();
    });
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return s.replace(/"/g,'&quot;');
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const qEsc = escapeHtml(q);
  try{
    const re = new RegExp('(' + qEsc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return esc.replace(re, '<mark>$1</mark>');
  }catch(e){ return esc; }
}

function applyFilter(){
  const q = query.trim().toLowerCase();
  filtered = RULES.filter(r=>{
    const catOk = activeCat === "Alle" || r.category === activeCat;
    if(!catOk) return false;
    if(!q) return true;
    return (r.title.toLowerCase().includes(q) || r.plain.toLowerCase().includes(q) || r.category.toLowerCase().includes(q));
  });
  if(q){
    // Rank so title matches always come before body/category-only matches.
    // 0 = title starts with query, 1 = title contains query, 2 = only body/category matches.
    const rank = (r) => {
      const t = r.title.toLowerCase();
      if(t.startsWith(q)) return 0;
      if(t.includes(q)) return 1;
      return 2;
    };
    filtered = filtered
      .map((r, idx) => ({ r, idx, rank: rank(r) }))
      .sort((a, b) => (a.rank - b.rank) || (a.idx - b.idx))
      .map(x => x.r);
  }
  renderChips();
  renderList();
  document.getElementById('resultCount').textContent = filtered.length;
  document.getElementById('activeCatLabel').textContent = activeCat === 'Alle' ? '' : activeCat;
}

function renderList(){
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  if(filtered.length === 0){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  const q = query.trim();
  listEl.innerHTML = filtered.map((r,idx) => `
    <div class="rule-card" data-id="${r.id}" style="animation-delay:${Math.min(idx*18,240)}ms">
      <div class="row-top">
        <span class="cat-pill">${escapeHtml(r.category)}</span>
        ${r.diagram ? '<span class="diag-dot" title="mit Skizze"></span>' : ''}
      </div>
      <h3>${highlight(r.title, q)}</h3>
      <p>${highlight(r.excerpt, q)}</p>
    </div>
  `).join('');
  listEl.querySelectorAll('.rule-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      openDetail(el.getAttribute('data-id'));
    });
  });
}

// ---- Math renderer (explicit syntax): {a/b} Bruch, √(..) √[n](..) Wurzel, ^(..) hoch, _(..) tief, ~(..) Periode ----
const SUP_MAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'−'};
const CLOSERS = {'{':'}','(':')','[':']'};
function matchClose(s, i){
  const open = s[i], close = CLOSERS[open];
  let d = 0;
  for(let k=i;k<s.length;k++){
    if(s[k]===open) d++;
    else if(s[k]===close){ d--; if(d===0) return k; }
  }
  return -1;
}
function topSlash(s){
  let d = 0;
  for(let k=0;k<s.length;k++){
    const c = s[k];
    if(c==='('||c==='{'||c==='[') d++;
    else if(c===')'||c==='}'||c===']') d--;
    else if(c==='/' && d===0) return [s.slice(0,k), s.slice(k+1)];
  }
  return null;
}
function isLetter(ch){ return /[A-Za-zÄÖÜäöüßα-ωΑ-Ω]/.test(ch||''); }
function isMinus(s,i){
  const p = i===0 ? ' ' : s[i-1], n = s[i+1] || ' ';
  if(p===' ' && n===' ') return true;
  const prevOp = i===0 || /[\s(\[{=+·*\/;,:|⇒⇔→<>≤≥≠±^_]/.test(p);
  if(prevOp) return /[0-9A-Za-zα-ωΑ-Ω({√∞.]/.test(n);
  if(/[0-9({√∞]/.test(n)) return true;
  return isLetter(n) && !isLetter(s[i+2]) && !(isLetter(p) && isLetter(s[i-2]));
}
function parseMath(s){
  let out = '', i = 0;
  while(i < s.length){
    const c = s[i];
    if(c==='{'){
      const j = matchClose(s,i);
      if(j<0){ out += '{'; i++; continue; }
      const inner = s.slice(i+1,j), sp = topSlash(inner);
      if(sp) out += '<span class="frac"><span class="num">'+parseMath(sp[0].trim())+'</span><span class="den">'+parseMath(sp[1].trim())+'</span></span>';
      else out += '{'+parseMath(inner)+'}';
      i = j+1; continue;
    }
    if(c==='√'){
      i++; let idx = '';
      if(s[i]==='['){ const j = matchClose(s,i); idx = s.slice(i+1,j); i = j+1; }
      let rad;
      if(s[i]==='('){ const j = matchClose(s,i); rad = s.slice(i+1,j); i = j+1; }
      else { const m = /^[A-Za-z0-9²³πΔ]+/.exec(s.slice(i)); rad = m?m[0]:''; i += rad.length; }
      out += '<span class="sqrt">'+(idx?'<sup class="idx">'+parseMath(idx)+'</sup>':'')+'<span class="rad">√</span><span class="radicand">'+parseMath(rad)+'</span></span>';
      continue;
    }
    if(c==='~' && s[i+1]==='('){
      const j = matchClose(s,i+1);
      out += '<span class="per">'+parseMath(s.slice(i+2,j))+'</span>'; i = j+1; continue;
    }
    if(c==='^' || c==='_'){
      let inner;
      if(s[i+1]==='('){ const j = matchClose(s,i+1); inner = s.slice(i+2,j); i = j+1; }
      else {
        const m = /^[-+]?[A-Za-z0-9]+/.exec(s.slice(i+1));
        if(m){ inner = m[0]; i += 1+inner.length; } else { out += c; i++; continue; }
      }
      out += (c==='^'?'<sup>':'<sub>')+parseMath(inner)+(c==='^'?'</sup>':'</sub>');
      continue;
    }
    if(SUP_MAP[c]!==undefined){
      let run = '';
      while(i<s.length && SUP_MAP[s[i]]!==undefined){ run += SUP_MAP[s[i]]; i++; }
      out += '<sup>'+run+'</sup>'; continue;
    }
    if(c==='-' && isMinus(s,i)){ out += '−'; i++; continue; }
    out += c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;
    i++;
  }
  return out;
}
function inline(s){
  // **fett** + Mathe
  return s.split('**').map((seg,k)=> k%2 ? '<b>'+parseMath(seg)+'</b>' : parseMath(seg)).join('');
}
function renderTable(spec){
  const rows = spec.split(' ;; ').map(r=>r.split('§'));
  let h = '<div class="tbl-wrap"><table class="tbl">';
  rows.forEach((cells,ri)=>{
    h += '<tr>' + cells.map(c=>{
      const t = c.replace(/\u200e/g,'').trim();
      return (ri===0?'<th>':'<td>') + inline(t) + (ri===0?'</th>':'</td>');
    }).join('') + '</tr>';
  });
  return h + '</table></div>';
}
function formatBody(body){
  const lines = body.split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim().length>0);
  let html = '', i = 0;
  while(i < lines.length){
    const L = lines[i];
    if(L.startsWith('$ ')){
      let items = '';
      while(i<lines.length && lines[i].startsWith('$ ')){
        const raw = lines[i].slice(2);
        const parts = raw.split(' ‖ ');
        items += '<div class="fl"><span class="fl-expr">'+inline(parts[0])+'</span>'+(parts[1]?'<span class="fl-note">'+inline(parts.slice(1).join(' ‖ '))+'</span>':'')+'</div>';
        i++;
      }
      html += '<div class="formula-block">'+items+'</div>';
    } else if(L.startsWith('% ')){
      let pre = '';
      while(i<lines.length && lines[i].startsWith('% ')){ pre += escapeHtml(lines[i].slice(2))+'\n'; i++; }
      html += '<pre class="pre">'+pre.trimEnd()+'</pre>';
    } else if(L.startsWith('- ')){
      let items = '';
      while(i<lines.length && lines[i].startsWith('- ')){ items += '<li>'+inline(lines[i].slice(2))+'</li>'; i++; }
      html += '<ul class="bullet-list">'+items+'</ul>';
    } else if(L.startsWith('! ')){
      html += '<div class="callout">'+inline(L.slice(2))+'</div>'; i++;
    } else if(L.startsWith('## ')){
      html += '<h4 class="subhead">'+inline(L.slice(3))+'</h4>'; i++;
    } else if(L.startsWith('T: ')){
      html += renderTable(L.slice(3)); i++;
    } else {
      const m = /^(\d)\)\s+(.*)$/.exec(L);
      if(m) html += '<p class="step"><span class="n">'+m[1]+'</span><span>'+inline(m[2])+'</span></p>';
      else html += '<p class="prose-line">'+inline(L)+'</p>';
      i++;
    }
  }
  return html;
}

function openDetail(id){
  const idx = filtered.findIndex(r => r.id === id);
  if(idx === -1) return;
  currentIndex = idx;
  showCurrent();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay').scrollTop = 0;
}

function showCurrent(){
  const r = filtered[currentIndex];
  document.getElementById('overlayCat').textContent = r.category;
  document.getElementById('overlayTitle').textContent = r.title;
  document.getElementById('overlayText').innerHTML = formatBody(r.body);
  document.getElementById('overlaySource').textContent = 'Aus deinem Regelheft · Seite ' + r.page;
  const diagSection = document.getElementById('diagramSection');
  const diagFrame = document.getElementById('diagramFrame');
  if(r.diagram){
    diagFrame.innerHTML = r.diagram;
    diagSection.style.display = 'block';
  } else {
    diagFrame.innerHTML = '';
    diagSection.style.display = 'none';
  }
  document.getElementById('prevBtn').disabled = currentIndex <= 0;
  document.getElementById('nextBtn').disabled = currentIndex >= filtered.length - 1;
  document.getElementById('overlay').scrollTop = 0;
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentIndex > 0){ currentIndex--; showCurrent(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentIndex < filtered.length - 1){ currentIndex++; showCurrent(); }
});

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', (e)=>{
  query = e.target.value;
  clearBtn.style.display = query ? 'flex' : 'none';
  applyFilter();
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  query = '';
  clearBtn.style.display = 'none';
  applyFilter();
  searchInput.focus();
});

renderChips();
applyFilter();
</script>
