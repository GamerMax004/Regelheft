><circle cx=\"114.9\" cy=\"126.5\" r=\"4\" fill=\"#0d9488\" stroke=\"none\"/><circle cx=\"154.3\" cy=\"159\" r=\"4\" fill=\"#0d9488\" stroke=\"none\"/><circle cx=\"233.1\" cy=\"185\" r=\"4\" fill=\"#0d9488\" stroke=\"none\"/><circle cx=\"272.6\" cy=\"191.5\" r=\"4\" fill=\"#0d9488\" stroke=\"none\"/><text x=\"233.1\" y=\"142.8\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">y = 30/x</text></svg>"}, {"id": "r59", "title": "Grundbegriffe der Prozentrechnung", "page": 29, "category": "Zuordnungen & Prozent-Grundlagen", "body": "T: Begriff§Bedeutung ;; Grundwert G§das Ganze ;; Prozentwert W§der betrachtete Teil des Grundwerts, gleiche Einheit wie G ;; Prozentsatz p§Anteil des Prozentwerts am Grundwert in %\n## Beispiel\n1 kg Schokolade (G) besteht zu 31 % (p) aus Fett. Das sind 310 g (W).", "plain": "Begriff, Bedeutung; Grundwert G, das Ganze; Prozentwert W, der betrachtete Teil des Grundwerts, gleiche Einheit wie G; Prozentsatz p, Anteil des Prozentwerts am Grundwert in %\nBeispiel\n1 kg Schokolade (G) besteht zu 31 % (p) aus Fett. Das sind 310 g (W).", "excerpt": "Begriff, Bedeutung; Grundwert G, das Ganze; Prozentwert W, der betrachtete Teil des Grundwerts, gleiche Einheit wie G; Prozentsatz p, Anteil des Prozentwerts am Grundwert in % Beispiel 1 kg Schokolade (G) besteht zu 31 % (p) aus Fett. Das sind 310 g (W).", "diagram": null}, {"id": "r60", "title": "Grundaufgaben der Prozentrechnung", "page": 30, "category": "Prozentrechnung & Zinsen", "body": "In der Prozentrechnung kann p, W oder G gesucht sein.\nT: gegeben§gesucht§Formel ;; G, W§p§p = {W/G} ;; G, p§W§W = p · G ;; W, p§G§G = {W/p}\n! Merkhilfe (Dreieck): oben W, unten p · G. Die gesuchte Größe deckt man mit der Hand ab.", "plain": "In der Prozentrechnung kann p, W oder G gesucht sein.\ngegeben, gesucht, Formel; G, W, p, p = W/G; G, p, W, W = p · G; W, p, G, G = W/p\nMerkhilfe (Dreieck): oben W, unten p · G. Die gesuchte Größe deckt man mit der Hand ab.", "excerpt": "In der Prozentrechnung kann p, W oder G gesucht sein. gegeben, gesucht, Formel; G, W, p, p = W/G; G, p, W, W = p · G; W, p, G, G = W/p Merkhilfe (Dreieck): oben W, unten p · G. Die gesuchte Größe deckt man mit der Hand ab.", "diagram": null}, {"id": "r61", "title": "Unterjährige Zinsen", "page": 30, "category": "Prozentrechnung & Zinsen", "body": "Die Bank rechnet mit 30 Tagen pro Monat und 360 Tagen pro Jahr. Wird Geld für t Tage (weniger als ein Jahr) angelegt, erhält man nur {t/360} der Jahreszinsen.\n$ W = {t/360} · p · G ‖ W = Zinsen\nMit dieser Formel kann man auch andere Größen berechnen (Zeit, Zinssatz, Guthaben).\n## Beispiel: Wie lange lag ein Guthaben von 1200 € bei 2,75 % auf einem Konto, wenn es auf 1211 € gewachsen ist?\n$ G = 1200 €, W = 11 €, p = 2,75 %\n$ 11 = {t/360} · 0,0275 · 1200 ‖ 1. Einsetzen\n$ 11 = {11/120} · t ‖ 2. Vereinfachen (Taschenrechner)\n$ t = 11 : {11/120} = 120 ‖ 3. Umkehraufgabe lösen\n$ Antwort: 120 Tage ‖ 4. Antwort (evtl. Probe)", "plain": "Die Bank rechnet mit 30 Tagen pro Monat und 360 Tagen pro Jahr. Wird Geld für t Tage (weniger als ein Jahr) angelegt, erhält man nur t/360 der Jahreszinsen.\nW = t/360 · p · G – W = Zinsen\nMit dieser Formel kann man auch andere Größen berechnen (Zeit, Zinssatz, Guthaben).\nBeispiel: Wie lange lag ein Guthaben von 1200 € bei 2,75 % auf einem Konto, wenn es auf 1211 € gewachsen ist?\nG = 1200 €, W = 11 €, p = 2,75 %\n11 = t/360 · 0,0275 · 1200 – 1. Einsetzen\n11 = 11/120 · t – 2. Vereinfachen (Taschenrechner)\nt = 11 : 11/120 = 120 – 3. Umkehraufgabe lösen\nAntwort: 120 Tage – 4. Antwort (evtl. Probe)", "excerpt": "Die Bank rechnet mit 30 Tagen pro Monat und 360 Tagen pro Jahr. Wird Geld für t Tage (weniger als ein Jahr) angelegt, erhält man nur t/360 der Jahreszinsen. W = t/360 · p · G – W = Zinsen Mit dieser Formel kann man auch andere Größen berechnen (Zeit, Zinssatz, Guthaben).", "diagram": null}, {"id": "r62", "title": "Äquivalente Terme und Terme vereinfachen", "page": 31, "category": "Terme & Gleichungen", "body": "Formt man einen Term mit den Rechenregeln um, erhält man einen **äquivalenten** (gleichwertigen) Term: Für jede eingesetzte Zahl haben beide denselben Wert.\n## Vorgehen beim Vereinfachen\n1) Summanden mit und ohne Variable ordnen.\n2) Summanden mit Variable und ohne Variable jeweils zusammenfassen.\n## Beispiele\n$ -x - 1 + 5 + 6x = -x + 6x - 1 + 5 = 5x + 4\n$ a + 2a - 3a + a + 4 = a + 4", "plain": "Formt man einen Term mit den Rechenregeln um, erhält man einen äquivalenten (gleichwertigen) Term: Für jede eingesetzte Zahl haben beide denselben Wert.\nVorgehen beim Vereinfachen\n1) Summanden mit und ohne Variable ordnen.\n2) Summanden mit Variable und ohne Variable jeweils zusammenfassen.\nBeispiele\n-x - 1 + 5 + 6x = -x + 6x - 1 + 5 = 5x + 4\na + 2a - 3a + a + 4 = a + 4", "excerpt": "Formt man einen Term mit den Rechenregeln um, erhält man einen äquivalenten (gleichwertigen) Term: Für jede eingesetzte Zahl haben beide denselben Wert. Vorgehen beim Vereinfachen 1) Summanden mit und ohne Variable ordnen.", "diagram": null}, {"id": "r63", "title": "Ausmultiplizieren und Ausklammern", "page": 31, "category": "Terme & Gleichungen", "body": "Beim Multiplizieren einer Zahl mit einer Summe oder Differenz wird **jeder Summand** in der Klammer mit der Zahl multipliziert (**Distributivgesetz**). Auf die Rechenzeichen achten!\n$ 2·(x + 7) = 2x + 14\n$ (-3)·(4 + 2b) = -12 - 6b\n$ -2·(6 - 3z) = -12 + 6z\n$ -4·(-2 - 5l) = 8 + 20l", "plain": "Beim Multiplizieren einer Zahl mit einer Summe oder Differenz wird jeder Summand in der Klammer mit der Zahl multipliziert (Distributivgesetz). Auf die Rechenzeichen achten!\n2·(x + 7) = 2x + 14\n(-3)·(4 + 2b) = -12 - 6b\n-2·(6 - 3z) = -12 + 6z\n-4·(-2 - 5l) = 8 + 20l", "excerpt": "Beim Multiplizieren einer Zahl mit einer Summe oder Differenz wird jeder Summand in der Klammer mit der Zahl multipliziert (Distributivgesetz). Auf die Rechenzeichen achten! 2·(x + 7) = 2x + 14 (-3)·(4 + 2b) = -12 - 6b", "diagram": null}, {"id": "r64", "title": "Gleichungen aufstellen und lösen", "page": 32, "category": "Terme & Gleichungen", "body": "Ist der Wert eines Terms gegeben und sucht man die passende Variable, stellt man eine **Gleichung** auf.\n## Beispiel: Für welches x hat der Term 3x - 5 den Wert 31?\n$ 3x - 5 = 31\nEine Zahl ist **Lösung** einer Gleichung, wenn beide Seiten beim Einsetzen denselben Wert haben.\n$ x = 12: 3·12 - 5 = 31 ✓ ‖ Lösung\n$ x = 1: 3·1 - 5 = -2 ≠ 31 ‖ keine Lösung", "plain": "Ist der Wert eines Terms gegeben und sucht man die passende Variable, stellt man eine Gleichung auf.\nBeispiel: Für welches x hat der Term 3x - 5 den Wert 31?\n3x - 5 = 31\nEine Zahl ist Lösung einer Gleichung, wenn beide Seiten beim Einsetzen denselben Wert haben.\nx = 12: 3·12 - 5 = 31 ✓ – Lösung\nx = 1: 3·1 - 5 = -2 ≠ 31 – keine Lösung", "excerpt": "Ist der Wert eines Terms gegeben und sucht man die passende Variable, stellt man eine Gleichung auf. Beispiel: Für welches x hat der Term 3x - 5 den Wert 31? 3x - 5 = 31", "diagram": null}, {"id": "r65", "title": "Gleichungen durch Rückwärtsrechnen lösen", "page": 32, "category": "Terme & Gleichungen", "body": "Man schaut, welche Rechenschritte in welcher Reihenfolge mit der Variablen ausgeführt wurden, und kehrt sie in umgekehrter Reihenfolge um.\n## Beispiel: 103 + 2,5·x = 163\n$ 163 - 103 = 60 ‖ −103 rückwärts\n$ 60 : 2,5 = 24 ‖ : 2,5 rückwärts\n$ x = 24\n## Probe\n$ 103 + 2,5·24 = 163 ✓", "plain": "Man schaut, welche Rechenschritte in welcher Reihenfolge mit der Variablen ausgeführt wurden, und kehrt sie in umgekehrter Reihenfolge um.\nBeispiel: 103 + 2,5·x = 163\n163 - 103 = 60 – −103 rückwärts\n60 : 2,5 = 24 – : 2,5 rückwärts\nx = 24\nProbe\n103 + 2,5·24 = 163 ✓", "excerpt": "Man schaut, welche Rechenschritte in welcher Reihenfolge mit der Variablen ausgeführt wurden, und kehrt sie in umgekehrter Reihenfolge um. Beispiel: 103 + 2,5·x = 163 163 - 103 = 60 – −103 rückwärts", "diagram": null}, {"id": "r66", "title": "Gleichungen lösen: Äquivalenzumformungen", "page": 33, "category": "Terme & Gleichungen", "body": "Alle Zahlen, die beim Einsetzen für x eine Gleichung erfüllen, heißen **Lösung** der Gleichung. Man löst Gleichungen durch Umformungen auf **beiden** Seiten (**Äquivalenzumformungen**). Die Lösungen ändern sich dabei nicht.\nWichtige Äquivalenzumformungen:\n- beidseitig dieselbe Zahl oder denselben Term addieren oder subtrahieren\n- beidseitig mit derselben Zahl **ungleich 0** multiplizieren oder dividieren\n## Beispiel\n$ 5x + 2 = 2x + 8 ‖ − 2\n$ 5x = 2x + 6 ‖ − 2x\n$ 3x = 6 ‖ : 3\n$ x = 2\n## Strategie\n1) Beide Seiten vereinfachen.\n2) Alle Terme ohne Variable auf eine Seite bringen.\n3) Alle Terme mit Variable auf die andere Seite bringen.\n4) Die Variable allein stellen (1·x).\n5) Probe.", "plain": "Alle Zahlen, die beim Einsetzen für x eine Gleichung erfüllen, heißen Lösung der Gleichung. Man löst Gleichungen durch Umformungen auf beiden Seiten (Äquivalenzumformungen). Die Lösungen ändern sich dabei nicht.\nWichtige Äquivalenzumformungen:\nbeidseitig dieselbe Zahl oder denselben Term addieren oder subtrahieren\nbeidseitig mit derselben Zahl ungleich 0 multiplizieren oder dividieren\nBeispiel\n5x + 2 = 2x + 8 – − 2\n5x = 2x + 6 – − 2x\n3x = 6 – : 3\nx = 2\nStrategie\n1) Beide Seiten vereinfachen.\n2) Alle Terme ohne Variable auf eine Seite bringen.\n3) Alle Terme mit Variable auf die andere Seite bringen.\n4) Die Variable allein stellen (1·x).\n5) Probe.", "excerpt": "Alle Zahlen, die beim Einsetzen für x eine Gleichung erfüllen, heißen Lösung der Gleichung. Man löst Gleichungen durch Umformungen auf beiden Seiten (Äquivalenzumformungen). Die Lösungen ändern sich dabei nicht. Wichtige Äquivalenzumformungen: beidseitig dieselbe Zahl oder denselben Term addieren oder subtrahieren", "diagram": "<svg viewBox=\"0 0 330 204\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"165\" y1=\"52\" x2=\"165\" y2=\"166\" stroke=\"#1f2937\" stroke-width=\"5\"/><line x1=\"100\" y1=\"166\" x2=\"230\" y2=\"166\" stroke=\"#1f2937\" stroke-width=\"6\"/><line x1=\"52\" y1=\"58\" x2=\"278\" y2=\"58\" stroke=\"#1f2937\" stroke-width=\"4.5\"/><circle cx=\"165\" cy=\"58\" r=\"6\" fill=\"#1f2937\" stroke=\"none\"/><line x1=\"70\" y1=\"58\" x2=\"26\" y2=\"118\" stroke=\"#4338ca\" stroke-width=\"1.4\"/><line x1=\"70\" y1=\"58\" x2=\"114\" y2=\"118\" stroke=\"#4338ca\" stroke-width=\"1.4\"/><path d=\"M 22 118 L 118 118 Q 112 152 70 154 Q 28 152 22 118 Z\" fill=\"#e0e7ff\" stroke=\"#4338ca\" stroke-width=\"2\"/><text x=\"70\" y=\"141\" font-size=\"15\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">5x + 2</text><line x1=\"260\" y1=\"58\" x2=\"216\" y2=\"118\" stroke=\"#0d9488\" stroke-width=\"1.4\"/><line x1=\"260\" y1=\"58\" x2=\"304\" y2=\"118\" stroke=\"#0d9488\" stroke-width=\"1.4\"/><path d=\"M 212 118 L 308 118 Q 302 152 260 154 Q 218 152 212 118 Z\" fill=\"#e6f6f4\" stroke=\"#0d9488\" stroke-width=\"2\"/><text x=\"260\" y=\"141\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">2x + 8</text><text x=\"165\" y=\"34\" font-size=\"24\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">=</text><text x=\"165\" y=\"194\" font-size=\"11.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"500\">beide Seiten im Gleichgewicht</text></svg>"}, {"id": "r67", "title": "Äquivalenzpfeil und Lösungsmenge", "page": 34, "category": "Terme & Gleichungen", "body": "Das Zeichen ⇔ heißt **Äquivalenzpfeil**: Beide Gleichungen haben dieselbe Lösung.\n$ 5x + 2 = 2x + 8 ‖ − 2\n$ ⇔ 5x = 2x + 6 ‖ − 2x\n$ ⇔ 3x = 6 ‖ : 3\n$ ⇔ x = 2\n$ L = {2}", "plain": "Das Zeichen ⇔ heißt Äquivalenzpfeil: Beide Gleichungen haben dieselbe Lösung.\n5x + 2 = 2x + 8 – − 2\n⇔ 5x = 2x + 6 – − 2x\n⇔ 3x = 6 – : 3\n⇔ x = 2\nL = {2}", "excerpt": "Das Zeichen ⇔ heißt Äquivalenzpfeil: Beide Gleichungen haben dieselbe Lösung. 5x + 2 = 2x + 8 – − 2 ⇔ 5x = 2x + 6 – − 2x", "diagram": null}, {"id": "r68", "title": "Sonderfälle beim Lösen von Gleichungen", "page": 34, "category": "Terme & Gleichungen", "body": "Beim Umformen können seltsame Fälle auftreten:\nT: Fall§Umformung§Ergebnis ;; 1§2x - 7 = 6x + 10 - 4x ⇔ -7 = 10 (falsch)§Widerspruch: keine Lösung, L = { } ;; 2§2x - 7 = 6x - 7 - 4x ⇔ 0 = 0 (wahr)§allgemeingültig: unendlich viele Lösungen, L = ℚ ;; 3§2x - 7 = 6x + 10 - 3x ⇔ x = -17§eindeutige Lösung, L = {-17}", "plain": "Beim Umformen können seltsame Fälle auftreten:\nFall, Umformung, Ergebnis; 1, 2x - 7 = 6x + 10 - 4x ⇔ -7 = 10 (falsch), Widerspruch: keine Lösung, L = { }; 2, 2x - 7 = 6x - 7 - 4x ⇔ 0 = 0 (wahr), allgemeingültig: unendlich viele Lösungen, L = ℚ; 3, 2x - 7 = 6x + 10 - 3x ⇔ x = -17, eindeutige Lösung, L = {-17}", "excerpt": "Beim Umformen können seltsame Fälle auftreten: Fall, Umformung, Ergebnis; 1, 2x - 7 = 6x + 10 - 4x ⇔ -7 = 10 (falsch), Widerspruch: keine Lösung, L = { }; 2, 2x - 7 = 6x - 7 - 4x ⇔ 0 = 0 (wahr), allgemeingültig: unendlich viele Lösungen, L = ℚ; 3, 2x - 7 = 6x + 10 - 3x ⇔ x = -17, eindeutige Lösung, L = {-17}", "diagram": null}, {"id": "r69", "title": "Wann ist ein Bruchterm definiert?", "page": 35, "category": "Bruchterme & Winkelbeziehungen", "body": "Durch 0 darf man **niemals** teilen. Ein Bruchterm ist daher nicht definiert, wenn der Nenner 0 wird. Bevor man mit Bruchtermen rechnet, bestimmt man, für welche Werte sie nicht definiert sind.\n## Beispiel: {3x - 2/3·(3 + x)}\n$ 3·(3 + x) = 0 ‖ Nenner gleich 0 setzen\n$ 9 + 3x = 0 ‖ ausmultipliziert, − 9\n$ 3x = -9 ‖ : 3\n$ x = -3\nDer Bruchterm ist nur für x ≠ -3 definiert.", "plain": "Durch 0 darf man niemals teilen. Ein Bruchterm ist daher nicht definiert, wenn der Nenner 0 wird. Bevor man mit Bruchtermen rechnet, bestimmt man, für welche Werte sie nicht definiert sind.\nBeispiel: 3x - 2/3·(3 + x)\n3·(3 + x) = 0 – Nenner gleich 0 setzen\n9 + 3x = 0 – ausmultipliziert, − 9\n3x = -9 – : 3\nx = -3\nDer Bruchterm ist nur für x ≠ -3 definiert.", "excerpt": "Durch 0 darf man niemals teilen. Ein Bruchterm ist daher nicht definiert, wenn der Nenner 0 wird. Bevor man mit Bruchtermen rechnet, bestimmt man, für welche Werte sie nicht definiert sind. Beispiel: 3x - 2/3·(3 + x) 3·(3 + x) = 0 – Nenner gleich 0 setzen", "diagram": null}, {"id": "r70", "title": "Addieren und Subtrahieren von Bruchtermen", "page": 35, "category": "Bruchterme & Winkelbeziehungen", "body": "Auch Bruchterme müssen vor dem Addieren bzw. Subtrahieren auf denselben Nenner gebracht werden.\n## Beispiel a) (x ≠ 0)\n$ {8/x} + {3/2x} = {16/2x} + {3/2x} = {19/2x}\n## Beispiel b) (x ≠ 0 und x ≠ 3)\n$ {2/x - 3} - {4/x} = {2x/x·(x - 3)} - {4·(x - 3)/x·(x - 3)}\n$ = {2x - 4·(x - 3)/x·(x - 3)} = {2x - 4x + 12/x·(x - 3)} = {-2x + 12/x·(x - 3)}", "plain": "Auch Bruchterme müssen vor dem Addieren bzw. Subtrahieren auf denselben Nenner gebracht werden.\nBeispiel a) (x ≠ 0)\n8/x + 3/2x = 16/2x + 3/2x = 19/2x\nBeispiel b) (x ≠ 0 und x ≠ 3)\n2/x - 3 - 4/x = 2x/x·(x - 3) - 4·(x - 3)/x·(x - 3)\n= 2x - 4·(x - 3)/x·(x - 3) = 2x - 4x + 12/x·(x - 3) = -2x + 12/x·(x - 3)", "excerpt": "Auch Bruchterme müssen vor dem Addieren bzw. Subtrahieren auf denselben Nenner gebracht werden. Beispiel a) (x ≠ 0) 8/x + 3/2x = 16/2x + 3/2x = 19/2x", "diagram": null}, {"id": "r71", "title": "Lösen von Bruchgleichungen", "page": 36, "category": "Bruchterme & Winkelbeziehungen", "body": "1) Prüfen, für welche x die Bruchterme nicht definiert sind.\n2) Beide Seiten mit dem gemeinsamen Nenner multiplizieren.\n3) Die entstehende Gleichung mit Äquivalenzumformungen lösen.\n4) Probe.\n## Beispiel (x ≠ 0)\n$ {1/x} + {4/3x} = 7 ‖ auf gleichen Nenner bringen\n$ {3/3x} + {4/3x} = 7\n$ {7/3x} = 7 ‖ · 3x\n$ 7 = 21x ‖ : 21\n$ x = {1/3}, L = {{1/3}}\n## Probe\n$ {1/(1/3)} + {4/3·(1/3)} = 3 + 4 = 7 ✓", "plain": "1) Prüfen, für welche x die Bruchterme nicht definiert sind.\n2) Beide Seiten mit dem gemeinsamen Nenner multiplizieren.\n3) Die entstehende Gleichung mit Äquivalenzumformungen lösen.\n4) Probe.\nBeispiel (x ≠ 0)\n1/x + 4/3x = 7 – auf gleichen Nenner bringen\n3/3x + 4/3x = 7\n7/3x = 7 – · 3x\n7 = 21x – : 21\nx = 1/3, L = {1/3}\nProbe\n1/(1/3) + 4/3·(1/3) = 3 + 4 = 7 ✓", "excerpt": "1) Prüfen, für welche x die Bruchterme nicht definiert sind. 2) Beide Seiten mit dem gemeinsamen Nenner multiplizieren. 3) Die entstehende Gleichung mit Äquivalenzumformungen lösen.", "diagram": null}, {"id": "r72", "title": "Winkelbeziehungen an sich schneidenden Geraden", "page": 36, "category": "Bruchterme & Winkelbeziehungen", "body": "Schneiden sich zwei Geraden, dann gilt:\n- **Nebenwinkel** ergänzen sich zu 180°: α + β = 180°\n- **Scheitelwinkel** sind gleich groß: γ = δ", "plain": "Schneiden sich zwei Geraden, dann gilt:\nNebenwinkel ergänzen sich zu 180°: α + β = 180°\nScheitelwinkel sind gleich groß: γ = δ", "excerpt": "Schneiden sich zwei Geraden, dann gilt: Nebenwinkel ergänzen sich zu 180°: α + β = 180° Scheitelwinkel sind gleich groß: γ = δ", "diagram": "<svg viewBox=\"0 0 330 222\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"40\" y1=\"95\" x2=\"290\" y2=\"95\" stroke=\"#1f2937\" stroke-width=\"2.4\"/><line x1=\"97.3\" y1=\"181.7\" x2=\"232.7\" y2=\"8.3\" stroke=\"#4338ca\" stroke-width=\"2.4\"/><circle cx=\"165\" cy=\"95\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><path d=\"M 165 95 L 205 95 A 40 40 0 0 0 189.6 63.5 Z\" fill=\"#4338ca\" fill-opacity=\"0.26\" stroke=\"#4338ca\" stroke-width=\"1.8\"/><text x=\"213.5\" y=\"76.3\" font-size=\"15\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">α</text><path d=\"M 165 95 L 189.6 63.5 A 40 40 0 0 0 125 95 Z\" fill=\"#0d9488\" fill-opacity=\"0.26\" stroke=\"#0d9488\" stroke-width=\"1.8\"/><text x=\"141.3\" y=\"51.5\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">β</text><path d=\"M 165 95 L 125 95 A 40 40 0 0 0 140.4 126.5 Z\" fill=\"#4338ca\" fill-opacity=\"0.26\" stroke=\"#4338ca\" stroke-width=\"1.8\"/><text x=\"116.5\" y=\"123.7\" font-size=\"15\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">γ</text><path d=\"M 165 95 L 140.4 126.5 A 40 40 0 0 0 205 95 Z\" fill=\"#0d9488\" fill-opacity=\"0.26\" stroke=\"#0d9488\" stroke-width=\"1.8\"/><text x=\"188.7\" y=\"148.5\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">δ</text><text x=\"165\" y=\"208\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"700\">α + β = 180°   |   α = γ,  β = δ</text></svg>"}, {"id": "r73", "title": "Stufenwinkel und Wechselwinkel", "page": 37, "category": "Dreieckskonstruktionen", "body": "Werden zwei **parallele** Geraden g und h von einer dritten Geraden k geschnitten, dann gilt:\n- **Stufenwinkel** sind gleich groß: α = β\n- **Wechselwinkel** sind gleich groß: γ = δ (Kombination aus Scheitel- und Stufenwinkel)", "plain": "Werden zwei parallele Geraden g und h von einer dritten Geraden k geschnitten, dann gilt:\nStufenwinkel sind gleich groß: α = β\nWechselwinkel sind gleich groß: γ = δ (Kombination aus Scheitel- und Stufenwinkel)", "excerpt": "Werden zwei parallele Geraden g und h von einer dritten Geraden k geschnitten, dann gilt: Stufenwinkel sind gleich groß: α = β Wechselwinkel sind gleich groß: γ = δ (Kombination aus Scheitel- und Stufenwinkel)", "diagram": "<svg viewBox=\"0 0 340 464\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><svg x=\"0.0\" y=\"0\" width=\"340\" height=\"228\" viewBox=\"0 0 340 228\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Aria " stroke-width=\"2.4\"/><text x=\"308\" y=\"74\" font-size=\"13\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"600\">g</text><text x=\"308\" y=\"174\" font-size=\"13\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"600\">h</text><text x=\"270\" y=\"228\" font-size=\"13\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"600\">k</text><path d=\"M 130 70 L 104 70 A 26 26 0 0 0 148.4 88.4 Z\" fill=\"#0d9488\" fill-opacity=\"0.28\" stroke=\"#0d9488\" stroke-width=\"1.8\"/><text x=\"115.1\" y=\"111\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">γ</text><path d=\"M 230 170 L 256 170 A 26 26 0 0 0 211.6 151.6 Z\" fill=\"#0d9488\" fill-opacity=\"0.28\" stroke=\"#0d9488\" stroke-width=\"1.8\"/><text x=\"244.9\" y=\"139\" font-size=\"15\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">δ</text><text x=\"165\" y=\"215\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">γ = δ  (Wechselwinkel)</text></svg></svg>"}, {"id": "r74", "title": "Innenwinkelsatz für Dreiecke", "page": 37, "category": "Dreieckskonstruktionen", "body": "In jedem Dreieck beträgt die Summe der Innenwinkel 180°.\n$ α + β + γ = 180°", "plain": "In jedem Dreieck beträgt die Summe der Innenwinkel 180°.\nα + β + γ = 180°", "excerpt": "In jedem Dreieck beträgt die Summe der Innenwinkel 180°. α + β + γ = 180°", "diagram": "<svg viewBox=\"0 0 330 220\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"45,170 285,170 150,40\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><path d=\"M 75 170 A 30 30 0 0 0 63.9 146.7\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.2\"/><text x=\"84.7\" y=\"156\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">α</text><path d=\"M 263.4 149.2 A 30 30 0 0 0 255 170\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.2\"/><text x=\"244.2\" y=\"158.5\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">β</text><path d=\"M 133.7 60.2 A 26 26 0 0 0 168.7 58\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.2\"/><text x=\"152.6\" y=\"86.9\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">γ</text><text x=\"31\" y=\"188\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"299\" y=\"188\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"150\" y=\"30\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"165\" y=\"192\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">c</text><text x=\"233\" y=\"105\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">a</text><text x=\"83\" y=\"105\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">b</text></svg>"}, {"id": "r75", "title": "Vorgehen bei Dreieckskonstruktionen", "page": 37, "category": "Dreieckskonstruktionen", "body": "1) Planfigur skizzieren und die gegebenen Größen markieren.\n2) Konstruktionsschritte festlegen (ggf. Konstruktionsbeschreibung).\n3) Konstruktion ausführen.", "plain": "1) Planfigur skizzieren und die gegebenen Größen markieren.\n2) Konstruktionsschritte festlegen (ggf. Konstruktionsbeschreibung).\n3) Konstruktion ausführen.", "excerpt": "1) Planfigur skizzieren und die gegebenen Größen markieren. 2) Konstruktionsschritte festlegen (ggf. Konstruktionsbeschreibung). 3) Konstruktion ausführen.", "diagram": null}, {"id": "r76", "title": "Dreieckskonstruktion SSS und SSW", "page": 38, "category": "Dreieckskonstruktionen", "body": "## Fall A (SSS): a = 6,4 cm; b = 3,5 cm; c = 5,3 cm\n1) Planfigur zeichnen.\n2) Strecke AB mit c = 5,3 cm zeichnen.\n3) Kreis um A mit Radius b = 3,5 cm zeichnen.\n4) Kreis um B mit Radius a = 6,4 cm zeichnen.\n5) Einen Schnittpunkt der Kreise C nennen.\n6) AC und BC zeichnen – ABC ist das gesuchte Dreieck.\nFehlende Größen: α = 91°, β = 33,1°, γ = 55,9°\n## Fall B (SSW): b = 6,8 cm; c = 5,2 cm; β = 75°\n1) Planfigur zeichnen.\n2) Strecke AB mit c = 5,2 cm zeichnen.\n3) In B an AB den Winkel β = 75° antragen.\n4) Kreis um A mit Radius b = 6,8 cm zeichnen.\n5) Den Schnittpunkt des Kreises mit dem freien Schenkel von β C nennen.\n6) AC zeichnen – ABC ist das gesuchte Dreieck.\nFehlende Größen: a = 5,9 cm, α = 57,4°, γ = 47,6°", "plain": "Fall A (SSS): a = 6,4 cm; b = 3,5 cm; c = 5,3 cm\n1) Planfigur zeichnen.\n2) Strecke AB mit c = 5,3 cm zeichnen.\n3) Kreis um A mit Radius b = 3,5 cm zeichnen.\n4) Kreis um B mit Radius a = 6,4 cm zeichnen.\n5) Einen Schnittpunkt der Kreise C nennen.\n6) AC und BC zeichnen – ABC ist das gesuchte Dreieck.\nFehlende Größen: α = 91°, β = 33,1°, γ = 55,9°\nFall B (SSW): b = 6,8 cm; c = 5,2 cm; β = 75°\n1) Planfigur zeichnen.\n2) Strecke AB mit c = 5,2 cm zeichnen.\n3) In B an AB den Winkel β = 75° antragen.\n4) Kreis um A mit Radius b = 6,8 cm zeichnen.\n5) Den Schnittpunkt des Kreises mit dem freien Schenkel von β C nennen.\n6) AC zeichnen – ABC ist das gesuchte Dreieck.\nFehlende Größen: a = 5,9 cm, α = 57,4°, γ = 47,6°", "excerpt": "Fall A (SSS): a = 6,4 cm; b = 3,5 cm; c = 5,3 cm 1) Planfigur zeichnen. 2) Strecke AB mit c = 5,3 cm zeichnen.", "diagram": "<svg viewBox=\"0 0 330 206\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><polygon points=\"20,150 140,150 78,50\" fill=\"#fff\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><line x1=\"140\" y1=\"150\" x2=\"78\" y2=\"50\" stroke=\"#4338ca\" stroke-width=\"4\"/><text x=\"123\" y=\"104\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">a</text><line x1=\"20\" y1=\"150\" x2=\"78\" y2=\"50\" stroke=\"#4338ca\" stroke-width=\"4\"/><text x=\"35\" y=\"104\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">b</text><line x1=\"20\" y1=\"150\" x2=\"140\" y2=\"150\" stroke=\"#4338ca\" stroke-width=\"4\"/><text x=\"80\" y=\"171\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">c</text><text x=\"10\" y=\"167\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"150\" y=\"167\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"78\" y=\"41\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"80\" y=\"194\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">SSS</text><polygon points=\"185,150 305,150 243,50\" fill=\"#fff\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><line x1=\"185\" y1=\"150\" x2=\"243\" y2=\"50\" stroke=\"#4338ca\" stroke-width=\"4\"/><text x=\"200\" y=\"104\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">b</text><line x1=\"185\" y1=\"150\" x2=\"305\" y2=\"150\" stroke=\"#4338ca\" stroke-width=\"4\"/><text x=\"245\" y=\"171\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">c</text><path d=\"M 291.6 130.1 A 24 24 0 0 0 281 150\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"3\"/><text x=\"271.4\" y=\"137.2\" font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">β</text><text x=\"175\" y=\"167\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"315\" y=\"167\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"243\" y=\"41\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"245\" y=\"194\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">SSW</text></svg>"}, {"id": "r77", "title": "Dreieckskonstruktion SWS und WSW", "page": 39, "category": "Dreieckskonstruktionen", "body": "## Fall C (SWS): a = 3,6 cm; c = 5,8 cm; β = 37°\n1) Planfigur zeichnen.\n2) Strecke AB mit c = 5,8 cm zeichnen.\n3) In B an AB den Winkel β = 37° antragen.\n4) Kreis um B mit Radius a = 3,6 cm zeichnen.\n5) Den Schnittpunkt des Kreises mit dem freien Schenkel von β C nennen.\n6) AC zeichnen – ABC ist das gesuchte Dreieck.\nFehlende Größen: b = 3,6 cm, α = 36,5°, γ = 106,5°\n## Fall D (WSW): a = 7,2 cm; β = 32°; γ = 68°\n1) Planfigur zeichnen.\n2) Strecke BC mit a = 7,2 cm zeichnen.\n3) In B an BC den Winkel β = 32° antragen.\n4) In C an CB den Winkel γ = 68° antragen.\n5) Den Schnittpunkt der freien Schenkel A nennen.\n6) ABC ist das gesuchte Dreieck.\nFehlende Größen: b = 3,9 cm, c = 6,8 cm, α = 80°", "plain": "Fall C (SWS): a = 3,6 cm; c = 5,8 cm; β = 37°\n1) Planfigur zeichnen.\n2) Strecke AB mit c = 5,8 cm zeichnen.\n3) In B an AB den Winkel β = 37° antragen.\n4) Kreis um B mit Radius a = 3,6 cm zeichnen.\n5) Den Schnittpunkt des Kreises mit dem freien Schenkel von β C nennen.\n6) AC zeichnen – ABC ist das gesuchte Dreieck.\nFehlende Größen: b = 3,6 cm, α = 36,5°, γ = 106,5°\nFall D (WSW): a = 7,2 cm; β = 32°; γ = 68°\n1) Planfigur zeichnen.\n2) Strecke BC mit a = 7,2 cm zeichnen.\n3) In B an BC den Winkel β = 32° antragen.\n4) In C an CB den Winkel γ = 68° antragen.\n5) Den Schnittpunkt der freien Schenkel A nennen.\n6) ABC ist das gesuchte Dreieck.\nFehlende Größen: b = 3,9 cm, c = 6,8 cm, α = 80°", "excerpt": "Fall C (SWS): a = 3,6 cm; c = 5,8 cm; β = 37° 1) Planfigur zeichnen. 2) Strecke AB mit c = 5,8 cm zeichnen.", "diagram": "<svg viewBox=\"0 0 330 206\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe U " font-size=\"14\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">γ</text><text x=\"175\" y=\"167\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"315\" y=\"167\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"243\" y=\"41\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">C</text><text x=\"245\" y=\"194\" font-size=\"13\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">WSW</text></svg>"}, {"id": "r78", "title": "Zuordnungen", "page": 40, "category": "Funktionen & Lineare Funktionen", "body": "Eine **Zuordnung** bildet Elemente eines **Definitionsbereichs** nach einer **Zuordnungsvorschrift** auf Elemente eines **Wertebereichs** ab.", "plain": "Eine Zuordnung bildet Elemente eines Definitionsbereichs nach einer Zuordnungsvorschrift auf Elemente eines Wertebereichs ab.", "excerpt": "Eine Zuordnung bildet Elemente eines Definitionsbereichs nach einer Zuordnungsvorschrift auf Elemente eines Wertebereichs ab.", "diagram": "<svg viewBox=\"0 0 330 208\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><rect x=\"40\" y=\"22\" width=\"76\" height=\"150\" rx=\"14\" fill=\"#e0e7ff\" stroke=\"#4338ca\" stroke-width=\"1.8\"/><text x=\"78\" y=\"196\" font-size=\"11.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"700\">Definitionsbereich</text><rect x=\"220\" y=\"22\" width=\"76\" height=\"150\" rx=\"14\" fill=\"#e0e7ff\" stroke=\"#4338ca\" stroke-width=\"1.8\"/><text x=\"258\" y=\"196\" font-size=\"11.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"700\">Wertebereich</text><circle cx=\"78\" cy=\"60\" r=\"5\" fill=\"#1f2937\" stroke=\"none\"/><circle cx=\"258\" cy=\"60\" r=\"5\" fill=\"#1f2937\" stroke=\"none\"/><circle cx=\"78\" cy=\"97\" r=\"5\" fill=\"#1f2937\" stroke=\"none\"/><circle cx=\"258\" cy=\"97\" r=\"5\" fill=\"#1f2937\" stroke=\"none\"/><circle cx=\"78\" cy=\"134\" r=\"5\" fill=\"#1f2937\" stroke=\"none\"/><circle cx=\"258\" cy=\"134\" r=\"5\" fill=\"#1f2937\" stroke=\"none\"/><line x1=\"86\" y1=\"60\" x2=\"248\" y2=\"97\" stroke=\"#4338ca\" stroke-width=\"2\"/><polygon points=\"252,97 245.5,92.4 244.1,98.4\" fill=\"#4338ca\" stroke=\"#4338ca\" stroke-width=\"1\"/><line x1=\"86\" y1=\"97\" x2=\"248\" y2=\"134\" stroke=\"#4338ca\" stroke-width=\"2\"/><polygon points=\"252,134 245.5,129.4 244.1,135.4\" fill=\"#4338ca\" stroke=\"#4338ca\" stroke-width=\"1\"/><line x1=\"86\" y1=\"134\" x2=\"248\" y2=\"134\" stroke=\"#4338ca\" stroke-width=\"2\"/><polygon points=\"252,134 244.6,130.9 244.6,137.1\" fill=\"#4338ca\" stroke=\"#4338ca\" stroke-width=\"1\"/><text x=\"167\" y=\"14\" font-size=\"11.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"500\">jedem x genau ein y</text></svg>"}, {"id": "r79", "title": "Eindeutige Zuordnungen", "page": 40, "category": "Funktionen & Lineare Funktionen", "body": "Eine Zuordnung heißt **eindeutig**, wenn jedem Element des Definitionsbereichs **höchstens ein** Element des Wertebereichs zugeordnet wird.", "plain": "Eine Zuordnung heißt eindeutig, wenn jedem Element des Definitionsbereichs höchstens ein Element des Wertebereichs zugeordnet wird.", "excerpt": "Eine Zuordnung heißt eindeutig, wenn jedem Element des Definitionsbereichs höchstens ein Element des Wertebereichs zugeordnet wird.", "diagram": null}, {"id": "r80", "title": "Funktionen", "page": 40, "category": "Funktionen & Lineare Funktionen", "body": "Eine **Funktion** ist eine eindeutige Zuordnung, bei der Definitions- und Wertebereich die reellen Zahlen sind.\n$ f(x) = 2x + 1\n$ g(x) = {1/3}x - 25\nGegenbeispiel (mehrere Variablen, keine Funktion von x): a·x + c·y + n·x·y", "plain": "Eine Funktion ist eine eindeutige Zuordnung, bei der Definitions- und Wertebereich die reellen Zahlen sind.\nf(x) = 2x + 1\ng(x) = 1/3x - 25\nGegenbeispiel (mehrere Variablen, keine Funktion von x): a·x + c·y + n·x·y", "excerpt": "Eine Funktion ist eine eindeutige Zuordnung, bei der Definitions- und Wertebereich die reellen Zahlen sind. f(x) = 2x + 1 g(x) = 1/3x - 25", "diagram": null}, {"id": "r81", "title": "Schreibweise von Funktionen", "page": 41, "category": "Funktionen & Lineare Funktionen", "body": "$ f(x) = 5x + 6\n- f: Name der Funktion\n- x: Name der Variablen (der x-Achse)\n- 5x + 6: Funktionsterm\nGelesen: „f von x ist gleich 5x + 6“. Ein anderes Beispiel: g(h) = 6h + 5.", "plain": "f(x) = 5x + 6\nf: Name der Funktion\nx: Name der Variablen (der x-Achse)\n5x + 6: Funktionsterm\nGelesen: „f von x ist gleich 5x + 6“. Ein anderes Beispiel: g(h) = 6h + 5.", "excerpt": "f(x) = 5x + 6 f: Name der Funktion x: Name der Variablen (der x-Achse)", "diagram": null}, {"id": "r82", "title": "Lineare Funktionen", "page": 41, "category": "Funktionen & Lineare Funktionen", "body": "Eine **lineare Funktion** hat die Gleichung f(x) = m·x + b. Ihr Graph ist eine **Gerade**.\n$ f(x) = m · x + b\n- m: Steigung\n- b: y-Achsenabschnitt\nBeispiele: f(x) = 3x + 5; g(x) = -7x - 5; h(x) = 5 - x\nEin Sonderfall ist die **konstante Funktion** i(x) = -7 (m = 0), ihr Graph ist waagerecht.", "plain": "Eine lineare Funktion hat die Gleichung f(x) = m·x + b. Ihr Graph ist eine Gerade.\nf(x) = m · x + b\nm: Steigung\nb: y-Achsenabschnitt\nBeispiele: f(x) = 3x + 5; g(x) = -7x - 5; h(x) = 5 - x\nEin Sonderfall ist die konstante Funktion i(x) = -7 (m = 0), ihr Graph ist waagerecht.", "excerpt": "Eine lineare Funktion hat die Gleichung f(x) = m·x + b. Ihr Graph ist eine Gerade. f(x) = m · x + b m: Steigung", "diagram": null}, {"id": "r83", "title": "Steigungsdreieck und Ablesen von m und b", "page": 42, "category": "Funktionen & Lineare Funktionen", "body": "Für f(x) = m·x + b liest man ab:\n1) **b** (y-Achsenabschnitt): Hier schneidet der Graph die y-Achse, im Beispiel b = 1.\n2) **m** (Steigung): Mit dem Steigungsdreieck gilt\n$ m = {Δy/Δx} = {3/2} = 1,5", "plain": "Für f(x) = m·x + b liest man ab:\n1) b (y-Achsenabschnitt): Hier schneidet der Graph die y-Achse, im Beispiel b = 1.\n2) m (Steigung): Mit dem Steigungsdreieck gilt\nm = Δy/Δx = 3/2 = 1,5", "excerpt": "Für f(x) = m·x + b liest man ab: 1) b (y-Achsenabschnitt): Hier schneidet der Graph die y-Achse, im Beispiel b = 1. 2) m (Steigung): Mit dem Steigungsdreieck gilt", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"224\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"78.7\" y1=\"224\" x2=\"78.7\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"125.3\" y1=\"224\" x2=\"125.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"172\" y1=\"224\" x2=\"172\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"218.7\" y1=\"224\" x2=\"218.7\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"265.3\" y1=\"224\" x2=\"265.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"312\" y1=\"224\" x2=\"312\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"224\" x2=\"312\" y2=\"224\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"194.3\" x2=\"312\" y2=\"194.3\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"164.6\" x2=\"312\" y2=\"164.6\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"134.9\" x2=\"312\" y2=\"134.9\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"105.1\" x2=\"312\" y2=\"105.1\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\ x + b\n2) y-Achsenabschnitt berechnen: Einen Punkt einsetzen.\n$ f(1) = 1,5·1 + b = 3 ‖ Punkt A einsetzen\n$ 1,5 + b = 3 ‖ − 1,5\n$ b = 1,5\nDie Funktion lautet f(x) = 1,5x + 1,5.", "plain": "Gegeben: A(1|3) und B(3|6)\n1) Steigung berechnen:\nm = Δy/Δx = 6 - 3/3 - 1 = 3/2 = 1,5 – also f(x) = 1,5x + b\n2) y-Achsenabschnitt berechnen: Einen Punkt einsetzen.\nf(1) = 1,5·1 + b = 3 – Punkt A einsetzen\n1,5 + b = 3 – − 1,5\nb = 1,5\nDie Funktion lautet f(x) = 1,5x + 1,5.", "excerpt": "Gegeben: A(1|3) und B(3|6) 1) Steigung berechnen: m = Δy/Δx = 6 - 3/3 - 1 = 3/2 = 1,5 – also f(x) = 1,5x + b", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"224\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"78.7\" y1=\"224\" x2=\"78.7\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"125.3\" y1=\"224\" x2=\"125.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"172\" y1=\"224\" x2=\"172\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"218.7\" y1=\"224\" x2=\"218.7\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"265.3\" y1=\"224\" x2=\"265.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"312\" y1=\"224\" x2=\"312\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"224\" x2=\"312\" y2=\"224\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"200.9\" x2=\"312\" y2=\"200.9\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"177.8\" x2=\"312\" y2=\"177.8\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"154.7\" x2=\"312\" y2=\"154.7\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"131.6\" x2=\"312\" y2=\"131 ext><text x=\"316\" y=\"192.9\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"end\" font-weight=\"600\" font-style=\"italic\">x</text><text x=\"87.7\" y=\"18\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"600\" font-style=\"italic\">y</text><line x1=\"32\" y1=\"200.9\" x2=\"280.9\" y2=\"16\" stroke=\"#4338ca\" stroke-width=\"2.6\"/><circle cx=\"125.3\" cy=\"131.6\" r=\"4.4\" fill=\"#0d9488\" stroke=\"none\"/><text x=\"116.3\" y=\"122.6\" font-size=\"12.5\" fill=\"#0d9488\" text-anchor=\"end\" font-weight=\"700\">A(1|3)</text><circle cx=\"218.7\" cy=\"62.2\" r=\"4.4\" fill=\"#0d9488\" stroke=\"none\"/><text x=\"209.7\" y=\"53.2\" font-size=\"12.5\" fill=\"#0d9488\" text-anchor=\"end\" font-weight=\"700\">B(3|6)</text><line x1=\"125.3\" y1=\"131.6\" x2=\"218.7\" y2=\"131.6\" stroke=\"#0d9488\" stroke-width=\"2\"/><line x1=\"218.7\" y1=\"131.6\" x2=\"218.7\" y2=\"62.2\" stroke=\"#0d9488\" stroke-width=\"2\"/><text x=\"172\" y=\"145.4\" font-size=\"12\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">Δx = 2</text><text x=\"225.7\" y=\"100.9\" font-size=\"12\" fill=\"#0d9488\" text-anchor=\"start\" font-weight=\"700\">Δy = 3</text><text x=\"242\" y=\"180.1\" font-size=\"13\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"700\">f(x) = 1,5x + 1,5</text></svg>"}, {"id": "r86", "title": "1. Binomische Formel", "page": 43, "category": "Funktionen & Lineare Funktionen", "body": "$ (a + b)² = a² + 2ab + b²\n## Beweis\n$ (a + b)² = (a + b)·(a + b) = a·a + a·b + b·a + b·b = a² + 2ab + b²", "plain": "(a + b)² = a² + 2ab + b²\nBeweis\n(a + b)² = (a + b)·(a + b) = a·a + a·b + b·a + b·b = a² + 2ab + b²", "excerpt": "(a + b)² = a² + 2ab + b² Beweis (a + b)² = (a + b)·(a + b) = a·a + a·b + b·a + b·b = a² + 2ab + b²", "diagram": null}, {"id": "r87", "title": "2. Binomische Formel", "page": 44, "category": "Binomische Formeln", "body": "$ (a - b)² = a² - 2ab + b²", "plain": "(a - b)² = a² - 2ab + b²", "excerpt": "(a - b)² = a² - 2ab + b²", "diagram": null}, {"id": "r88", "title": "3. Binomische Formel", "page": 44, "category": "Binomische Formeln", "body": "$ (a + b)·(a - b) = a² - b²", "plain": "(a + b)·(a - b) = a² - b²", "excerpt": "(a + b)·(a - b) = a² - b²", "diagram": null}, {"id": "r89", "title": "Terme mit mehreren Variablen: Bruchrechnung", "page": 44, "category": "Binomische Formeln", "body": "$ {a/b} + {c/d} = {ad/bd} + {cb/bd} = {ad + cb/bd} ‖ Addition\n$ {a/b} · {c/d} = {ac/bd} ‖ Multiplikation\n$ {a/b} : {c/d} = {a/b} · {d/c} = {ad/bc} ‖ Division\nKürzen: {x·y/x} = y, aber {x + y/x} kann man **nicht** kürzen (nur ganze Faktoren kürzen!).\nAusklammern (Distributivgesetz rückwärts):\n$ x + x·y = x·(1 + y)", "plain": "a/b + c/d = ad/bd + cb/bd = ad + cb/bd – Addition\na/b · c/d = ac/bd – Multiplikation\na/b : c/d = a/b · d/c = ad/bc – Division\nKürzen: x·y/x = y, aber x + y/x kann man nicht kürzen (nur ganze Faktoren kürzen!).\nAusklammern (Distributivgesetz rückwärts):\nx + x·y = x·(1 + y)", "excerpt": "a/b + c/d = ad/bd + cb/bd = ad + cb/bd – Addition a/b · c/d = ac/bd – Multiplikation a/b : c/d = a/b · d/c = ad/bc – Division", "diagram": null}, {"id": "r90", "title": "Berechnen eines Quadrats", "page": 44, "category": "Binomische Formeln", "body": "## Ein Quadrat mit Seite x hat am Rand einen Streifen der Breite 47. Die Gesamtfläche ist x² + 15 463 cm².\n$ (x + 47)² = x² + 15463\n$ x² + 94x + 47² = x² + 15463 ‖ − x²\n$ 94x + 2209 = 15463 ‖ − 2209\n$ 94x = 13254 ‖ : 94\n$ x = 141", "plain": "Ein Quadrat mit Seite x hat am Rand einen Streifen der Breite 47. Die Gesamtfläche ist x² + 15 463 cm².\n(x + 47)² = x² + 15463\nx² + 94x + 47² = x² + 15463 – − x²\n94x + 2209 = 15463 – − 2209\n94x = 13254 – : 94\nx = 141", "excerpt": "Ein Quadrat mit Seite x hat am Rand einen Streifen der Breite 47. Die Gesamtfläche ist x² + 15 463 cm². (x + 47)² = x² + 15463 x² + 94x + 47² = x² + 15463 – − x²", "diagram": null}, {"id": "r91", "title": "Rechteck und Dreieck", "page": 45, "category": "Flächeninhalte", "body": "$ Rechteck: U = 2a + 2b\n$ Rechteck: A = a · b\n$ Dreieck: A = {1/2} · g · h\n## Beispiel\n$ A = {1/2} · 120 m · 80 m = 4800 m²\n## Umkehraufgabe: A = 1000 cm², h = 50 cm; gesucht ist die Grundseite g\n$ 1000 cm² = {1/2} · g · 50 cm = 25 cm · g ‖ Formel einsetzen\n$ g = 1000 cm² : 25 cm = 40 cm", "plain": "Rechteck: U = 2a + 2b\nRechteck: A = a · b\nDreieck: A = 1/2 · g · h\nBeispiel\nA = 1/2 · 120 m · 80 m = 4800 m²\nUmkehraufgabe: A = 1000 cm², h = 50 cm; gesucht ist die Grundseite g\n1000 cm² = 1/2 · g · 50 cm = 25 cm · g – Formel einsetzen\ng = 1000 cm² : 25 cm = 40 cm", "excerpt": "Rechteck: U = 2a + 2b Rechteck: A = a · b Dreieck: A = 1/2 · g · h", "diagram": "<svg viewBox=\"0 0 340 236\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><text x=\"90\" y=\"16\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"700\">Dreieck</text><polygon points=\"30,92 150,92 80,30\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.4\"/><line x1=\"80\" y1=\"92\" x2=\"80\" y2=\"30\" stroke=\"#4338ca\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\"/><polyline points=\"89,92 89,83 80,83\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.6\"/><text x=\"90\" y=\"66\" font-size=\"12.5\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"600\">h</text><text x=\"90\" y=\"110\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">g</text><text x=\"245\" y=\"16\" font-size=\"12.5\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"700\">Rechteck</text><polygon points=\"190,30 300,30 300,92 190,92\" fill=\"#e0e7ff\" stroke=\"#1f2937\" stroke-width=\"2.4\"/><text x=\"245\" y=\"110\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weig  32\n1) Eine Gleichung nach einer Variablen umstellen.\n5x - 7y = 1 – + 7y\n5x = 1 + 7y – : 5\nx = 1/5 + 7/5·y\n2) Das Ergebnis in die andere Gleichung einsetzen und lösen.\n6·(1/5 + 7/5·y) + 7y = 32 – ausmultiplizieren\n6/5 + 42/5·y + 7y = 32 – · 5\n6 + 42y + 35y = 160\n6 + 77y = 160 – − 6\n77y = 154 – : 77\ny = 2\n3) Das Ergebnis in eine Gleichung einsetzen.\n5x - 7·2 = 1\n5x - 14 = 1 – + 14\n5x = 15 – : 5\nx = 3\n4) Lösungsmenge notieren:\nL = {(3|2)}", "excerpt": "Beispiel I: 5x - 7y = 1 II: 6x + 7y = 32", "diagram": null}, {"id": "r95", "title": "LGS sortieren und Lösungsmenge", "page": 48, "category": "Lineare Gleichungssysteme", "body": "Sind die Gleichungen unsortiert, ordnet man sie zuerst mit Äquivalenzumformungen: Variablen nach links, Zahlen nach rechts.\n$ 3x + 2y + 7 = x - 5y + 1 ‖ − x, + 5y, − 7\n$ 2x + 7y = -6\n$ 3x - 2y - 6 = 3x - y - 4 ‖ − 3x, + y, + 6\n$ -y = 2\nDie Lösungsmenge schreibt man als geordnetes Paar: L = {(x|y)}.", "plain": "Sind die Gleichungen unsortiert, ordnet man sie zuerst mit Äquivalenzumformungen: Variablen nach links, Zahlen nach rechts.\n3x + 2y + 7 = x - 5y + 1 – − x, + 5y, − 7\n2x + 7y = -6\n3x - 2y - 6 = 3x - y - 4 – − 3x, + y, + 6\n-y = 2\nDie Lösungsmenge schreibt man als geordnetes Paar: L = {(x|y)}.", "excerpt": "Sind die Gleichungen unsortiert, ordnet man sie zuerst mit Äquivalenzumformungen: Variablen nach links, Zahlen nach rechts. 3x + 2y + 7 = x - 5y + 1 – − x, + 5y, − 7 2x + 7y = -6", "diagram": null}, {"id": "r96", "title": "Grafisches Lösen von LGS", "page": 48, "category": "Lineare Gleichungssysteme", "body": "## Beispiel: 8x + 7y = 144 und x + y = 20\n1) Beide Gleichungen nach y umstellen.\n$ 8x + 7y = 144 ‖ − 8x\n$ 7y = 144 - 8x ‖ : 7\n$ y = {144/7} - {8/7}·x\n$ x + y = 20 ‖ − x\n$ y = 20 - x\n2) Beide Funktionen in ein geeignetes Koordinatensystem zeichnen.\n3) Den Schnittpunkt ablesen.\n4) Lösungsmenge notieren.", "plain": "Beispiel: 8x + 7y = 144 und x + y = 20\n1) Beide Gleichungen nach y umstellen.\n8x + 7y = 144 – − 8x\n7y = 144 - 8x – : 7\ny = 144/7 - 8/7·x\nx + y = 20 – − x\ny = 20 - x\n2) Beide Funktionen in ein geeignetes Koordinatensystem zeichnen.\n3) Den Schnittpunkt ablesen.\n4) Lösungsmenge notieren.", "excerpt": "Beispiel: 8x + 7y = 144 und x + y = 20 1) Beide Gleichungen nach y umstellen. 8x + 7y = 144 – − 8x", "diagram": "<svg viewBox=\"0 0 330 260\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"44.3\" y1=\"234\" x2=\"44.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"68.8\" y1=\"234\" x2=\"68.8\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"93.3\" y1=\"234\" x2=\"93.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"117.8\" y1=\"234\" x2=\"117.8\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"142.3\" y1=\"234\" x2=\"142.3\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"166.9\" y1=\"234\" x2=\"166.9\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"191.4\" y1=\"234\" x2=\"191.4\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"215.9\" y1=\"234\" x2=\"215.9\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"240.4\" y1=\"234\" x2=\"240.4\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"265\" y1=\"234\" x2=\"265\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"289.5\" y1=\"234\" x2=\"289.5\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"314\" y1=\"234\" x2=\"314\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"234\" x2=\"314\" y2=\"234\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"215.8\" x2=\"314\" y2=\"215.8\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"197.7\" x2=\"314\" ", "plain": "Beispiel 1: L = {(5|3)}\nDenke dir zwei Gleichungen aus und setze x = 5 und y = 3 ein.\n2x + y = 2·5 + 3 = 13\nx - 2y = 5 - 2·3 = -1\nEin passendes LGS ist also: 2x + y = 13 und x - 2y = -1.\nBeispiel 2: L = {(1|2)}\nZeichne den Punkt (1|2) in ein Koordinatensystem und lege zwei beliebige Geraden durch ihn.", "excerpt": "Beispiel 1: L = {(5|3)} Denke dir zwei Gleichungen aus und setze x = 5 und y = 3 ein. 2x + y = 2·5 + 3 = 13", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"224\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"88.4\" y1=\"224\" x2=\"88.4\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"144.8\" y1=\"224\" x2=\"144.8\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"201.2\" y1=\"224\" x2=\"201.2\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"257.6\" y1=\"224\" x2=\"257.6\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"314\" y1=\"224\" x2=\"314\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"224\" x2=\"314\" y2=\"224\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"182.4\" x2=\"314\" y2=\"182.4\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"140.8\" x2=\"314\" y2=\"140.8\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"99.2\" x2=\"314\" y2=\"99.2\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"57.6\" x2=\"314\" y2=\"57.6\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"16\" x2=\"314\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"182.4\" x2=\"318\" y2=\"182.4\" stroke=\"#1f2937\" stroke-width=\"1.8\"/><polygon points=\" " y2=\"57.6\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"81.4\" y=\"61.6\" font-size=\"11\" fill=\"#8b97a8\" text-anchor=\"end\" font-weight=\"500\">3</text><line x1=\"85.4\" y1=\"16\" x2=\"91.4\" y2=\"16\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"81.4\" y=\"20\" font-size=\"11\" fill=\"#8b97a8\" text-anchor=\"end\" font-weight=\"500\">4</text><text x=\"318\" y=\"174.4\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"end\" font-weight=\"600\" font-style=\"italic\">x</text><text x=\"97.4\" y=\"18\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"start\" font-weight=\"600\" font-style=\"italic\">y</text><line x1=\"32\" y1=\"182.4\" x2=\"257.6\" y2=\"16\" stroke=\"#4338ca\" stroke-width=\"2.6\"/><line x1=\"32\" y1=\"57.6\" x2=\"314\" y2=\"161.6\" stroke=\"#0d9488\" stroke-width=\"2.6\"/><circle cx=\"144.8\" cy=\"99.2\" r=\"5.4\" fill=\"#e11d48\" stroke=\"none\"/><text x=\"232.2\" y=\"32.6\" font-size=\"13\" fill=\"#e11d48\" text-anchor=\"middle\" font-weight=\"700\">Schnittpunkt (1|2)</text></svg>"}, {"id": "r100", "title": "Thaleskreis", "page": 51, "category": "Thaleskreis & Zentrische Streckung", "body": "**Satz des Thales:** Liegt der Punkt P auf einem Halbkreis über der Strecke AB (dem Durchmesser), so hat das Dreieck ABP bei P einen **rechten Winkel**.\n## Übung\nWählt man P **nicht** auf dem Halbkreis, ist der Winkel bei P nicht 90°.\n$ β = 30°, α = 60° ‖ Beispiel 1\n$ β = 53°, α = 27° ‖ Beispiel 2", "plain": "Satz des Thales: Liegt der Punkt P auf einem Halbkreis über der Strecke AB (dem Durchmesser), so hat das Dreieck ABP bei P einen rechten Winkel.\nÜbung\nWählt man P nicht auf dem Halbkreis, ist der Winkel bei P nicht 90°.\nβ = 30°, α = 60° – Beispiel 1\nβ = 53°, α = 27° – Beispiel 2", "excerpt": "Satz des Thales: Liegt der Punkt P auf einem Halbkreis über der Strecke AB (dem Durchmesser), so hat das Dreieck ABP bei P einen rechten Winkel. Übung Wählt man P nicht auf dem Halbkreis, ist der Winkel bei P nicht 90°.", "diagram": "<svg viewBox=\"0 30 330 212\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><path d=\"M 285 175 A 120 120 0 0 0 45 175\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.8\"/><line x1=\"45\" y1=\"175\" x2=\"285\" y2=\"175\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><line x1=\"45\" y1=\"175\" x2=\"228.6\" y2=\"73.2\" stroke=\"#4338ca\" stroke-width=\"2.8\"/><line x1=\"285\" y1=\"175\" x2=\"228.6\" y2=\"73.2\" stroke=\"#4338ca\" stroke-width=\"2.8\"/><polyline points=\"217.2,79.5 223.5,90.9 234.9,84.6\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"1.6\"/><circle cx=\"165\" cy=\"175\" r=\"4\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"165\" y=\"193\" font-size=\"12.5\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"600\">M</text><text x=\"33\" y=\"180\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"298\" y=\"180\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"234.6\" y=\"63.2\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\">C</text><text x=\"208.6\" y=\"115.2\" font-size=\"12.5\" fill=\"#e11d48\" text-anchor=\"middle\" font-weight=\"700\">90°</text></svg>"}, {"id": "r101", "title": "Winkelhalbierende", "page": 52, "category": "Thaleskreis & Zentrische Streckung", "body": "Eine **Winkelhalbierende** ist eine Halbgerade, die einen Winkel in zwei gleich große Winkel teilt.", "plain": "Eine Winkelhalbierende ist eine Halbgerade, die einen Winkel in zwei gleich große Winkel teilt.", "excerpt": "Eine Winkelhalbierende ist eine Halbgerade, die einen Winkel in zwei gleich große Winkel teilt.", "diagram": null}, {"id": "r102", "title": "Lot", "page": 52, "category": "Thaleskreis & Zentrische Streckung", "body": "Ein **Lot** ist die kürzeste Strecke von einem Punkt zu einer Geraden bzw. zum Rand eines Objekts. Es steht immer im **rechten Winkel** dazu.", "plain": "Ein Lot ist die kürzeste Strecke von einem Punkt zu einer Geraden bzw. zum Rand eines Objekts. Es steht immer im rechten Winkel dazu.", "excerpt": "Ein Lot ist die kürzeste Strecke von einem Punkt zu einer Geraden bzw. zum Rand eines Objekts. Es steht immer im rechten Winkel dazu.", "diagram": null}, {"id": "r103", "title": "Mittelsenkrechte", "page": 52, "category": "Thaleskreis & Zentrische Streckung", "body": "Die **Mittelsenkrechte** einer Strecke steht senkrecht auf ihr und geht durch ihren Mittelpunkt.\n- Zeichne zwei bis drei Mittelsenkrechte eines Dreiecks.\n- Ihr Schnittpunkt ist der Mittelpunkt des **Umkreises**.", "plain": "Die Mittelsenkrechte einer Strecke steht senkrecht auf ihr und geht durch ihren Mittelpunkt.\nZeichne zwei bis drei Mittelsenkrechte eines Dreiecks.\nIhr Schnittpunkt ist der Mittelpunkt des Umkreises.", "excerpt": "Die Mittelsenkrechte einer Strecke steht senkrecht auf ihr und geht durch ihren Mittelpunkt. Zeichne zwei bis drei Mittelsenkrechte eines Dreiecks. Ihr Schnittpunkt ist der Mittelpunkt des Umkreises.", "diagram": "<svg viewBox=\"26.7 25.1 257.4 257.4\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"155.4\" cy=\"153.8\" r=\"110.7\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.8\"/><line x1=\"161.4\" y1=\"213.9\" x2=\"155.4\" y2=\"153.8\" stroke=\"#4338ca\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/><circle cx=\"160\" cy=\"200\" r=\"3\" fill=\"#4338ca\" stroke=\"none\"/><line x1=\"210.1\" y1=\"106.6\" x2=\"155.4\" y2=\"153.8\" stroke=\"#4338ca\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/><circle cx=\"197.5\" cy=\"117.5\" r=\"3\" fill=\"#4338ca\" stroke=\"none\"/><line x1=\"80.1\" y1=\"119.6\" x2=\"155.4\" y2=\"153.8\" stroke=\"#4338ca\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/><circle cx=\"97.5\" cy=\"127.5\" r=\"3\" fill=\"#4338ca\" stroke=\"none\"/><polygon points=\"60,210 260,190 135,45\" fill=\"#e0e7ff88\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><circle cx=\"155.4\" cy=\"153.8\" r=\"5\" fill=\"#4338ca\" stroke=\"none\"/><text x=\"166.4\" y=\"145.8\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\">M</text><text x=\"46\" y=\"215\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"274\" y=\"195\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"135\" y=\"35\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">C</text></svg>"}, {"id": "r104", "title": "Mittelsenkrechte und Umkreis", "page": 52, "category": "Thaleskreis & Zentrische Streckung", "body": "Zu jedem Dreieck ABC gibt es drei Mittelsenkrechte m_(a), m_(b) und m_(c).\n**Satz:** In jedem Dreieck schneiden sich die Mittelsenkrechten der drei Seiten in **einem Punkt**. Dieser Punkt ist der Mittelpunkt des Umkreises.", "plain": "Zu jedem Dreieck ABC gibt es drei Mittelsenkrechte ma, mb und mc.\nSatz: In jedem Dreieck schneiden sich die Mittelsenkrechten der drei Seiten in einem Punkt. Dieser Punkt ist der Mittelpunkt des Umkreises.", "excerpt": "Zu jedem Dreieck ABC gibt es drei Mittelsenkrechte ma, mb und mc. Satz: In jedem Dreieck schneiden sich die Mittelsenkrechten der drei Seiten in einem Punkt. Dieser Punkt ist der Mittelpunkt des Umkreises.", "diagram": "<svg viewBox=\"26.7 25.1 257.4 257.4\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"155.4\" cy=\"153.8\" r=\"110.7\" fill=\"none\" stroke=\"#8b97a8\" stroke-width=\"1.8\"/><line x1=\"161.4\" y1=\"213.9\" x2=\"155.4\" y2=\"153.8\" stroke=\"#4338ca\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/><circle cx=\"160\" cy=\"200\" r=\"3\" fill=\"#4338ca\" stroke=\"none\"/><line x1=\"210.1\" y1=\"106.6\" x2=\"155.4\" y2=\"153.8\" stroke=\"#4338ca\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/><circle cx=\"197.5\" cy=\"117.5\" r=\"3\" fill=\"#4338ca\" stroke=\"none\"/><line x1=\"80.1\" y1=\"119.6\" x2=\"155.4\" y2=\"153.8\" stroke=\"#4338ca\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/><circle cx=\"97.5\" cy=\"127.5\" r=\"3\" fill=\"#4338ca\" stroke=\"none\"/><polygon points=\"60,210 260,190 135,45\" fill=\"#e0e7ff88\" stroke=\"#1f2937\" stroke-width=\"2.6\"/><circle cx=\"155.4\" cy=\"153.8\" r=\"5\" fill=\"#4338ca\" stroke=\"none\"/><text x=\"166.4\" y=\"145.8\" font-size=\"14\" fill=\"#4338ca\" text-anchor=\"middle\" font-weight=\"800\">M</text><text x=\"46\" y=\"215\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">A</text><text x=\"274\" y=\"195\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">B</text><text x=\"135\" y=\"35\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"600\">C</text></svg>"}, {"id": "r105", "title": "Zentrische Streckung", "page": 53, "category": "Thaleskreis & Zentrische Streckung", "body": "Eine Originalfigur wird zur Bildfigur, indem man alle Eckpunkte mit einem **Streckungsfaktor** k von einem **Streckungszentrum** Z aus streckt (k > 1) oder staucht (0 < k < 1). Das Streckungszentrum ist immer ein Punkt.\n## Beispiel\nStreckung einer Strecke mit k = 2 und Z(0|0): Alle Abstände zu Z verdoppeln sich.\n## Verkleinern\nMit k = 0,5 halbieren sich alle Abstände zu Z.", "plain": "Eine Originalfigur wird zur Bildfigur, indem man alle Eckpunkte mit einem Streckungsfaktor k von einem Streckungszentrum Z aus streckt (k > 1) oder staucht (0 < k < 1). Das Streckungszentrum ist immer ein Punkt.\nBeispiel\nStreckung einer Strecke mit k = 2 und Z(0|0): Alle Abstände zu Z verdoppeln sich.\nVerkleinern\nMit k = 0,5 halbieren sich alle Abstände zu Z.", "excerpt": "Eine Originalfigur wird zur Bildfigur, indem man alle Eckpunkte mit einem Streckungsfaktor k von einem Streckungszentrum Z aus streckt (k > 1) oder staucht (0 < k < 1). Das Streckungszentrum ist immer ein Punkt. Beispiel Streckung einer Strecke mit k = 2 und Z(0|0): Alle Abstände zu Z verdoppeln sich.", "diagram": "<svg viewBox=\"0 0 330 388\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><svg x=\"0.0\" y=\"0\" width=\"330\" height=\"190\" viewBox=\"0 0 330 190\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"90.2\" y1=\"150\" x2=\"171.8\" y2=\"150\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"90.2\" y1=\"150\" x2=\"239.8\" y2=\"150\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"90.2\" y1=\"150\" x2=\"239.8\" y2=\"82\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"90.2\" y1=\"150\" x2=\"171.8\" y2=\"82\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><polygon points=\"171.8,150 239.8,150 239.8,82 171.8,82\" fill=\"#4338ca26\" stroke=\"#4338ca\" stroke-width=\"2.6\"/><polygon points=\"131,150 165,150 165,116 131,116\" fill=\"#0d948830\" stroke=\"#0d9488\" stroke-width=\"2.6\"/><circle cx=\"90.2\" cy=\"150\" r=\"4.6\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"88.2\" y=\"170\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">Z</text><rect x=\"14\" y=\"12\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#0d9488\"/><text x=\"32\" y=\"23\" font-size=\"12.5\" fill=\"#0d9488\" text-anchor=\"start\" font-weight=\"700\">Original</text><rect x=\"112\" y=\"12\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#4338ca\"/><text x=\"130\" y=\"23\" font-size=\"12.5\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"700\">Bild (k = 2)</text></svg><svg x=\"0.0\" y=\"198\" width=\"330\" height=\"190\" viewBox=\"0 0 330 190\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"125.4\" y1=\"150\" x2=\"168.6\" y2=\"150\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"125.4\" y1=\"150\" x2=\"204.6\" y2=\"150\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"125.4\" y1=\"150\" x2=\"204.6\" y2=\"114\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"125.4\" y1=\"150\" x2=\"168.6\" y2=\"114\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><polygon points=\"147,150 165,150 165,132 147,132\" fill=\"#4338ca26\" stroke=\"#4338ca\" stroke-width=\"2.6\"/><polygon points=\"168.6,150 204.6,150 204.6,114 168.6,114\" fill=\"#0d948830\" stroke=\"#0d9488\" stroke-width=\"2.6\"/><circle cx=\"125.4\" cy=\"150\" r=\"4.6\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"123.4\" y=\"170\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">Z</text><rect x=\"14\" y=\"12\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#0d9488\"/><text x=\"32\" y=\"23\" font-size=\"12.5\" fill=\"#0d9488\" text-anchor=\"start\" font-weight=\"700\">Original</text><rect x=\"112\" y=\"12\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#4338ca\"/><text x=\"130\" y=\"23\" font-size=\"12.5\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"700\">Bild (k = 0,5)</text></svg></svg>"}, {"id": "r106", "title": "Fachbegriffe der zentrischen Streckung", "page": 53, "category": "Thaleskreis & Zentrische Streckung", "body": "Originalpunkt, Bildpunkt, Originalfigur, Bildfigur, Streckungsfaktor k, Streckungszentrum Z.\n$ |ZA'| = k · |ZA| ‖ Abstand Bildpunkt – Zentrum", "plain": "Originalpunkt, Bildpunkt, Originalfigur, Bildfigur, Streckungsfaktor k, Streckungszentrum Z.\n|ZA'| = k · |ZA| – Abstand Bildpunkt – Zentrum", "excerpt": "Originalpunkt, Bildpunkt, Originalfigur, Bildfigur, Streckungsfaktor k, Streckungszentrum Z. |ZA'| = k · |ZA| – Abstand Bildpunkt – Zentrum", "diagram": null}, {"id": "r107", "title": "Flächeninhalt bei zentrischer Streckung", "page": 54, "category": "Thaleskreis & Zentrische Streckung", "body": "Streckt man eine Figur mit dem Faktor k, wächst die Fläche mit dem Faktor k².\n$ A_(Bild) = A_(Original) · k²\n$ {A_(Bild)/A_(Original)} = k²\n$ k = √({A_(Bild)/A_(Original)})\n## Beispiel: Verhältnis der Flächen 96 : 120\n$ k = √({96/120}) = √(0,8) ≈ 0,894", "plain": "Streckt man eine Figur mit dem Faktor k, wächst die Fläche mit dem Faktor k².\nABild = AOriginal · k²\nABild/AOriginal = k²\nk = √(ABild/AOriginal)\nBeispiel: Verhältnis der Flächen 96 : 120\nk = √(96/120) = √(0,8) ≈ 0,894", "excerpt": "Streckt man eine Figur mit dem Faktor k, wächst die Fläche mit dem Faktor k². ABild = AOriginal · k² ABild/AOriginal = k²", "diagram": null}, {"id": "r108", "title": "Beispiel: Streckung eines Quadrats mit k = 3", "page": 54, "category": "Thaleskreis & Zentrische Streckung", "body": "## Z(0|1), Quadrat ABCD, k = 3\n$ |ZA| = 1 ⇒ |ZA'| = 1·3 = 3 ⇒ A'(3|1)\n$ |ZC| = 1,41 ⇒ |ZC'| = 1,41·3 = 4,23 ⇒ C'(3|4)\n$ A_(Q) = 1 cm · 1 cm = 1 cm²\n$ A_(Q') = 3 cm · 3 cm = 9 cm² = 9 · A_(Q) ‖ Flächenfaktor k² = 9", "plain": "Z(0|1), Quadrat ABCD, k = 3\n|ZA| = 1 ⇒ |ZA'| = 1·3 = 3 ⇒ A'(3|1)\n|ZC| = 1,41 ⇒ |ZC'| = 1,41·3 = 4,23 ⇒ C'(3|4)\nAQ = 1 cm · 1 cm = 1 cm²\nAQ' = 3 cm · 3 cm = 9 cm² = 9 · AQ – Flächenfaktor k² = 9", "excerpt": "Z(0|1), Quadrat ABCD, k = 3 |ZA| = 1 ⇒ |ZA'| = 1·3 = 3 ⇒ A'(3|1) |ZC| = 1,41 ⇒ |ZC'| = 1,41·3 = 4,23 ⇒ C'(3|4)", "diagram": "<svg viewBox=\"0 0 330 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"85.8\" y1=\"150\" x2=\"172.2\" y2=\"150\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"85.8\" y1=\"150\" x2=\"244.2\" y2=\"150\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"85.8\" y1=\"150\" x2=\"244.2\" y2=\"78\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><line x1=\"85.8\" y1=\"150\" x2=\"172.2\" y2=\"78\" stroke=\"#8b97a8\" stroke-width=\"1.3\" stroke-dasharray=\"4,3\"/><polygon points=\"172.2,150 244.2,150 244.2,78 172.2,78\" fill=\"#4338ca26\" stroke=\"#4338ca\" stroke-width=\"2.6\"/><polygon points=\"114.6,150 138.6,150 138.6,126 114.6,126\" fill=\"#0d948830\" stroke=\"#0d9488\" stroke-width=\"2.6\"/><circle cx=\"85.8\" cy=\"150\" r=\"4.6\" fill=\"#1f2937\" stroke=\"none\"/><text x=\"83.8\" y=\"170\" font-size=\"14\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\">Z</text><rect x=\"14\" y=\"12\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#0d9488\"/><text x=\"32\" y=\"23\" font-size=\"12.5\" fill=\"#0d9488\" text-anchor=\"start\" font-weight=\"700\">Original</text><rect x=\"112\" y=\"12\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#4338ca\"/><text x=\"130\" y=\"23\" font-size=\"12.5\" fill=\"#4338ca\" text-anchor=\"start\" font-weight=\"700\">Bild (k = 3)</text></svg>"}, {"id": "r109", "title": "Allgemeine Formel für Flächen bei Streckung", "page": 55, "category": "Zahlenmengen & Wurzeln", "body": "Sei F eine Figur und F' ihre Bildfigur bei zentrischer Streckung mit dem Faktor k.\n$ A_(F') = A_(F) · k²\n## Umstellen nach k\n$ A_(F') = A_(F) · k² ‖ : A_(F)\n$ {A_(F')/A_(F)} = k² ‖ √\n$ k = √({A_(F')/A_(F)})", "plain": "Sei F eine Figur und F' ihre Bildfigur bei zentrischer Streckung mit dem Faktor k.\nAF' = AF · k²\nUmstellen nach k\nAF' = AF · k² – : AF\nAF'/AF = k² – √\nk = √(AF'/AF)", "excerpt": "Sei F eine Figur und F' ihre Bildfigur bei zentrischer Streckung mit dem Faktor k. AF' = AF · k² Umstellen nach k", "diagram": null}, {"id": "r110", "title": "Zahlenmengen und Unendlichkeit", "page": 55, "category": "Zahlenmengen & Wurzeln", "body": "T: Menge§Beispiele§Größe ;; ℕ§1, 2, 3, 4, 5, …§abzählbar unendlich ;; ℤ§0, 1, -1, 2, -2, …§abzählbar unendlich ;; ℚ§0, {1/2}, {1/4}, {-4/7}, {2/3}, …§abzählbar unendlich ;; ℝ§√2, √4, √6, √8, …§überabzählbar unendlich\n√2 = 1,41421356… ist eine **irrationale** Zahl: unendlich viele Nachkommastellen, keine Periode. Sie liegt in ℝ, aber nicht in ℚ.", "plain": "Menge, Beispiele, Größe; ℕ, 1, 2, 3, 4, 5, …, abzählbar unendlich; ℤ, 0, 1, -1, 2, -2, …, abzählbar unendlich; ℚ, 0, 1/2, 1/4, -4/7, 2/3, …, abzählbar unendlich; ℝ, √2, √4, √6, √8, …, überabzählbar unendlich\n√2 = 1,41421356… ist eine irrationale Zahl: unendlich viele Nachkommastellen, keine Periode. Sie liegt in ℝ, aber nicht in ℚ.", "excerpt": "Menge, Beispiele, Größe; ℕ, 1, 2, 3, 4, 5, …, abzählbar unendlich; ℤ, 0, 1, -1, 2, -2, …, abzählbar unendlich; ℚ, 0, 1/2, 1/4, -4/7, 2/3, …, abzählbar unendlich; ℝ, √2, √4, √6, √8, …, überabzählbar unendlich √2 = 1,41421356… ist eine irrationale Zahl: unendlich viele Nachkommastellen, keine Periode. Sie liegt in ℝ, aber nicht in ℚ.", "diagram": "<svg viewBox=\"0 0 330 112\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\" 00\" y1=\"55\" x2=\"300\" y2=\"69\" stroke=\"#1f2937\" stroke-width=\"1.4\"/><text x=\"30\" y=\"85\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"500\">0</text><text x=\"165\" y=\"85\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"500\">1</text><text x=\"300\" y=\"85\" font-size=\"12\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"500\">2</text><line x1=\"220.9\" y1=\"62\" x2=\"220.9\" y2=\"36\" stroke=\"#0d9488\" stroke-width=\"1.2\" stroke-dasharray=\"2,2\"/><circle cx=\"220.9\" cy=\"62\" r=\"5.5\" fill=\"#0d9488\" stroke=\"none\"/><text x=\"220.9\" y=\"30\" font-size=\"13\" fill=\"#0d9488\" text-anchor=\"middle\" font-weight=\"700\">√2 ≈ 1,414</text><text x=\"165\" y=\"106\" font-size=\"11\" fill=\"#8b97a8\" text-anchor=\"middle\" font-weight=\"500\">unendlich viele Nachkommastellen, keine Periode</text></svg>"}, {"id": "r111", "title": "Verschachtelte Zahlenmengen", "page": 56, "category": "Zahlenmengen & Wurzeln", "body": "$ ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ\nJede natürliche Zahl ist auch ganz, jede ganze Zahl auch rational und jede rationale Zahl auch reell.", "plain": "ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ\nJede natürliche Zahl ist auch ganz, jede ganze Zahl auch rational und jede rationale Zahl auch reell.", "excerpt": "ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ Jede natürliche Zahl ist auch ganz, jede ganze Zahl auch rational und jede rationale Zahl auch reell.", "diagram": "<svg viewBox=\"0 0 330 270\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><circle cx=\"165\" cy=\"135\" r=\"125\" fill=\"#eef0fd\" stroke=\"#4338ca\" stroke-width=\"1.6\"/><text x=\"165\" y=\"32\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">ℝ</text><circle cx=\"165\" cy=\"135\" r=\"95\" fill=\"#dfe3fb\" stroke=\"#4338ca\" stroke-width=\"1.6\"/><text x=\"165\" y=\"62\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">ℚ</text><circle cx=\"165\" cy=\"135\" r=\"64\" fill=\"#c7cdf7\" stroke=\"#4338ca\" stroke-width=\"1.6\"/><text x=\"165\" y=\"93\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">ℤ</text><circle cx=\"165\" cy=\"135\" r=\"34\" fill=\"#a9b1f1\" stroke=\"#4338ca\" stroke-width=\"1.6\"/><text x=\"165\" y=\"123\" font-size=\"18\" fill=\"#1f2937\" text-anchor=\"middle\" font-weight=\"800\" stroke=\"none\">ℕ</text></svg>"}, {"id": "r112", "title": "0,~(9) = 1", "page": 56, "category": "Zahlenmengen & Wurzeln", "body": "Periodisch 0,999… ist genau gleich 1:\n$ {1/3} = 0,~(3)\n$ 3 · {1/3} = 1\n$ 3 · 0,~(3) = 0,~(9) = 1", "plain": "Periodisch 0,999… ist genau gleich 1:\n1/3 = 0,3\n3 · 1/3 = 1\n3 · 0,3 = 0,9 = 1", "excerpt": "Periodisch 0,999… ist genau gleich 1: 1/3 = 0,3 3 · 1/3 = 1", "diagram": null}, {"id": "r113", "title": "Quadratwurzeln und Quadratzahlen", "page": 56, "category": "Zahlenmengen & Wurzeln", "body": "Die „normale“ Wurzel heißt **Quadratwurzel** (zweite Wurzel).\n## Quadratzahlen\n$ 1² = 1; 5² = 25; 11² = 121\n$ (-7)² = 49; (-5)² = 25; ({1/2})² = {1/4}\n## Wurzeln\n$ √(121) = 11; √(25) = 5; √(49) = 7\n! Die Wurzel ist immer positiv: √(49) = 7 (nicht -7).\n## Gleichung x² = 49\n$ x² = 49 ‖ ±√\n$ x = ±7 ‖ denn 7² = 49 und (-7)² = 49", "plain": "Die „normale“ Wurzel heißt Quadratwurzel (zweite Wurzel).\nQuadratzahlen\n1² = 1; 5² = 25; 11² = 121\n(-7)² = 49; (-5)² = 25; (1/2)² = 1/4\nWurzeln\n√(121) = 11; √(25) = 5; √(49) = 7\nDie Wurzel ist immer positiv: √(49) = 7 (nicht -7).\nGleichung x² = 49\nx² = 49 – ±√\nx = ±7 – denn 7² = 49 und (-7)² = 49", "excerpt": "Die „normale“ Wurzel heißt Quadratwurzel (zweite Wurzel). Quadratzahlen 1² = 1; 5² = 25; 11² = 121", "diagram": null}, {"id": "r114", "title": "Das Heron-Verfahren", "page": 57, "category": "Zahlenmengen & Wurzeln", "body": "Rekursives Verfahren zur Näherung von √a:\n$ x_(n+1) = {1/2} · (x_(n) + {a/x_(n)})\n## Beispiel: √2 mit a = 2\nStartwert x_(0) nahe an √a: √1 < √2 < √4, also 1 < √2 < 2. Wähle x_(0) = 2.\n$ x_(1) = {1/2}·(2 + {2/2}) = 1,5\n$ x_(2) = {1/2}·(1,5 + {2/1,5}) ≈ 1,417\n$ x_(3) = {1/2}·(1,417 + {2/1,417}) ≈ 1,414", "plain": "Rekursives Verfahren zur Näherung von √a:\nxn+1 = 1/2 · (xn + a/xn)\nBeispiel: √2 mit a = 2\nStartwert x0 nahe an √a: √1 < √2 < √4, also 1 < √2 < 2. Wähle x0 = 2.\nx1 = 1/2·(2 + 2/2) = 1,5\nx2 = 1/2·(1,5 + 2/1,5) ≈ 1,417\nx3 = 1/2·(1,417 + 2/1,417) ≈ 1,414", "excerpt": "Rekursives Verfahren zur Näherung von √a: xn+1 = 1/2 · (xn + a/xn) Beispiel: √2 mit a = 2", "diagram": null}, {"id": "r115", "title": "Produkte und Quotienten von Wurzeln", "page": 57, "category": "Zahlenmengen & Wurzeln", "body": "Das Produkt zweier irrationaler Zahlen kann rational sein – nämlich dann, wenn unter der Wurzel eine Quadratzahl steht. Nicht alle Wurzeln sind irrational (z. B. √4 = 2).\n! Für a > 0 und b > 0 gilt:\n$ √(a)·√(b) = √(a·b)\n$ {√(a)/√(b)} = √({a/b})\n$ √(5)·√(6) = √(30)", "plain": "Das Produkt zweier irrationaler Zahlen kann rational sein – nämlich dann, wenn unter der Wurzel eine Quadratzahl steht. Nicht alle Wurzeln sind irrational (z. B. √4 = 2).\nFür a > 0 und b > 0 gilt:\n√(a)·√(b) = √(a·b)\n√(a)/√(b) = √(a/b)\n√(5)·√(6) = √(30)", "excerpt": "Das Produkt zweier irrationaler Zahlen kann rational sein – nämlich dann, wenn unter der Wurzel eine Quadratzahl steht. Nicht alle Wurzeln sind irrational (z. B. √4 = 2). Für a > 0 und b > 0 gilt: √(a)·√(b) = √(a·b)", "diagram": null}, {"id": "r116", "title": "Quadratische Funktionen", "page": 58, "category": "Quadratische Funktionen", "body": "$ f(x) = x²\nT: x§-2§-1,5§-1§-0,5§0§0,5§1§1,5§2 ;; f(x)§4§2,25§1§0,25§0§0,25§1§2,25§4\nDer Graph heißt **Parabel**, ihr tiefster (oder höchster) Punkt **Scheitelpunkt**.", "plain": "f(x) = x²\nx, -2, -1,5, -1, -0,5, 0, 0,5, 1, 1,5, 2; f(x), 4, 2,25, 1, 0,25, 0, 0,25, 1, 2,25, 4\nDer Graph heißt Parabel, ihr tiefster (oder höchster) Punkt Scheitelpunkt.", "excerpt": "f(x) = x² x, -2, -1,5, -1, -0,5, 0, 0,5, 1, 1,5, 2; f(x), 4, 2,25, 1, 0,25, 0, 0,25, 1, 2,25, 4 Der Graph heißt Parabel, ihr tiefster (oder höchster) Punkt Scheitelpunkt.", "diagram": "<svg viewBox=\"0 0 330 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><style>text{font-family:-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#f6f7f9;stroke-width:2.6px;stroke-linejoin:round}line,polyline,path,polygon,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style><line x1=\"32\" y1=\"224\" x2=\"32\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"79\" y1=\"224\" x2=\"79\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"126\" y1=\"224\" x2=\"126\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"173\" y1=\"224\" x2=\"173\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"220\" y1=\"224\" x2=\"220\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"267\" y1=\"224\" x2=\"267\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"314\" y1=\"224\" x2=\"314\" y2=\"16\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"224\" x2=\"314\" y2=\"224\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"203.2\" x2=\"314\" y2=\"203.2\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"182.4\" x2=\"314\" y2=\"182.4\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"161.6\" x2=\"314\" y2=\"161.6\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"140.8\" x2=\"314\" y2=\"140.8\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"120\" x2=\"314\" y2=\"120\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"99.2\" x2=\"314\" y2=\"99.2\" stroke=\"#e3e6ec\" stroke-width=\"1\"/><line x1=\"32\" y1=\"78.4\" x2=\"314\" y2=\"78.4\" stroke=\"#e3e6ec\" stroke-wid
