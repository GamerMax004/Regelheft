<body>

<header class="top">
  <div class="toprow"><a class="brand" href="index.html"><h1>Regelheft<span> Mathematik</span></h1></a><div data-account></div></div>
</header>

<main>
<div class="page page--narrow">
  <h2 class="page-title" id="authTitle">Anmelden</h2>
  <p class="page-lead">Mit einem Konto kannst du die KI-Aufgabenhilfe nutzen. Das Regelheft selbst bleibt für alle offen.</p>

  <div class="auth-card" id="authCard">
    <div class="auth-tabs" role="tablist"><button type="button" id="authTabLogin" class="on" role="tab">Anmelden</button><button type="button" id="authTabReg" role="tab">Registrieren</button></div>
    <form id="authForm" novalidate>
      <input class="auth-in" id="authUser" placeholder="Benutzername" autocomplete="username" autocapitalize="none" autocorrect="off" maxlength="30">
      <input class="auth-in" id="authPw" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="current-password" maxlength="100">
      <div id="authRegOnly" style="display:none">
        <label class="auth-chk"><input type="checkbox" id="authAge"><span>Ich bin mindestens 16 Jahre alt oder habe die Erlaubnis meiner Erziehungsberechtigten.</span></label>
        <label class="auth-chk"><input type="checkbox" id="authConsent"><span>Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen. Ich weiß, dass meine Chats mit der KI (inklusive einer kleinen Vorschau meiner Fotos) gespeichert werden, vom Betreiber eingesehen werden können und zur Verarbeitung an einen KI-Anbieter (Google oder Groq) gesendet werden.</span></label>
      </div>
      <div class="auth-err" id="authErr" role="alert"></div>
      <button class="ai-btn" id="authSubmit" type="submit">Anmelden</button>
    </form>
  </div>

  <div class="auth-card is-hidden" id="authDone">
    <div class="auth-success">Du bist angemeldet als <b id="authDoneUser"></b>.</div>
    <div class="btn-row">
      <a class="ai-btn" href="ki.html">KI-Aufgabenhilfe</a>
      <a class="ai-btn ghost" href="index.html">Zum Regelheft</a>
      <a class="ai-btn ghost" href="konto.html">Mein Konto</a>
    </div>
  </div>
</div>
</main>

<footer id="siteFooter"></footer>
