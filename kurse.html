<body data-kurse="1">
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header class="top">
  <div class="toprow"><a class="brand" href="index.html"><h1>Regelheft<span> Mathematik</span></h1></a><div data-account></div></div>
</header>

<main id="main" tabindex="-1">
<div class="page practice kurse-page">
  <div id="kHero" class="k-hero-row">
    <div><h2 class="page-title">Meine Kurse</h2>
    <p class="page-lead">Aus deinen Unterlagen wird ein Kurs: Lernpfad, Karteikarten, Regeln, Test und Podcast.</p></div>
  </div>

  <div class="page-note is-hidden" id="pOff"></div>
  <div class="is-hidden" id="pPro"><span id="pProText"></span><span id="pProBtns"></span></div>

  <section id="pcSec"></section>

  <!-- Für die Karteikarten-Runde (ueben.js); die Auswahl selbst wird hier nicht gezeigt -->
  <section id="pSetup" class="is-hidden"><div id="pSource"></div><div id="pCount"></div><button id="pStart" type="button" hidden></button><div id="pMsg"></div><div id="pStats"></div></section>

  <section id="pRun" class="is-hidden">
    <div class="p-top"><button class="p-quit" id="pQuit" type="button">Beenden</button><div class="p-progress" id="pProg" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pBar"></i></div><span class="p-num" id="pNum" aria-live="polite"></span></div>
    <div class="p-card" id="pCard" role="button" tabindex="0" aria-label="Karte umdrehen">
      <div class="p-front" id="pFront"><span class="cat-pill" id="pCat"></span><h3 id="pTitle"></h3><div class="p-hint" aria-hidden="true"><span data-icon="rotate" data-size="22"></span></div></div>
      <div class="p-back is-hidden" id="pBack">
        <h3 id="pTitle2"></h3>
        <div class="overlay-body p-body" id="pBody"></div>
        <div class="diagram-section is-hidden" id="pDiagSec"><div class="label">Skizze</div><div class="diagram-frame" id="pDiag"></div></div>
        <a class="link p-open" id="pOpen" href="index.html">Im Regelheft öffnen</a>
      </div>
    </div>
    <div class="p-actions is-hidden" id="pActions">
      <button class="p-btn again" id="pAgain" type="button" aria-keyshortcuts="ArrowLeft"><span data-icon="rotate" data-size="20"></span>Nochmal</button>
      <button class="p-btn know" id="pKnow" type="button" aria-keyshortcuts="ArrowRight"><span data-icon="check" data-size="20"></span>Gewusst</button>
    </div>
  </section>

  <section id="pDone" class="is-hidden">
    <div class="p-done">
      <div class="p-big" id="pDoneBig"></div>
      <p class="page-lead" id="pDoneSub"></p>
      <div class="btn-row">
        <button class="ai-btn" id="pRepeat" type="button">Verpasste wiederholen</button>
        <button class="ai-btn ghost" id="pNew" type="button">Neue Runde</button>
        <a class="ai-btn ghost" href="kurse.html">Zu meinen Kursen</a>
      </div>
    </div>
  </section>
</div>
